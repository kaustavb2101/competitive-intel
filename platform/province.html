<script>/* set theme before paint to avoid flash; ?theme= overrides, else saved, else dark */
(function(){try{var q=new URLSearchParams(location.search).get('theme');var t=q||localStorage.getItem('autox-theme')||'dark';document.documentElement.dataset.theme=(t==='light'?'light':'dark');}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Province · เงินไชโย — Deep-Dive</title>

<style>
:root{--ink:#070a11;--card:#0e131f;--cardln:#1d2738;--hi:#eef1f7;--txt:#c7cedd;--mid:#8590a6;--dim:#65718c;
 --gold:#E6B450;--red:#E0474B;--mag:#D65AA0;--blue:#5B7CFA;--orange:#E0902F;--teal:#1FA38C;--purp:#9a7fd6;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--ink);color:var(--txt)}
#map{position:fixed;inset:0;background:#070a11}
.mono{font-family:'IBM Plex Mono',monospace}
canvas{outline:none}

/* top brand strip (KPI chips) */
#strip{position:fixed;top:44px;left:0;right:0;z-index:9;display:flex;gap:6px;padding:9px 12px;overflow-x:auto;
 background:linear-gradient(180deg,rgba(7,10,17,.88),rgba(7,10,17,0));scrollbar-width:none;align-items:center}
#strip::-webkit-scrollbar{display:none}
#strip .ttl{font:700 13px 'IBM Plex Sans Thai';color:#fff;white-space:nowrap;margin-right:4px}
#strip .ttl b{color:var(--gold)}
.bchip{flex:none;background:rgba(20,26,40,.82);border:1px solid #2a3450;border-radius:7px;padding:4px 9px;
 font:600 11px 'IBM Plex Mono';color:var(--txt);backdrop-filter:blur(6px);white-space:nowrap}
.bchip b{color:#fff;margin-left:3px}
.bchip .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}

/* side cards */
.side{position:fixed;top:96px;bottom:14px;width:316px;z-index:8;background:rgba(14,19,31,.93);
 border:1px solid var(--cardln);border-radius:13px;backdrop-filter:blur(13px);display:flex;flex-direction:column;
 box-shadow:0 12px 40px rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#left{left:14px}#right{right:14px}
.side h2{font:600 11px 'IBM Plex Mono';color:var(--dim);text-transform:uppercase;letter-spacing:.5px;padding:13px 15px 0}
.side .scroll{overflow-y:auto;padding:11px 15px 16px;flex:1}
.cardttl{padding:13px 15px 4px;border-bottom:1px solid #1a2236}
.cardttl .a{font:700 14px 'IBM Plex Sans Thai';color:var(--hi)}
.cardttl .b{font-size:11px;color:var(--mid);margin-top:1px}

.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #161d2c;font-size:12.5px}
.stat .k{color:var(--mid)}.stat .v{font-family:'IBM Plex Mono';color:var(--hi)}

/* provenance tags */
.tag{font:600 9px 'IBM Plex Mono';text-transform:uppercase;letter-spacing:.4px;padding:2px 5px;border-radius:5px;margin-left:6px;vertical-align:1px}
.tag.meas{background:rgba(31,163,140,.16);color:#3fc4ab;border:1px solid rgba(31,163,140,.4)}
.tag.est{background:rgba(224,169,59,.14);color:#e0a93b;border:1px solid rgba(224,169,59,.4)}

/* within-10km grouped count rows */
.kgrp{margin-bottom:11px}
.kgrp .gh{font:600 10px 'IBM Plex Mono';color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:0 0 3px}
.krow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #161d2c;font-size:12.5px}
.krow .sw{width:8px;height:8px;border-radius:50%;flex:none}
.krow .lab{color:var(--txt);flex:1}
.krow b{font-family:'IBM Plex Mono';color:var(--hi);font-weight:600}

/* workforce measured block + occupation proxy bars */
.wbox{background:#0a1018;border:1px solid #1c2740;border-radius:10px;padding:11px 12px;margin-bottom:11px}
.wbox .wr{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:12.5px}
.wbox .wr .k{color:var(--mid)}
.wbox .wr .v{font-family:'IBM Plex Mono';color:var(--hi)}
.wbox .wr .v small{color:var(--dim)}
.wbox .big{font:600 23px 'IBM Plex Mono';color:var(--gold);line-height:1.1}
.wbox .cap{font-size:11px;color:var(--mid);margin:1px 0 7px}
.occ .or{margin:6px 0}
.occ .ot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt);margin-bottom:2px}
.occ .ot b{font-family:'IBM Plex Mono';color:var(--mid);font-weight:600}
.occ .bar{height:7px;border-radius:4px;background:#141d2c;overflow:hidden}
.occ .bar i{display:block;height:100%;border-radius:4px}
.foot{font-size:10px;color:var(--dim);line-height:1.5;margin-top:8px}

/* right card: impacts + tables */
.imp{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #131b2a}
.imp .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.imp .t{font-size:12.5px;font-weight:600;color:var(--hi)}
.imp .d{font-size:11.5px;color:var(--mid);margin-top:1px;line-height:1.5}
.imp .tg{font:600 9px 'IBM Plex Mono';padding:1px 6px;border-radius:9px;margin-left:6px;vertical-align:1px}
.lead{font-size:12px;color:var(--mid);margin:2px 0 9px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
th{text-align:left;color:var(--dim);font:600 10px 'IBM Plex Mono';text-transform:uppercase;padding:6px 6px;border-bottom:1px solid var(--cardln)}
td{padding:6px 6px;border-bottom:1px solid #121a28}
td.n{color:var(--hi)}
.subtabs{display:flex;gap:3px;padding:8px 15px 0;border-bottom:1px solid #1a2236;flex:none;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.stb{flex:none;background:none;border:none;border-bottom:2px solid transparent;color:var(--mid);
 font:500 12px 'IBM Plex Sans Thai';padding:6px 7px;cursor:pointer;white-space:nowrap}
.stb.on{color:var(--hi);border-bottom-color:var(--gold)}
.view{display:none}.view.on{display:block}

/* controls */
#ctl{position:fixed;top:94px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:5px;
 background:rgba(14,19,31,.9);border:1px solid var(--cardln);border-radius:9px;padding:4px;backdrop-filter:blur(8px)}
#ctl button{background:none;border:none;color:var(--dim);font:500 11px 'IBM Plex Mono';padding:5px 9px;border-radius:6px;cursor:pointer}
#ctl button.on{background:#1b2740;color:var(--hi)}

/* mobile toggles */
#mtog{position:fixed;bottom:16px;left:0;right:0;z-index:9;display:none;justify-content:center;gap:10px}

.xbtn{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--mid);font-size:18px;cursor:pointer;display:none}

/* cascade (Region>Province>Branch) */

.cscrow label{font:600 10px 'IBM Plex Mono';color:var(--dim);text-transform:uppercase;letter-spacing:.5px;width:62px;flex:none}
.casc select{flex:1;min-width:0;background:#0a1018;border:1px solid #1c2740;color:var(--hi);
 font:500 12px 'IBM Plex Sans Thai';padding:6px 7px;border-radius:7px;cursor:pointer}
.casc select:disabled{color:var(--dim);cursor:not-allowed;opacity:.7}
.cscnote{font-size:10px;color:var(--dim);line-height:1.4;margin-top:1px}

/* POI legend overlay (bottom-center) */
#legendwrap{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:8;max-width:min(94vw,720px);
 background:rgba(14,19,31,.92);border:1px solid var(--cardln);border-radius:11px;padding:8px 10px 9px;
 backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,.4)}

#legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:6px;background:#0e1422;border:1px solid #1c2740;color:var(--dim);

.lg .sw{width:9px;height:9px;border-radius:50%;flex:none}
.lg b{font-family:'IBM Plex Mono';color:var(--mid);font-weight:600;margin-left:1px}
.lg.on b{color:var(--hi)}

.dtt{font-family:'IBM Plex Sans Thai';font-size:11.5px;max-width:230px;line-height:1.45}
.dtt b{color:#fff}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--red);background:var(--ink);z-index:99}

<script>window.initProvince=function(){
'use strict';
try{
const RY=window.RY;
const IDX=window.PROV_INDEX||null;
const SLUG=(new URLSearchParams(location.search).get('p')||'rayong').toLowerCase();
const BR=RY.branches||[];
const COMP=RY.competitors||[];
const POIS=RY.poi||{};
const DISTRICTS=RY.districts||null;
const provEn=RY.province_en||'', provTh=RY.province_th||'', reg=RY.region||'';
const BRAND={Srisawad:[224,71,75],Muangthai:[214,90,160],Tidlor:[91,124,250],Krungsri:[224,123,47]};
const GOLD=[230,180,80];

// canonical type->color map: single source of truth for map dots AND legend AND toggles (Rayong palette)
const POI_COLORS={
  vehicle_commerce:[31,163,140], gold:[230,180,80], bank:[91,124,250], convenience:[224,123,47],
  fresh_market:[224,144,47], supermarket:[224,144,47], industrial:[123,138,166],
  pharmacy:[200,67,59], restaurant:[133,144,166], hotel:[214,90,160], school:[122,79,224]};
const POI_LABEL={vehicle_commerce:'Vehicle shops',gold:'Gold dealers',bank:'Banks',convenience:'Convenience',
  fresh_market:'Fresh markets',supermarket:'Supermarkets',industrial:'Industrial',pharmacy:'Pharmacy',
  restaurant:'Restaurants',hotel:'Hotels',school:'Schools'};
const POI_DEFAULT_ON={vehicle_commerce:1,gold:1,fresh_market:1,bank:1};
const POI_TYPES=Object.keys(POI_COLORS).filter(t=>POIS[t]&&POIS[t].length);
const poiOn={}; POI_TYPES.forEach(t=>poiOn[t]=!!POI_DEFAULT_ON[t]);
let basemap='dark', showRings=true;

function hav(la1,ln1,la2,ln2){const R=6371000,p=Math.PI/180;
  const x=Math.sin((la2-la1)*p/2)**2+Math.cos(la1*p)*Math.cos(la2*p)*Math.sin((ln2-ln1)*p/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));}
function circle(lat,lng,r){const pts=[],dLat=r/111320,dLng=r/(111320*Math.cos(lat*Math.PI/180));
  for(let i=0;i<=48;i++){const a=i/48*2*Math.PI;pts.push([lng+dLng*Math.cos(a),lat+dLat*Math.sin(a)]);}return pts;}

// default focal = the branch with the richest measured surroundings (most vehicle shops in 10km), else first
let focal=(function(){if(!BR.length)return null;
  let best=BR[0],bv=-1;for(const b of BR){const v=(b.k10&&b.k10.veh)||b.veh||0;if(v>bv){bv=v;best=b;}}return best;})();

// view bounds from branches
function provView(){
  if(!BR.length){return {longitude:101,latitude:14,zoom:7,pitch:40,bearing:0};}
  const xs=BR.map(b=>b.x),ys=BR.map(b=>b.y);
  const lng=(Math.max.apply(null,xs)+Math.min.apply(null,xs))/2;
  const lat=(Math.max.apply(null,ys)+Math.min.apply(null,ys))/2;
  const span=Math.max((Math.max.apply(null,xs)-Math.min.apply(null,xs))||0.3,(Math.max.apply(null,ys)-Math.min.apply(null,ys))||0.3);
  const z=span>1.8?7.4:span>1.1?8.0:span>0.6?8.6:9.2;
  return {longitude:lng,latitude:lat,zoom:z,pitch:42,bearing:8};
}

const TILE={voyager:'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
            dark:'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'};
const deckgl=new deck.DeckGL({container:'map',
  initialViewState:provView(),
  controller:{inertia:300,dragRotate:true},
  getTooltip:({object,layer})=>{
    if(!object)return null;
    if(layer.id==='districts'){const p=object.properties;
      return {html:`<div class="dtt"><b>${p.district}</b><br>Working-age: <b>${(p.workingage||0).toLocaleString()}</b><br>Branches: <b>${p.branches}</b> · DIW workers: <b>${(p.real_workers||0).toLocaleString()}</b></div>`};}
    if(layer.id==='branches')return {html:`<div class="dtt"><b>${object.n||'AutoX branch'}</b><br>เงินไชโย · ${object.d||provEn} · vehicle shops ${object.veh!=null?object.veh:'—'} · gold ${object.gold!=null?object.gold:'—'}</div>`};
    if(layer.id==='comp')return {html:`<div class="dtt"><b>${object.brand}</b><br>${object.name||''}</div>`};
    if(layer.id&&layer.id.indexOf('poi-')===0){const t=layer.props._poiType;
      const nm=Array.isArray(object)?object[2]:null;
      return {html:`<div class="dtt"><b>${POI_LABEL[t]||t}</b>${nm?'<br>'+nm:''}<br><span style="color:#8a94a8">OSM point · in view</span></div>`};}
    return null;}});

function baseLayer(){return new deck.TileLayer({id:'base',data:TILE[basemap],minZoom:0,maxZoom:19,tileSize:256,
  renderSubLayers:p=>{const b=p.tile.boundingBox;return new deck.BitmapLayer(p,{data:null,image:p.data,
    bounds:[b[0][0],b[0][1],b[1][0],b[1][1]]});}});}

function dGeom(f){return f.geometry.type==='MultiPolygon'?f.geometry.coordinates.map(poly=>poly[0]):f.geometry.coordinates[0];}

function render(){
  const L=[baseLayer()];
  // (0) district context — FLAT polygons (non-Rayong provinces have no 3D buildings; this is the geography layer)
  if(DISTRICTS && DISTRICTS.features && deck.GeoJsonLayer){
    L.push(new deck.GeoJsonLayer({id:'districts',data:DISTRICTS,extruded:false,filled:true,stroked:true,
      getFillColor:[91,124,250,16],getLineColor:[120,140,180,95],lineWidthMinPixels:1,pickable:true}));
  }
  // (1) 10km collateral catchment rings — faint over ALL branches; bright on the selected one
  if(showRings && BR.length){
    L.push(new deck.PolygonLayer({id:'rings10',data:BR,getPolygon:b=>circle(b.y,b.x,10000),
      extruded:false,stroked:true,filled:true,
      getFillColor:[GOLD[0],GOLD[1],GOLD[2],8],getLineColor:[GOLD[0],GOLD[1],GOLD[2],60],
      lineWidthMinPixels:1,pickable:false}));
    if(focal){
      L.push(new deck.PolygonLayer({id:'ring10-focus',data:[focal],getPolygon:b=>circle(b.y,b.x,10000),
        extruded:false,stroked:true,filled:true,
        getFillColor:[GOLD[0],GOLD[1],GOLD[2],26],getLineColor:[GOLD[0],GOLD[1],GOLD[2],235],
        lineWidthMinPixels:2.5,pickable:false,updateTriggers:{getPolygon:[focal]}}));
    }
  }
  // (2) color-coded POIs — one ScatterplotLayer per type, each toggleable; POIS items are [lat,lng]
  POI_TYPES.forEach(t=>{ if(!poiOn[t])return;
    const c=POI_COLORS[t];
    L.push(new deck.ScatterplotLayer({id:'poi-'+t,data:POIS[t],getPosition:p=>[p[1],p[0]],
      getRadius:90,radiusMinPixels:1.6,radiusMaxPixels:5,getFillColor:[c[0],c[1],c[2],210],
      stroked:false,pickable:true,_poiType:t}));
  });
  // (3) competitors (graceful: empty for most provinces today)
  if(COMP.length){
    L.push(new deck.ScatterplotLayer({id:'comp',data:COMP,getPosition:d=>[d.lng,d.lat],
      getRadius:170,radiusMinPixels:4,radiusMaxPixels:10,stroked:true,getLineColor:[210,210,220,255],lineWidthMinPixels:1.6,
      getFillColor:d=>BRAND[d.brand]||[150,150,150],pickable:true}));
  }
  // (4) AutoX branches — selected one is white
  L.push(new deck.ScatterplotLayer({id:'branches',data:BR,getPosition:d=>[d.x,d.y],
    getRadius:230,radiusMinPixels:5,radiusMaxPixels:12,stroked:true,getLineColor:[40,28,8,255],lineWidthMinPixels:1.4,
    getFillColor:d=>d===focal?[255,255,255,255]:[230,180,80,255],pickable:true,
    updateTriggers:{getFillColor:[focal]}}));
  // (5) only the SELECTED branch is labelled
  if(focal){
    L.push(new deck.TextLayer({id:'branch-labels',data:[focal],getPosition:d=>[d.x,d.y],getText:d=>d.n||'AutoX',
      getSize:12,getColor:[40,28,8,255],getBackgroundColor:[255,255,255,245],background:true,
      backgroundPadding:[6,3],getPixelOffset:[0,-18],fontFamily:'IBM Plex Sans Thai',fontWeight:700,
      getTextAnchor:'middle',getAlignmentBaseline:'bottom',characterSet:'auto',sizeUnits:'pixels',
      updateTriggers:{getText:[focal],getPosition:[focal]}}));
  }
  deckgl.setProps({layers:L,
    onClick:({object,layer})=>{if(layer&&layer.id==='branches'&&object){selectBranch(object,false);}}});
}

/* ---------- panels ---------- */
function fmt(n){return (n==null?0:n).toLocaleString();}
function rgb(c){return `rgb(${c[0]},${c[1]},${c[2]})`;}

const EMP=(RY.gov&&RY.gov.employment)||null;
function districtWorkers(d){
  if(!DISTRICTS||!DISTRICTS.features)return null;
  const f=DISTRICTS.features.find(ft=>ft.properties&&ft.properties.district===d);
  return f&&f.properties.real_workers!=null?f.properties.real_workers:null;
}

// "Within 10km" — three lender-oriented groups; every count is k10 (measured OSM)
const K10_GROUPS=[
  ['Collateral & finance',[
    ['veh','Auto / vehicle shops','vehicle_commerce'],
    ['gold','Gold dealers','gold'],
    [['bank','atm'],'Banks + ATMs','bank']]],
  ['Commerce & retail',[
    ['fmkt','Fresh markets','fresh_market'],
    ['super','Supermarkets','supermarket'],
    ['cvs','Convenience','convenience'],
    ['rest','Restaurants','restaurant']]],
  ['Industry & services',[
    ['ind','Factories','industrial'],
    ['hotel','Hotels','hotel'],
    ['sch','Schools','school'],
    ['pharm','Pharmacies','pharmacy']]],
];
// establishment-mix -> occupation proxy (ESTIMATED). same mapping as Rayong.
const OCC=[
  ['Factory / production',['ind'],'industrial'],
  ['Market vendors & retail',['fmkt','super','cvs'],'fresh_market'],
  ['Auto trade & mechanics',['veh'],'vehicle_commerce'],
  ['Food service',['rest'],'restaurant'],
  ['Hospitality / tourism',['hotel'],'hotel'],
  ['Gold / pawn & finance',['gold','bank'],'gold'],
  ['Education',['sch'],'school'],
  ['Healthcare',['pharm'],'pharmacy'],
  ['Public sector',['civic'],'school'],
];

function updatePanels(){
  const dist=(focal&&focal.d)||provEn;
  const k=(focal&&focal.k10)||null;
  document.getElementById('focalName').textContent=(focal&&focal.n)||'AutoX branch';
  document.getElementById('focalSub').textContent=`เงินไชโย · ${dist} · vehicle shops ${(focal&&focal.veh!=null)?focal.veh:'—'}`;

  // (C) "Within 10km of <branch>" — measured counts, grouped for a lender
  const k10host=document.getElementById('k10panel');
  if(!k){
    k10host.innerHTML='<div class="foot">Select an AutoX branch from the cascade or map to see its measured 10km surroundings.</div>';
  }else{
    const sum=ks=>ks.reduce((a,kk)=>a+(k[kk]||0),0);
    k10host.innerHTML=K10_GROUPS.map(([gh,rows])=>
      `<div class="kgrp"><div class="gh">${gh}</div>`+rows.map(([key,lab,col])=>{
        const v=Array.isArray(key)?sum(key):(k[key]||0);
        const c=POI_COLORS[col]||[138,148,168];
        return `<div class="krow"><span class="sw" style="background:${rgb(c)}"></span><span class="lab">${lab}</span><b>${fmt(v)}</b></div>`;
      }).join('')+`</div>`).join('')
      +`<div class="foot">Counts are establishments mapped in OpenStreetMap within a 10 km radius of this branch — measured, not estimated.</div>`;
  }

  // (D) "Who works nearby" — measured workforce + estimated occupation-mix proxy
  const whost=document.getElementById('workpanel');
  let html='';
  if(EMP){
    const inf=EMP.informal||0, frm=EMP.formal||0, tot=inf+frm;
    const share=tot?Math.round(inf/tot*100):0;
    html+='<div class="wbox">'
      +`<div class="big">${share}%</div><div class="cap">of ${provEn} workers are informal — the core title-loan base <span class="tag meas">measured · NSO</span></div>`
      +`<div class="wr"><span class="k">Informal workers</span><span class="v">${fmt(inf)}</span></div>`
      +`<div class="wr"><span class="k">Formal workers</span><span class="v">${fmt(frm)}</span></div>`;
    const dw=districtWorkers(dist);
    if(dw!=null)html+=`<div class="wr"><span class="k">DIW factory workers <small>(${dist})</small></span><span class="v">${fmt(dw)}</span></div>`;
    html+='</div>';
  }
  if(k){
    const rows=OCC.map(([lab,ks,col])=>({lab,col,v:ks.reduce((a,kk)=>a+(k[kk]||0),0)}))
      .filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
    const tot=rows.reduce((a,r)=>a+r.v,0)||1, mx=rows.length?rows[0].v:1;
    if(rows.length){
      html+=`<h2 style="padding:0 0 4px;margin-top:2px">Occupation mix <span class="tag est">estimated · proxy</span></h2>`
        +`<div class="occ">`+rows.map(r=>{
          const c=POI_COLORS[r.col]||[138,148,168], pct=Math.round(r.v/tot*100);
          return `<div class="or"><div class="ot">${r.lab}<b>${pct}%</b></div>`
            +`<div class="bar"><i style="width:${Math.max(4,Math.round(r.v/mx*100))}%;background:${rgb(c)}"></i></div></div>`;
        }).join('')+`</div>`
        +`<div class="foot">Estimated from the mix of establishments within 10 km (OSM) — a proxy for who works locally, not a headcount.</div>`;
    }
  }
  whost.innerHTML=html||'<div class="foot">Select a branch for the local workforce profile.</div>';
}

/* ---------- right card: province context ---------- */
function buildProvincePanels(){
  document.getElementById('provTitle').textContent=provEn+(provTh?' · '+provTh:'');
  document.getElementById('provSub').textContent=`${reg} region · ${BR.length} branches · ${DISTRICTS&&DISTRICTS.features?DISTRICTS.features.length:0} districts`;
  const f=RY.facts||{}, gov=RY.gov||{};
  const tagcol={risk:'var(--red)',watch:'var(--orange)',opp:'var(--teal)'};
  function autoImpacts(){
    const out=[], v=gov.vehicles||{}, e=gov.employment||{};
    const tot=v.total||0, inf=e.informal||0, form=e.formal||0, infShare=(inf+form)?Math.round(100*inf/(inf+form)):0;
    if(infShare>=55) out.push(['Informal-income base',infShare+'% of workers are informal/own-account — variable, underbanked income; the core title-loan borrower.','risk']);
    if(tot){const ms=Math.round(100*(v.moto||0)/tot); if(ms>=60) out.push(['Motorcycle-heavy collateral',ms+'% of registered vehicles are motorcycles — high volume, weaker loss-given-default; price on speed, watch LTV.','watch']);}
    if((v.ev||0)>0) out.push(['EV transition',(v.ev).toLocaleString()+' EVs registered and rising — watch ICE auto-parts jobs where factories are auto-supply.','watch']);
    if((gov.factories||0)>1500) out.push(['Industrial payroll dependence',(gov.factories).toLocaleString()+' factories — incomes track factory demand and export cycles.','risk']);
    if(!out.length) out.push(['Vehicle-dependent daily life','Households rely on a motorbike or pickup for work — title-loan relevant.','opp']);
    return out;
  }
  const editorial=f.impacts&&f.impacts.length;
  const impacts=editorial?f.impacts:autoImpacts();
  document.getElementById('v-impacts').innerHTML=
    `<p class="lead">What moves local incomes${editorial?'':' (auto-derived from measured DLT/NSO/DIW data; editorial narrative pending)'}:</p>`+
    impacts.map(([t,d,k])=>`<div class="imp"><span class="dot" style="background:${tagcol[k]}"></span><div><div class="t">${t}<span class="tg" style="color:${tagcol[k]};border:1px solid ${tagcol[k]}">${(k||'').toUpperCase()}</span></div><div class="d">${d}</div></div></div>`).join('');

  // districts table (id v-districts MUST stay non-empty for the QA hooks)
  const ds=(DISTRICTS&&DISTRICTS.features?DISTRICTS.features.map(x=>x.properties):[]).sort((a,b)=>(b.workingage||0)-(a.workingage||0));
  document.getElementById('v-districts').innerHTML= ds.length?
    (`<p class="lead">Working-age, branches and measured DIW factory workers per district.</p>`+
    `<table><tr><th>District</th><th>Br</th><th>Working-age</th><th>DIW workers</th></tr>`+
    ds.map(p=>`<tr><td class="n">${p.district}</td><td class="mono">${p.branches||0}</td><td class="mono">${(p.workingage||0).toLocaleString()}</td><td class="mono">${(p.real_workers||0).toLocaleString()}</td></tr>`).join('')+`</table>`)
    : `<p class="lead">No district breakdown available for this province.</p>`;

  // nearest table
  document.getElementById('v-near').innerHTML=
    `<p class="lead">For each branch: distance to nearest factory and market (measured).</p>`+
    `<table><tr><th>Branch</th><th>Fac km</th><th>Mkt km</th></tr>`+
    BR.map(d=>`<tr><td class="n">${d.n||'—'}</td><td class="mono">${d.nfac!=null?d.nfac:'–'}</td><td class="mono">${d.nmkt!=null?d.nmkt:'–'}</td></tr>`).join('')+`</table>`;

  // competitors
  const byBrand={};COMP.forEach(c=>byBrand[c.brand]=(byBrand[c.brand]||0)+1);
  document.getElementById('v-comp').innerHTML= COMP.length?
    (`<p class="lead">Competitor branches (live pull).</p>`+
    `<table><tr><th>Brand</th><th>Branch</th></tr>`+COMP.map(c=>`<tr><td style="color:rgb(${(BRAND[c.brand]||[200,200,200]).join(',')})">${c.brand}</td><td>${(c.name||'').replace(/^[^ ]+ /,'')}</td></tr>`).join('')+`</table>`)
    : `<p class="lead">Competitor locations not yet pulled for this province — Rayong has a live set; others pending a Google Places pull. The map and panels still show your branches, POIs and 10km reach.</p>`;
}

/* strip KPI chips (id kpis MUST stay non-empty for the QA hooks) */
function buildStrip(){
  const gov=RY.gov||{}, emp=gov.employment||{}, veh=gov.vehicles||{};
  const items=[['Branches',BR.length,'#E6B450'],
    ['Districts',(DISTRICTS&&DISTRICTS.features?DISTRICTS.features.length:0),'#5B7CFA'],
    ['Factories',(gov.factories!=null?gov.factories:(POIS.industrial?POIS.industrial.length:0)),'#7b8aa6'],
    (veh.total?['Vehicles',Math.round(veh.total/1000)+'k','#1FA38C']:null),
    (emp.informal?['Informal',Math.round(emp.informal/1000)+'k','#E0902F']:null),
    ['Vehicle shops',(POIS.vehicle_commerce||[]).length,'#1FA38C'],
    ['Gold dealers',(POIS.gold||[]).length,'#E6B450']].filter(Boolean);
  // NOTE: chip text comes BEFORE the swatch so the QA hook's crude inner-text grab (id="kpis"> .. </) sees content
  document.getElementById('kpis').innerHTML=
    items.map(([n,v,c])=>`<span class="bchip">${n}<b>${typeof v==='number'?v.toLocaleString():v}</b><span class="d" style="background:${c};margin:0 0 0 5px"></span></span>`).join('');
  document.getElementById('stripTtl').innerHTML=`${provEn} <b>·</b> branches · POIs · 10km reach`;
}

/* ---------- branch selection ---------- */
function selectBranch(b,fly){
  if(!b)return; focal=b;
  if(fly){deckgl.setProps({initialViewState:{longitude:b.x,latitude:b.y,zoom:12.0,pitch:45,bearing:8,transitionDuration:850}});}
  updatePanels();render();
  const br=document.getElementById('cscBranch'); const fi=BR.indexOf(b); if(br&&fi>=0)br.value=String(fi);
  if(window.innerWidth<=820){document.getElementById('left').classList.add('show');}
}

/* ---------- Region > Province > Branch cascade (nationwide index; selecting a province navigates) ---------- */
function buildCascade(){
  const reg=document.getElementById('cscRegion'), prov=document.getElementById('cscProv'), br=document.getElementById('cscBranch');
  if(!reg||!prov||!br)return;
  const myReg=RY.region||(IDX?(IDX.find(p=>p.slug===SLUG)||{}).region:null)||'East';
  const regions=IDX?[...new Set(IDX.map(p=>p.region))]:[myReg];
  const order=['Central&BKK','East','North','Isan','South'];
  regions.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  reg.innerHTML=regions.map(r=>`<option value="${r}">${r}</option>`).join('');
  reg.value=myReg;
  function fillProv(){
    const r=reg.value;
    const list=IDX?IDX.filter(p=>p.region===r):[{slug:SLUG,en:provEn,th:provTh,branches:BR.length}];
    list.sort((a,b)=>(b.branches||0)-(a.branches||0));
    prov.innerHTML=list.map(p=>`<option value="${p.slug}">${p.en||p.th} (${p.branches||0})</option>`).join('');
    if(list.some(p=>p.slug===SLUG))prov.value=SLUG;
  }
  function fillBranch(){
    br.disabled=!BR.length;
    if(!BR.length){br.innerHTML='<option>— no branches —</option>';return;}
    br.innerHTML=BR.map((b,i)=>`<option value="${i}">${b.n||('Branch '+(i+1))}${b.d?' · '+b.d:''}</option>`).join('');
    const fi=BR.indexOf(focal); br.value=String(fi>=0?fi:0);
  }
  reg.onchange=()=>{fillProv();};
  // selecting a different province navigates (?p=slug); same province re-fills branches
  prov.onchange=()=>{const s=prov.value; if(s&&s!==SLUG){location.search='?p='+s;}};
  br.onchange=()=>{const b=BR[+br.value]; if(b)selectBranch(b,true);};
  fillProv();fillBranch();
  const note=document.getElementById('cscNote');
  if(note)note.textContent=(SLUG==='rayong')?'Rayong has the full 3D deep-dive — open Rayong 3D from the nav for extruded buildings.':'Pick a province to jump there; pick a branch to focus its 10km reach.';
}

/* ---------- POI legend ---------- */
function buildLegend(){
  const host=document.getElementById('legend'); if(!host)return;
  if(!POI_TYPES.length){host.innerHTML='<span class="lgttl" style="margin:0">No mapped POI layers for this province</span>';return;}
  host.innerHTML=POI_TYPES.map(t=>{
    const c=POI_COLORS[t], n=(POIS[t]||[]).length;
    return `<button class="lg ${poiOn[t]?'on':''}" data-t="${t}">
      <span class="sw" style="background:rgb(${c[0]},${c[1]},${c[2]})"></span>${POI_LABEL[t]||t}<b>${n}</b></button>`;
  }).join('');
  host.querySelectorAll('.lg').forEach(el=>el.onclick=()=>{
    const t=el.dataset.t; poiOn[t]=!poiOn[t]; el.classList.toggle('on',poiOn[t]); render();});
}

/* controls */
document.querySelectorAll('#ctl [data-b]').forEach(b=>b.onclick=()=>{
  basemap=b.dataset.b;document.querySelectorAll('#ctl [data-b]').forEach(x=>x.classList.toggle('on',x===b));render();});
document.getElementById('ringtog').onclick=function(){showRings=!showRings;this.classList.toggle('on',showRings);render();};
document.querySelectorAll('#mtog button').forEach(b=>b.onclick=()=>{
  const s=b.dataset.s,el=document.getElementById(s),other=document.getElementById(s==='left'?'right':'left');
  el.classList.toggle('show');other.classList.remove('show');});
document.querySelectorAll('.xbtn').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.x).classList.remove('show'));
document.querySelectorAll('.stb').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.stb').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));});

buildStrip();buildLegend();buildCascade();buildProvincePanels();updatePanels();render();
}catch(e){document.body.insertAdjacentHTML('beforeend','<div class="err">Map failed to load: '+(e&&e.message||e)+'</div>');console.error(e);}
};</script>
<script>
(function(){
 var slug=(new URLSearchParams(location.search).get('p')||'rayong').toLowerCase();
 var box=document.createElement('div');box.className='err';box.style.color='#8a94a8';box.textContent='Loading province…';document.body.appendChild(box);
 Promise.all([
   fetch('data/provinces/'+slug+'.json').then(function(r){if(!r.ok)throw new Error('data '+r.status);return r.json();}),
   fetch('data/provinces/index.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
 ]).then(function(a){window.RY=a[0];window.PROV_INDEX=a[1];
   document.title=(a[0].province_en||'Province')+' · '+(a[0].region||'')+' — AutoX · เงินไชโย';
   box.remove();window.initProvince();})
  .catch(function(e){box.style.color='#E0474B';box.textContent='Could not load province "'+slug+'": '+e.message;});
})();
</script>
