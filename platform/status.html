<style>
/* ---- status dashboard: page-specific layout over the shared design tokens ---- */
.st-wrap{max-width:1180px;margin-inline:auto}
.st-h1{font-size:var(--fz-heading,19px);font-weight:700;color:var(--hi);letter-spacing:-.2px;margin:2px 0}
.st-updated{font-family:var(--mono);font-size:11px;color:var(--dim);margin:2px 0 0}
.st-updated b{color:var(--mid);font-weight:600}

/* hero: lead with the answer */
.st-hero{background:linear-gradient(180deg,var(--panel),#161d2c);border:1px solid var(--line);
  border-top:1px solid rgba(255,255,255,.06);border-radius:var(--r,12px);padding:18px 18px 16px;
  margin:14px 0 18px;box-shadow:var(--elev-1)}
html[data-theme="light"] .st-hero{background:linear-gradient(180deg,#fff,#f3f6fc)}
.st-hero-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.st-pct{font-family:var(--mono);font-size:40px;font-weight:600;color:var(--hi);letter-spacing:-1px;
  line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(91,124,250,.16)}
.st-pct .u{font-size:20px;color:var(--mid);margin-left:2px}
.st-pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;
  border:1px solid;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
.st-pill.ontrack{color:#5fd6c2;border-color:rgba(35,162,143,.55);background:rgba(35,162,143,.14)}
.st-pill.atrisk{color:#f0a468;border-color:rgba(217,116,43,.55);background:rgba(217,116,43,.16)}
html[data-theme="light"] .st-pill.ontrack{color:#0c6a5b;background:rgba(28,140,125,.12);border-color:rgba(28,140,125,.45)}
html[data-theme="light"] .st-pill.atrisk{color:#a2521a;background:rgba(217,116,43,.10);border-color:rgba(217,116,43,.45)}
.st-eta{margin-left:auto;text-align:right;font-size:12px;color:var(--mid)}
.st-eta b{font-family:var(--mono);color:var(--hi);font-size:14px;font-variant-numeric:tabular-nums}
.st-eta .est{font-family:var(--mono);font-size:9.5px;color:var(--gold);border:1px solid rgba(230,180,80,.5);
  background:rgba(230,180,80,.12);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px}

/* big progress bar */
.st-track{height:14px;border-radius:8px;background:#10182A;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
  margin:14px 0 12px;overflow:hidden}
html[data-theme="light"] .st-track{background:#e3e8f1}
.st-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),#3f5fe0);
  box-shadow:0 0 12px -1px var(--accent-glow);transition:width .5s ease}
.st-counts{display:flex;gap:8px;flex-wrap:wrap}
.st-count{flex:1;min-width:96px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;text-align:center}
.st-count .v{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--hi);font-variant-numeric:tabular-nums}
.st-count .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.st-count.done .v{color:#5fd6c2}.st-count.prog .v{color:#f2cf78}.st-count.open .v{color:var(--mid)}

/* pillar cards */
.st-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.st-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;
  box-shadow:var(--elev-1)}
.st-card-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.st-card-h .lbl{font-size:13px;font-weight:700;color:var(--hi)}
.st-card-h .frac{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mid);font-variant-numeric:tabular-nums}
.st-card-h .pdot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 7px 1px currentColor}
.st-pbar{height:8px;border-radius:4px;background:#10182A;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);overflow:hidden;margin-bottom:4px}
html[data-theme="light"] .st-pbar{background:#e3e8f1}
.st-pbar>i{display:block;height:100%;border-radius:4px}
.st-card details{margin-top:8px}
.st-card summary{cursor:pointer;color:var(--mid);font-size:11.5px;padding:5px 0;list-style:none;user-select:none}
.st-card summary::-webkit-details-marker{display:none}
.st-card summary::before{content:"▸ ";color:var(--dim)}
.st-card details[open] summary::before{content:"▾ "}
.st-item{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line2)}
.st-item .chip{flex:none;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;line-height:1;padding:4px 7px;border-radius:6px;border:1px solid;margin-top:2px;white-space:nowrap}
.chip.s-done{color:#5fd6c2;border-color:rgba(35,162,143,.5);background:rgba(35,162,143,.14)}
.chip.s-prog{color:#f2cf78;border-color:rgba(230,180,80,.5);background:rgba(230,180,80,.13)}
.chip.s-open{color:var(--dim);border-color:var(--line);background:transparent}
.st-item .tx{min-width:0;flex:1}
.st-item .ti{font-size:12.5px;color:var(--txt);line-height:1.4;overflow-wrap:anywhere;word-break:break-word}
.st-item .ev{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4;overflow-wrap:anywhere;word-break:break-word}
.st-item .pr{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:4px}
.st-item .pr.owner{color:var(--gold);border:1px solid rgba(230,180,80,.5);background:rgba(230,180,80,.12);
  border-radius:5px;padding:1px 5px;text-transform:uppercase;letter-spacing:.3px}

/* loops + activity */
.st-two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:18px}
.st-loop{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line2)}
.st-loop:last-child{border-bottom:none}
.st-loop .nm{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--hi)}
.st-loop .ow{font-size:11.5px;color:var(--mid);flex:1;min-width:0}
.st-loop .cd{font-family:var(--mono);font-size:10.5px;color:var(--accent);white-space:nowrap}
.st-act{display:flex;gap:9px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line2)}
.st-act:last-child{border-bottom:none}
.st-act .sha{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:none}
.st-act .dt{font-family:var(--mono);font-size:10px;color:var(--dim);flex:none}
.st-act .sm{font-size:12px;color:var(--txt);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-act .pc{flex:none;font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 6px;border-radius:5px;
  border:1px solid var(--line);color:var(--mid);background:var(--panel2);white-space:nowrap}
.st-sec{font-size:12px;color:var(--mid);text-transform:uppercase;letter-spacing:.6px;font-weight:600;
  margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.st-notice{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:26px 20px;
  text-align:center;color:var(--mid);font-size:13px;line-height:1.6;margin:18px 0}
.st-notice b{color:var(--txt)}
.st-foot{font-size:10.5px;color:var(--dim);margin:22px 0 4px;line-height:1.6}
@media(max-width:600px){.st-pct{font-size:34px}.st-eta{margin-left:0;text-align:left;width:100%}}
</style>
</head>

<script>/* "Explore ▾" nav dropdown — pure UI (copied from index.html) */
(function(){var wrap=document.getElementById('navMore'),btn=document.getElementById('navMoreBtn'),menu=document.getElementById('navMoreMenu');
 if(!wrap||!btn||!menu)return;
 /* Re-parent the menu to <body>: #nav has backdrop-filter (making it the containing block for
    position:fixed children) AND overflow-x:auto, so an in-nav fixed menu is clipped and dragged
    off-screen by the nav's horizontal scroll on a phone. As a <body> child its fixed top/right
    anchor to the viewport instead. Matches index.html's nav script. */
 document.body.appendChild(menu);
 function open(o){menu.classList.toggle('open',o);wrap.classList.toggle('open',o);btn.setAttribute('aria-expanded',String(o));}
 btn.addEventListener('click',function(e){e.stopPropagation();open(!wrap.classList.contains('open'));});
 menu.addEventListener('click',function(){open(false);});
 document.addEventListener('click',function(e){if(!wrap.contains(e.target)&&!menu.contains(e.target))open(false);});
 document.addEventListener('keydown',function(e){if(e.key==='Escape')open(false);});})();
</script>
<script>/* theme toggle — shares the autox-theme key with the rest of the site */
(function(){var b=document.getElementById('themeToggle');if(!b)return;
 function sync(){var l=document.documentElement.dataset.theme==='light';b.textContent=l?'☀':'☾';b.setAttribute('aria-pressed',String(l));var mtc=document.querySelector('meta[name="theme-color"]');if(mtc)mtc.setAttribute('content',l?'#F4F6FA':'#0a0e17');}
 sync();
 b.addEventListener('click',function(){var l=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=l?'light':'dark';try{localStorage.setItem('autox-theme',l?'light':'dark');}catch(e){}sync();});})();
</script>

<main id="main-content" tabindex="-1">
<noscript>
  <div style="max-width:640px;margin:48px auto;padding:20px 22px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;color:var(--txt);font-size:14px;line-height:1.55">
    <strong style="color:var(--hi);display:block;margin-bottom:6px">This status page needs JavaScript enabled.</strong>
    The autonomy plan loads from a JSON feed and renders in the browser. Enable JavaScript to see it, or open the <a href="index.html" style="color:var(--accent)">dashboard front door</a>.
  </div>
</noscript>
<div class="st-wrap">
  <div>
    <h1 class="st-h1">Autonomy plan</h1>
    <p class="st-updated" id="updated">Loading the latest plan…</p>
  </div>
  <div id="app">
    <div class="st-notice">Loading…</div>
  </div>
  <p class="st-foot" id="foot"></p>
</div>
</main>

<script>
(function(){
  "use strict";
  var PILLAR_COLOR = {
    "data-integration":"var(--accent)","deployment":"#5fd6c2","feature":"var(--gold)",
    "uxui":"#a684ef","market":"var(--merch)","service":"var(--agri)","peer":"#4F7BF0",
    "3d-enrichment":"var(--collat)"
  };
  var STATE_CHIP = {done:"s-done", in_progress:"s-prog", open:"s-open"};
  var STATE_LABEL = {done:"done", in_progress:"in prog", open:"open"};

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function pcColor(key){ return PILLAR_COLOR[key] || "var(--mid)"; }

  function renderPillarCard(p){
    var col = pcColor(p.key);
    var items = (p.items || []).slice().sort(function(a,b){
      var order = {open:0, in_progress:1, done:2};
      var d = (order[a.state]||0) - (order[b.state]||0);
      if(d) return d;
      return (a.priority||9) - (b.priority||9);
    });
    var rows = items.map(function(it){
      var cls = STATE_CHIP[it.state] || "s-open";
      var owner = (it.owner_side && it.state !== "done")
        ? '<span class="pr owner" title="Requires an owner action — not autonomously completable">owner-side</span>' : '';
      return '<div class="st-item">'
        + '<span class="chip '+cls+'">'+esc(STATE_LABEL[it.state]||it.state)+'</span>'
        + '<span class="tx"><span class="ti">'+esc(it.title)+'<span class="pr">P'+esc(it.priority)+'</span>'+owner+'</span>'
        + '<span class="ev">'+esc(it.evidence)+'</span></span></div>';
    }).join("");
    var pillClass = p.status === "on-track" ? "ontrack" : "atrisk";
    return '<div class="st-card">'
      + '<div class="st-card-h"><span class="pdot" style="color:'+col+';background:'+col+'"></span>'
      + '<span class="lbl">'+esc(p.label)+'</span>'
      + '<span class="frac">'+esc(p.done)+'/'+esc(p.total)+' · '+esc(p.progress_pct)+'%</span></div>'
      + '<div class="st-pbar"><i style="width:'+Number(p.progress_pct||0)+'%;background:'+col+'"></i></div>'
      + '<details><summary>'+items.length+' item'+(items.length===1?"":"s")+' — '+esc(p.status)+'</summary>'
      + rows + '</details></div>';
  }

  function render(d){
    var o = d.overall || {}, m = d.meta || {};
    var upd = document.getElementById("updated");
    upd.innerHTML = 'Last updated <b>'+esc((m.generated_at||"").replace("T"," ").replace(/\+.*/,"").replace(/Z$/,""))
      +'</b> · commit <b>'+esc(m.commit||"?")+'</b> · auto-refreshes every 5 min';

    var pill = o.status === "on-track" ? "ontrack" : "atrisk";
    // Owner-side open items are not loop-closable, so the throughput-based ETA is only meaningful
    // over the autonomous-open subset. When none of those remain, say so plainly instead of
    // projecting a "~N days" that the autonomous loops can never actually deliver.
    var ownerSide = Number(o.open_owner_side||0);
    var autonomous = (o.open_autonomous != null) ? Number(o.open_autonomous) : Number(o.open_items||0);
    var etaHtml;
    if(autonomous <= 0 && ownerSide > 0){
      etaHtml = 'ETA <b>—</b> · '+ownerSide+' open item'+(ownerSide===1?'':'s')+' owner-side'
        + '<span class="est" title="Needs an owner action (e.g. a Vercel env var + a live check) — the autonomous loops cannot close it">NOT LOOP-CLOSABLE</span>';
    } else {
      etaHtml = 'ETA <b>~'+esc(o.eta_days)+' days</b> · by <b>'+esc(o.eta_date)+'</b>'
        + (ownerSide>0 ? '<span class="est">'+ownerSide+' OWNER-SIDE</span>' : '<span class="est">ESTIMATED</span>');
    }
    var hero = '<div class="st-hero">'
      + '<div class="st-hero-top">'
      + '<span class="st-pct">'+esc(o.progress_pct)+'<span class="u">%</span></span>'
      + '<span class="st-pill '+pill+'">'+esc(o.status||"")+'</span>'
      + '<span class="st-eta">'+etaHtml+'</span>'
      + '</div>'
      + '<div class="st-track"><div class="st-fill" style="width:'+Number(o.progress_pct||0)+'%"></div></div>'
      + '<div class="st-counts">'
      + '<div class="st-count done"><div class="v">'+esc(o.done_items)+'</div><div class="k">Done</div></div>'
      + '<div class="st-count prog"><div class="v">'+esc(o.in_progress_items)+'</div><div class="k">In progress</div></div>'
      + '<div class="st-count open"><div class="v">'+esc(o.open_items)+'</div><div class="k">Open</div></div>'
      + '<div class="st-count"><div class="v">'+esc(o.total_items)+'</div><div class="k">Total</div></div>'
      + '</div></div>';

    var pillars = '<div class="st-grid">' + (d.pillars||[]).map(renderPillarCard).join("") + '</div>';

    var loops = '<div class="st-card"><div class="st-sec">Autonomous loops</div>'
      + (d.loops||[]).map(function(l){
          var sched = l.schedule_utc ? (' · '+esc(l.schedule_utc)+' UTC') : "";
          return '<div class="st-loop"><span class="nm">'+esc(l.name)+'</span>'
            + '<span class="ow">'+esc(l.owns)+'</span>'
            + '<span class="cd">'+esc(l.cadence)+sched+'</span></div>';
        }).join("") + '</div>';

    var act = '<div class="st-card"><div class="st-sec">Recent activity</div>'
      + (d.activity||[]).slice(0,14).map(function(a){
          var col = pcColor(a.pillar);
          return '<div class="st-act"><span class="dt">'+esc((a.date||"").slice(0,10))+'</span>'
            + '<span class="sha">'+esc(a.sha)+'</span>'
            + '<span class="sm">'+esc(a.summary)+'</span>'
            + '<span class="pc" style="color:'+col+';border-color:'+col+'">'+esc(a.pillar)+'</span></div>';
        }).join("") + '</div>';

    document.getElementById("app").innerHTML = hero + pillars + '<div class="st-two">' + loops + act + '</div>';
    document.getElementById("foot").innerHTML =
      'Generated by <b>committee/plan_cycle.py</b> — deterministic, network-free, evidence-based. '
      + 'Every item&#39;s state is derived from a committed signal (a data file, a pipeline script, a workflow, '
      + 'a doc phrase, a catchment count); nothing here is aspirational. ETA is <b>ESTIMATED</b>.';
  }

  function showNotice(){
    document.getElementById("updated").textContent = "Status not generated yet.";
    document.getElementById("app").innerHTML =
      '<div class="st-notice"><b>The autonomy plan hasn&#39;t been generated yet.</b><br>'
      + 'The committee-planner loop runs <b>committee/plan_cycle.py</b> every 6 hours and commits '
      + '<code>platform/status_data.json</code>. Once it lands, this dashboard fills in automatically.</div>';
  }

  function load(){
    fetch("./status_data.json", {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ if(!d || !d.overall) throw new Error("shape"); render(d); })
      .catch(function(){ showNotice(); });
  }

  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
