<style>
/* ---- Data book — numbers-first surface. Self-contained "db-" components layered on the shared theme
       variables in styles.css (var(--panel)/(--line)/(--mid)/(--dim)/(--accent)…), so light+dark just work.
       NO map / NO WebGL — this is the analysis table the 3D pages were never meant to be. ---- */
.db-wrap{max-width:var(--maxw,1320px);margin:0 auto;padding:18px 20px 80px}
.db-crumb{font:500 12.5px/1.4 var(--mono);color:var(--dim);margin:2px 0 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.db-crumb a{color:var(--mid);text-decoration:none;border-bottom:1px dotted transparent}
.db-crumb a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.db-crumb b{color:var(--dim);font-weight:500}
.db-h1{font:700 22px/1.35 'IBM Plex Sans Thai';margin:0 0 3px;letter-spacing:-.01em}
.db-h1 .th{color:var(--dim);font-weight:500;font-size:16px;margin-left:6px}
.db-sub{color:var(--mid);font-size:13.5px;margin:0 0 18px;max-width:70ch;line-height:1.5}
.db-sub b{color:var(--ink,inherit);font-weight:600}
/* KPI strip */
.db-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 22px}
.db-kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-width:0}
.db-kpi .db-v{font:700 24px/1 var(--mono);letter-spacing:-.02em;color:var(--ink,inherit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-kpi .db-v small{font-size:13px;color:var(--dim);font-weight:500;margin-left:2px}
.db-kpi .db-k{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.3;text-transform:uppercase;letter-spacing:.03em}
.db-kpi .db-ctx{font-size:11.5px;color:var(--mid);margin-top:5px;line-height:1.35}
.db-kpi.lead{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.db-kpi.lead .db-v{color:var(--accent)}
/* section */
.db-sec{margin:26px 0 12px;font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);display:flex;align-items:center;gap:8px}
.db-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.db-sec .n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700}
.db-sec2{margin:22px 0 8px;font:600 14px var(--sans,system-ui);color:var(--hi,#eef1f7);letter-spacing:-.1px}
/* region cards */
.db-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
.db-card .tape-lab{margin:9px 0 1px;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border-top:1px solid var(--line);padding-top:8px}
.db-card .cm.cm-tape span{color:var(--mid)}
.db-card{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;color:inherit;transition:border-color .12s,transform .12s}
.db-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.db-card .rt{font:700 16px/1.35 'IBM Plex Sans Thai';margin-bottom:2px}
.db-card .rp{font-size:11.5px;color:var(--dim);margin-bottom:11px}
.db-card .cm{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-top:1px dashed var(--line)}
.db-card .cm b{font:600 12.5px/1 var(--mono);color:var(--ink,inherit)}
.db-card .cm span{color:var(--mid)}
/* tables */
.db-tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.db-tbl{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px}
.db-tbl th{position:sticky;top:0;background:var(--panel2,var(--panel));text-align:right;padding:9px 11px;font:600 11px/1.2 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.db-tbl th:first-child,.db-tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.db-tbl th.sort-asc::after{content:" ▲";color:var(--accent)}
.db-tbl th.sort-desc::after{content:" ▼";color:var(--accent)}
.db-tbl th:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.db-tbl td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line2,var(--line));font-variant-numeric:tabular-nums;white-space:nowrap}
.db-tbl tr:last-child td{border-bottom:none}
.db-tbl tbody tr{cursor:pointer}
.db-tbl tbody tr:hover td{background:var(--raised,rgba(127,127,127,.06))}
.db-tbl td.name{font-weight:600}
.db-tbl td .en{color:var(--dim);font-weight:400;font-size:11px}
.db-tbl td.hot{color:var(--agri,#d1544b);font-weight:700}
/* bars */
.db-bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;min-width:52px}
.db-bar>i{display:block;height:100%;border-radius:4px}
.db-stack{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line)}
.db-stack>i{height:100%}
.db-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:11.5px;color:var(--mid)}
.db-legend span{display:inline-flex;align-items:center;gap:5px}
.db-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* vs-national centered baseline bar */
.db-vs{position:relative;height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.db-vs::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--dim);opacity:.6}
.db-vs>i{position:absolute;top:0;bottom:0}
.db-badge{font:600 11px/1 var(--mono);padding:2px 6px;border-radius:5px;display:inline-block}
.db-badge.up{color:#0c8f5f;background:rgba(18,160,110,.12)}
.db-badge.dn{color:var(--agri,#d1544b);background:rgba(209,84,75,.12)}
/* two-col rows (province profile metrics) */
.db-rows{display:grid;grid-template-columns:1fr;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.db-row{display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(90px,.7fr) minmax(120px,1.6fr);gap:14px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2,var(--line))}
.db-row:last-child{border-bottom:none}
.db-row .rl{font-size:12.5px;color:var(--mid)}
.db-row .rl small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
.db-row .rv{font:600 15px/1 var(--mono);text-align:right;color:var(--ink,inherit)}
.db-row .rg{min-width:0}
.db-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
/* filter chips */
.db-chiprow{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.db-chip{font:500 12px/1 'IBM Plex Sans Thai';padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--mid);cursor:pointer}
.db-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.db-note{color:var(--dim);font-size:13px;padding:40px 0;text-align:center}
.db-tag{font:600 10px/1 var(--mono);padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-left:8px;vertical-align:middle}
.db-3dlinks{margin:30px 0 0;display:flex;flex-wrap:wrap;gap:10px}
.db-3dlinks a{font-size:12.5px;color:var(--mid);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.db-3dlinks a:hover{border-color:var(--accent);color:var(--accent)}
.db-foot{margin-top:34px;font-size:11px;color:var(--dim);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
</style>

<script>/* "Explore ▾" nav dropdown — pure UI (copied from index.html) */
(function(){var wrap=document.getElementById('navMore'),btn=document.getElementById('navMoreBtn'),menu=document.getElementById('navMoreMenu');
 if(!wrap||!btn||!menu)return;
 /* Re-parent the menu to <body>: #nav has backdrop-filter (making it the containing block for
    position:fixed children) AND overflow-x:auto, so an in-nav fixed menu is clipped and dragged
    off-screen by the nav's horizontal scroll on a phone. As a <body> child its fixed top/right
    anchor to the viewport instead. Matches index.html's nav script. */
 document.body.appendChild(menu);
 function open(o){menu.classList.toggle('open',o);wrap.classList.toggle('open',o);btn.setAttribute('aria-expanded',String(o));}
 btn.addEventListener('click',function(e){e.stopPropagation();open(!wrap.classList.contains('open'));});
 menu.addEventListener('click',function(){open(false);});
 document.addEventListener('click',function(e){if(!wrap.contains(e.target)&&!menu.contains(e.target))open(false);});
 /* keyboard: menu-button pattern (WCAG 2.1.1 Keyboard / 2.4.3 Focus Order) — the menu is re-parented
    to end of <body>, so a keyboard user tabbing off "Explore ▾" would otherwise skip its items to the
    page body. Arrow-open into the menu, arrow between items, Home/End jump, Escape/Tab close and restore
    focus to the trigger. Ported from index.html's nav script (this page carried only the click+Escape
    subset); no place()/positioning change — purely additive keyboard handling. */
 function items(){return Array.prototype.slice.call(menu.querySelectorAll('a[role="menuitem"]'));}
 function focusItem(i){var a=items();if(!a.length)return;a[(i+a.length)%a.length].focus();}
 btn.addEventListener('keydown',function(e){
   if(e.key==='ArrowDown'){e.preventDefault();open(true);focusItem(0);}
   else if(e.key==='ArrowUp'){e.preventDefault();open(true);focusItem(-1);}});
 menu.addEventListener('keydown',function(e){
   var a=items(),i=a.indexOf(document.activeElement);
   if(e.key==='ArrowDown'){e.preventDefault();focusItem(i+1);}
   else if(e.key==='ArrowUp'){e.preventDefault();focusItem(i-1);}
   else if(e.key==='Home'){e.preventDefault();focusItem(0);}
   else if(e.key==='End'){e.preventDefault();focusItem(-1);}
   else if(e.key==='Escape'){e.preventDefault();open(false);btn.focus();}
   else if(e.key==='Tab'){open(false);}});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&wrap.classList.contains('open')){open(false);btn.focus();}});})();
</script>

<script>
/* ============================ DATA BOOK ============================
   Numbers-first province -> region rollup. Three levels via query param:
     data.html            National overview (5 region cards + 77-province table)
     data.html?r=<region> Region profile (rollup + its provinces ranked)
     data.html?p=<slug>   Province profile (full measured readout, district table)
   Reads data/regions.json (rollup) + data/provinces/<slug>.json (deep detail).
   Rollup math lives in pipeline/build_regions.py; this page only presents it.        */
(function(){
'use strict';
var THEME_QS = (function(){try{var t=new URLSearchParams(location.search).get('theme');return t?('&theme='+t):'';}catch(e){return '';}})();

// ---- formatters ----
function num(n){return n==null?'—':Number(n).toLocaleString('en-US');}
function baht(n){return n==null?'—':'฿'+Number(n).toLocaleString('en-US');}
function pct(n){return n==null?'—':Number(n).toFixed(1)+'%';}
function mult(n){return n==null?'—':Number(n).toFixed(1)+'×';}
function kk(n){return n==null?'—':Math.round(n).toLocaleString('en-US')+'k';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
// vs-national: ratio (1.0 = national). returns {txt, cls}
function vsNat(r){if(r==null)return{txt:'—',cls:''};var d=Math.round((r-1)*100);return{txt:(d>=0?'+':'')+d+'%',cls:d>=0?'up':'dn'};}

// ---- micro-components ----
function bar(p,color){var w=Math.max(0,Math.min(100,p||0));return '<div class="db-bar"><i style="width:'+w+'%;background:'+color+'"></i></div>';}
function stack(parts){ // parts:[{p,color}]
  return '<div class="db-stack">'+parts.map(function(x){return '<i style="width:'+Math.max(0,x.p||0)+'%;background:'+x.color+'" title="'+esc(x.label||'')+'"></i>';}).join('')+'</div>';}
function legend(parts){return '<div class="db-legend">'+parts.map(function(x){return '<span><i style="background:'+x.color+'"></i>'+esc(x.label)+'</span>';}).join('')+'</div>';}
function vsbar(r){ // centered baseline at 1.0; clamp display to 0.5..1.5 -> 0..100
  if(r==null)return '<div class="db-vs"></div>';
  var d=Math.max(-.5,Math.min(.5,r-1)); // -0.5..0.5
  var v=vsNat(r), col=d>=0?'#12a06e':'var(--agri,#d1544b)';
  var left=d>=0?50:(50+d*100), w=Math.abs(d)*100;
  return '<div style="display:flex;align-items:center;gap:8px"><div class="db-vs" style="flex:1"><i style="left:'+left+'%;width:'+w+'%;background:'+col+'"></i></div><span class="db-badge '+v.cls+'">'+v.txt+'</span></div>';}
function kpi(v,k,ctx,lead){return '<div class="db-kpi'+(lead?' lead':'')+'"><div class="db-v">'+v+'</div><div class="db-k">'+esc(k)+'</div>'+(ctx?'<div class="db-ctx">'+ctx+'</div>':'')+'</div>';}

// colors (theme-stable accents)
var C={rival:'var(--agri,#d1544b)',moto:'var(--merch,#1c8c7d)',pickup:'#4f7bf0',car:'var(--dim,#8590a6)',ev:'var(--gold,#e6b450)',
       informal:'#e0902f',formal:'#4f7bf0',income:'var(--gold,#e6b450)',pos:'#12a06e'};

var DATA=null; // regions.json
var OCCIND=null; // occupation_income_individual.json — per-person wage (national MEASURED, province ESTIMATED); null-safe

function crumb(parts){ // parts:[{t,href}] last is plain
  return '<nav class="db-crumb" aria-label="Breadcrumb">'+parts.map(function(p,i){
    var arrow=i<parts.length-1?' <b>›</b>':'';
    return (p.href?'<a href="'+p.href+'">'+esc(p.t)+'</a>':'<b style="color:var(--mid)">'+esc(p.t)+'</b>')+arrow;

  h+='<div class="db-kpis">';

  h+='<div class="db-sec"><span class="n">฿</span> The loan book — measured portfolio truth</div>';
  h+='<div id="db-loanbook"><p class="db-note">Loading the loan book…</p></div>';

  h+='<div class="db-sec"><span class="n">C</span> The collateral book — what we hold against the titles</div>';
  h+='<div id="db-collatbook"><p class="db-note">Loading the collateral book…</p></div>';

  h+='<div class="db-sec"><span class="n">R</span> Regions — ranked by competitive pressure</div>';

    h+='<a class="db-card" href="?r='+encodeURIComponent(r.region)+THEME_QS+'">';
    h+='<div class="rt">'+esc(r.label)+'</div><div class="rp">'+r.n_provinces+' provinces · '+num(r.branches)+' branches</div>';
    h+='<div class="cm"><span>Rivals / branch</span><b>'+mult(r.rivals_per_branch)+'</b></div>';
    h+='<div class="cm"><span>Informal share</span><b>'+pct(r.informal_share_pct)+'</b></div>';
    h+='<div class="cm"><span>Motorcycle share</span><b>'+pct(r.moto_share_pct)+'</b></div>';
    h+='<div class="cm"><span>Income vs national</span><b>'+vsNat(r.avg_income_vs_national).txt+'</b></div>';

  h+='<div class="db-chiprow" id="regfilter"><button class="db-chip on" data-r="">All 77</button>'+
     regions.map(function(r){return '<button class="db-chip" data-r="'+esc(r.region)+'">'+esc(r.label)+' ('+r.n_provinces+')</button>';}).join('')+'</div>';
  h+=provinceTable(allProv);

  // "the powerful data in the national map view is lost on me since it's not actionable")
  h+='<div class="db-sec"><span class="n">L</span> Lens rankings — the National-map signals as ranked lists <span class="db-badge" style="color:var(--gold,#e6b450)">ESTIMATED composites</span></div>';

  h+='<div id="lensam" class="db-note">Loading district lenses…</div>';
  h+=footer();

// ---- THE COLLATERAL BOOK (data/collateral_book.json) — moved off the Macro tab 2026-08-02 ----
// Three tables that all answer "what do we hold, and how much room is there in it":
//   1. the full collateral mix to 100% (every class, ranked by baht, never by account count)
//   2. every brand on a title
//   3. recovery headroom — how far resale can fall before the collateral stops covering the loan
// Positions are MEASURED (real loan tape). The shock columns are ILLUSTRATIVE: no Thai used-vehicle
// price index exists to forecast from, so the ladder is applied to measured positions and the
// RANKING is what's real, not the forecast. Null-safe: absent file → one calm note, no empty tables.
function loadCollateralBook(){
  var host=document.getElementById('db-collatbook'); if(!host) return;
  fetch('data/collateral_book.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
   .then(function(j){
    if(!j||!j.types||!j.types.length){ host.innerHTML='<p class="db-note">The collateral book isn\'t loaded (data/collateral_book.json absent). It populates from the monthly no-PII tape drop.</p>'; return; }
    var T=j.types, N=j.national||{}, h='';
    var tier=function(t){return t==='core'?' <span class="th">core</span>':t==='secondary'?' <span class="th">secondary</span>':'';};
    var head=function(v){return 100-v;};                 // the fall a class absorbs before it is underwater
    h+='<p class="db-sub">MEASURED — accounts, outstanding and appraised value from the real loan tape (no-PII aggregates, cells ≥30). Ranked by <b>outstanding baht at every grain</b>: ranking by account count would lead with motorcycles, which are '+
       ((T.filter(function(t){return t.type==='MC';})[0]||{}).n_share_pct||'—')+'% of accounts and '+
       ((T.filter(function(t){return t.type==='MC';})[0]||{}).os_share_pct||'—')+'% of the money.</p>';
    // 1 — the full mix to 100%
    h+='<div class="db-sec2">The full mix to 100% — every collateral class</div>';
    h+='<div class="db-tblwrap"><table class="db-tbl"><thead><tr><th>Collateral</th><th>Outstanding</th><th>% of ฿</th><th>% of accts</th><th>Ticket</th><th>Appraised</th><th>Lent vs value</th><th>90+</th><th>180+</th></tr></thead><tbody>';
    T.forEach(function(t){
      h+='<tr><td class="name">'+esc(t.label)+tier(t.tier)+'</td><td>'+bnf(t.os)+'</td><td>'+pct(t.os_share_pct)+'</td>'+
         '<td>'+pct(t.n_share_pct)+'</td><td>'+baht(t.ticket)+'</td>'+
         '<td>'+(t.eval_avg==null?'—':baht(t.eval_avg))+'</td>'+
         '<td>'+(t.ltv_proxy_pct==null?'—':pct(t.ltv_proxy_pct))+'</td>'+
         '<td style="color:'+sevColor(t.dpd90p_pct)+';font-weight:600">'+pct(t.dpd90p_pct)+'</td>'+
         '<td style="color:'+sevColor(t.late180_pct)+'">'+pct(t.late180_pct)+'</td></tr>';});
    h+='</tbody></table></div>';
    // 2 — every brand on a title
    var BB=j.brand_book||[];
    if(BB.length){
      h+='<div class="db-sec2">Every brand on a title</div>';
      h+='<div class="db-tblwrap"><table class="db-tbl"><thead><tr><th>Brand</th><th>Accounts</th><th>Outstanding</th><th>% of ฿</th><th>Ticket</th><th>Appraised</th><th>Lent vs value</th><th>90+</th><th>180+</th></tr></thead><tbody>';
      BB.forEach(function(b){
        h+='<tr><td class="name">'+esc(b.brand)+'</td><td>'+num(b.n)+'</td><td>'+bnf(b.os)+'</td>'+
           '<td>'+pct(b.os_share_pct)+'</td><td>'+baht(b.ticket)+'</td>'+
           '<td>'+(b.eval_avg==null?'—':baht(b.eval_avg))+'</td>'+
           '<td>'+(b.ltv_proxy_pct==null?'—':pct(b.ltv_proxy_pct))+'</td>'+
           '<td style="color:'+sevColor(b.dpd90p_pct)+';font-weight:600">'+pct(b.dpd90p_pct)+'</td>'+
           '<td style="color:'+sevColor(b.late180_pct)+'">'+pct(b.late180_pct)+'</td></tr>';});
      h+='</tbody></table></div>';
    }
    // 3 — recovery headroom (the shock ladder)
    var WL=T.filter(function(t){return t.ltv_proxy_pct!=null;});
    var bookHead=WL.length?Math.min.apply(null,WL.map(function(t){return head(t.ltv_proxy_pct);})):null;
    var thinBr=null,nBr=0;
    if(j.branches){ var all=[]; Object.keys(j.branches).forEach(function(k){all=all.concat(j.branches[k]);});
      nBr=all.length; thinBr=all.filter(function(b){return (b.ltv_proxy_pct||0)>=60;}).length; }
    h+='<div class="db-sec2">Recovery headroom — how far resale can fall before the collateral stops covering the loan</div>';
    h+='<p class="db-sub" style="margin:2px 0 6px">Per class we hold the <b>measured</b> outstanding per account and the <b>measured</b> appraised value per account; <b>headroom</b> is the gap. At a '+
       (N.ltv_proxy_pct==null?'~52':N.ltv_proxy_pct)+'% lent-to-value ratio a 10% dip changes nothing, so the ladder is scaled to the fall that actually crosses 100%. The shock columns are <b>ILLUSTRATIVE</b> — no Thai used-vehicle price index exists to forecast from — but they are applied to measured positions, so the ranking is real.'+
       (thinBr!=null?' <b>'+thinBr+'</b> of '+num(nBr)+' branches already lend more than 60% of assessed value; nothing is uncovered until resale falls '+(bookHead==null?'far':bookHead.toFixed(0)+'%')+', but those branches reach that point first.':'')+'</p>';
    h+='<div class="db-tblwrap"><table class="db-tbl"><thead><tr><th>Collateral</th><th>Outstanding</th><th>Ticket</th><th>Appraised</th><th>Lent vs value</th><th>Headroom</th><th>After −20%</th><th>After −35%</th><th>After −50%</th></tr></thead><tbody>';
    T.forEach(function(t){
      if(t.ltv_proxy_pct==null){
        h+='<tr><td class="name">'+esc(t.label)+'</td><td>'+bnf(t.os)+'</td><td>'+baht(t.ticket)+'</td>'+
           '<td colspan="6" style="color:var(--dim,#8590a6)">no appraised value carried on this class</td></tr>'; return; }
      var hd=head(t.ltv_proxy_pct);
      var cell=function(f){var cov=t.eval_avg*(1-f/100)/t.ticket*100;
        var col=cov<100?'var(--agri,#d1544b)':cov<115?'var(--gold,#e6b450)':'#12a06e';
        return '<td style="color:'+col+'">'+cov.toFixed(0)+'%</td>';};
      h+='<tr><td class="name">'+esc(t.label)+tier(t.tier)+'</td><td>'+bnf(t.os)+'</td><td>'+baht(t.ticket)+'</td>'+
         '<td>'+baht(t.eval_avg)+'</td><td>'+pct(t.ltv_proxy_pct)+'</td>'+
         '<td style="color:'+(hd<40?'var(--agri,#d1544b)':hd<48?'var(--gold,#e6b450)':'#12a06e')+';font-weight:600">'+hd.toFixed(1)+'%</td>'+
         cell(20)+cell(35)+cell(50)+'</tr>';});
    h+='</tbody></table></div>';
    h+='<p class="db-note">Cover = appraised value after the fall, as a share of what is still lent; below 100% the collateral no longer covers the loan. The external half of this question — what resale values are actually doing, what is registered, and which brands the new collateral is — lives on the <a href="index.html#overview'+(THEME_QS?'&'+THEME_QS.replace(/^&/,''):'')+'">Macro tab</a>.</p>';
    host.innerHTML=h;
  });
}

// ---- LOAN BOOK — consolidated measured loan-tape tables (data/tape_real.json) ----
// The best-formatted page (this one) is where the loan book lives: the bucket ladder + live-book
// vs 180+-legacy split, collateral economics by type, restructuring 'did it hold', and the
// LTV / vintage / collateral-age risk gradients. Null-safe: calm note when the tape is absent.
function sevColor(v){ // color a 90+ rate
  if(v==null)return 'var(--dim,#8590a6)';
  if(v<8)return 'var(--merch,#1c8c7d)'; if(v<14)return '#9CB24E';
  if(v<20)return 'var(--gold,#e6b450)'; if(v<26)return '#D97A3A'; return 'var(--agri,#d1544b)';
}
function nplCol(v){ // color an NPL-live rate (~3-6% scale)
  if(v==null)return 'var(--dim,#8590a6)'; if(v>=6)return 'var(--agri,#d1544b)';
  if(v>=5)return 'var(--gold,#e6b450)'; return '#12a06e';
}
// shared loan-tape cache (data/tape_real.json) — used by the loan-book section, the region cards,
// the province page and the branch page. Fetched once, null-safe.
var TAPE=null, tapeLoaded=false, tapeInflight=false, tapeCbs=[];
function loadTape(cb){
  if(tapeLoaded){ if(cb)cb(TAPE); return; }
  if(cb)tapeCbs.push(cb);
  if(tapeInflight)return; tapeInflight=true;
  fetch('data/tape_real.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
   .then(function(T){TAPE=T;tapeLoaded=true;tapeInflight=false;var q=tapeCbs;tapeCbs=[];q.forEach(function(f){f&&f(TAPE);});});
}
// roll the loan tape up into each region card (owner ask: tape aggregated upward)
function fillRegionTape(T){
  var g=(T&&T.geo&&T.geo.regions)||null; if(!g)return;
  document.querySelectorAll('.tape-block[data-region]').forEach(function(el){
    var v=g[el.getAttribute('data-region')]; if(!v){el.innerHTML='';return;}
    el.innerHTML=
      '<div class="tape-lab">Loan tape · measured</div>'+
      '<div class="cm cm-tape"><span>Loan book</span><b>'+num(v.n)+' · ฿'+(v.os_sum/1e9).toFixed(1)+'bn</b></div>'+
      '<div class="cm cm-tape"><span>NPL-live (90–179)</span><b style="color:'+nplCol(v.npl_live_pct)+'">'+v.npl_live_pct+'%</b></div>'+
      '<div class="cm cm-tape"><span>90+ dpd</span><b style="color:'+sevColor(v.dpd90p_pct)+'">'+v.dpd90p_pct+'%</b></div>'+
      '<div class="cm cm-tape"><span>X-days window</span><b>'+num(Math.round(v.n*v.early_pct/100))+'</b></div>';
  });
}
function bnf(n){return '฿'+(n/1e9).toFixed(2)+'bn';}
function mnf(n){return '฿'+Math.round(n/1e6).toLocaleString('en-US')+'m';}
function loadLoanBook(){
  var host=document.getElementById('db-loanbook'); if(!host) return;
  loadTape(function(T){
    if(!T||!T.bucket_ladder){ host.innerHTML='<p class="db-note">The loan-tape layer isn\'t loaded (data/tape_real.json absent). It populates once the monthly no-PII tape drop is ingested.</p>'; return; }
    var lb=T.bucket_ladder.live_book, lg=T.bucket_ladder.legacy_180plus, bt=T.bucket_ladder.book_total;
    var h='';
    h+='<p class="db-sub">MEASURED real loan tape — '+num(T.meta.n_accounts)+' accounts, no-PII aggregates (cells ≥30); raw stays on the owner\'s disk. The 180+ bucket is legacy workout stock, held SEPARATELY from the live book.</p>';
    // KPI strip
    h+='<div class="db-kpis">';
    h+=kpi(num(bt.n),'Whole book',bnf(bt.os_sum)+' OS — everything on the tape',true);
    h+=kpi(num(lb.n),'Live book',bnf(lb.os_sum)+' OS · Current…150dpd');
    h+=kpi(lb.npl_live_pct+'%','NPL-live (90–179)',lb.npl_live_os_pct+'% OS-weighted · '+num(lb.npl_live_n)+' a/c');
    h+=kpi(bnf(lg.os_sum),'180+ legacy',num(lg.n)+' a/c · '+lg.acct_share_pct+'% of book · held apart');
    h+='</div>';
    // bucket ladder
    var LBL={'1.Current':'Current','2.X_Days':'X-days','3.30_dpd':'30 dpd','4.60_dpd':'60 dpd','5.90_dpd':'90 dpd','6.120_dpd':'120 dpd','7.150_dpd':'150 dpd','8.180+_dpd':'180+ dpd'};
    var lad=T.bucket_ladder.ladder, maxN=lad.reduce(function(m,x){return Math.max(m,x.n);},0);
    h+='<div class="db-sec2">Bucket ladder — Current → NPL → legacy</div>';
    h+='<div class="db-tblwrap"><table class="db-tbl"><thead><tr><th>Bucket</th><th>Accounts</th><th>Share</th><th>Outstanding</th><th></th></tr></thead><tbody>';
    lad.forEach(function(x){var legacy=x.bucket.charAt(0)==='8';
      h+='<tr><td class="name">'+esc(LBL[x.bucket]||x.bucket)+(legacy?' <span class="th">legacy</span>':'')+'</td>'+
         '<td>'+num(x.n)+'</td><td>'+(x.n*100/bt.n).toFixed(1)+'%</td><td>'+bnf(x.os_sum)+'</td>'+
         '<td style="width:26%">'+lensBar(x.n,maxN,legacy?'#7A4FE0':'#4f7bf0')+'</td></tr>';});
    h+='</tbody></table></div>';
    // collateral economics
    h+='<div class="db-sec2">Collateral economics — risk vs the spread it earns</div>';
    h+='<p class="db-sub" style="margin:2px 0 6px">Gross spread = yield − opex (8%) − CoF (2.5%), before credit loss. Land yields 15% (4.5% spread) vs 23.99% elsewhere (13.49%), but carries the lowest risk. 90+/180+ are point-in-time stock shares, shown separately.</p>';
    h+='<div class="db-tblwrap"><table class="db-tbl"><thead><tr><th>Type</th><th>Accounts</th><th>Outstanding</th><th>Yield</th><th>Gross spread</th><th>90+</th><th>NPL-live</th><th>Avg eval</th></tr></thead><tbody>';
    (T.collateral.economics_by_type||[]).forEach(function(r){
      h+='<tr><td class="name">'+esc(r.type)+'</td><td>'+num(r.n)+'</td><td>'+bnf(r.os_sum)+'</td>'+
         '<td>'+r.yield_pct+'%</td><td style="color:'+(r.gross_spread_pct<6?'var(--gold,#e6b450)':'#12a06e')+';font-weight:600">'+r.gross_spread_pct+'%</td>'+
         '<td style="color:'+sevColor(r.dpd90p_pct)+';font-weight:600">'+r.dpd90p_pct+'%</td><td>'+r.npl_live_pct+'%</td><td>'+baht(r.eval_avg)+'</td></tr>';});
    h+='</tbody></table></div>';
    // restructuring
    var rs=(T.restructuring&&T.restructuring.by_status)||[];
    if(rs.length){
      h+='<div class="db-sec2">Restructuring — did it hold?</div>';
      h+='<div class="db-tblwrap"><table class="db-tbl"><thead><tr><th>Status</th><th>Accounts</th><th>Outstanding</th><th>X-days</th><th>Roll</th><th>90+</th><th>180+</th><th>NPAT/a·c</th></tr></thead><tbody>';
      ['Normal','Skip','Pre-emptive','TDR'].forEach(function(s){var r=null;rs.forEach(function(x){if(x.status===s)r=x;});if(!r)return;var neg=r.npat_margin_avg<0;
        h+='<tr><td class="name">'+esc(r.status)+'</td><td>'+num(r.n)+'</td><td>'+bnf(r.os_sum)+'</td>'+
           '<td>'+r.early_pct+'%</td><td>'+r.roll_pct+'%</td>'+
           '<td style="color:'+sevColor(r.dpd90p_pct)+';font-weight:600">'+r.dpd90p_pct+'%</td>'+
           '<td style="color:'+sevColor(r.late180_pct)+'">'+r.late180_pct+'%</td>'+
           '<td style="color:'+(neg?'var(--agri,#d1544b)':'#12a06e')+';font-weight:600">'+(neg?'−':'')+'฿'+num(Math.abs(r.npat_margin_avg))+'</td></tr>';});
      h+='</tbody></table></div>';
    }
    // risk gradients: LTV + collateral age
    function gradTable(obj,label,keymap){
      if(!obj)return '';
      var keys=Object.keys(obj).sort();
      var g='<div class="db-sec2">'+esc(label)+'</div><div class="db-tblwrap"><table class="db-tbl"><thead><tr><th>Band</th><th>Accounts</th><th>90+</th><th>NPL-live</th><th></th></tr></thead><tbody>';
      keys.forEach(function(k){var v=obj[k];
        g+='<tr><td class="name">'+esc(keymap?(keymap[k]||k):k)+'</td><td>'+num(v.n)+'</td>'+
           '<td style="color:'+sevColor(v.dpd90p_pct)+';font-weight:600">'+v.dpd90p_pct+'%</td>'+
           '<td>'+(v.npl_live_pct==null?'—':v.npl_live_pct+'%')+'</td>'+
           '<td style="width:24%">'+lensBar(v.dpd90p_pct,30,sevColor(v.dpd90p_pct))+'</td></tr>';});
      return g+'</tbody></table></div>';
    }
    var AGL={'1.<=5 yr.':'≤5 yr','2.(5-10]yr.':'5–10 yr','3.(10-12]yr.':'10–12 yr','4.(12-15]yr.':'12–15 yr','5.(15-18]yr.':'15–18 yr','6.(18-20]yr.':'18–20 yr','7.(20-25]yr.':'20–25 yr','8.>25 yr.':'>25 yr'};

function provinceTable(rows){
  var h='<div class="db-tblwrap"><table class="db-tbl" id="ptbl"><thead><tr>';
  COLS.forEach(function(c,i){h+='<th data-c="'+i+'" scope="col" tabindex="0" aria-sort="none" title="Sort by '+esc(c.t)+'">'+esc(c.t)+'</th>';});
  h+='</tr></thead><tbody>'+rows.map(rowHtml).join('')+'</tbody></table></div>';
  return h;

function rowHtml(p){return '<tr data-slug="'+esc(p.slug)+'">'+COLS.map(function(c){return c.cell(p);}).join('')+'</tr>';}

var sortState={c:3,dir:-1}; // default: rivals/branch desc
function wireTable(rows){
  var tbl=document.getElementById('ptbl'); if(!tbl)return;
  applySort(rows);
  function doSort(th){var c=+th.getAttribute('data-c'); // no arg -> re-sort the table's CURRENT (possibly region-filtered) row set
    if(sortState.c===c)sortState.dir*=-1;else{sortState.c=c;sortState.dir=(c===0?1:-1);}
    applySort();}
  tbl.querySelectorAll('th').forEach(function(th){
    th.addEventListener('click',function(){doSort(th);});
    // headers are tabindex=0 (not native buttons) so wire keyboard sort ourselves (WCAG 2.1.1)
    th.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();doSort(th);}});
  });
  tbl.querySelector('tbody').addEventListener('click',function(e){var tr=e.target.closest('tr');if(tr&&tr.getAttribute('data-slug'))location.href='?p='+encodeURIComponent(tr.getAttribute('data-slug'))+THEME_QS;});
}
// #ptbl.__rows is the single source of truth for what the table is currently showing. Pass `rows`
// to swap the set (initial render / region filter); call with no arg to re-sort what's already there
// so a column-sort after a filter keeps the filter instead of reverting to all 77 provinces.
function applySort(rows){
  var tbl=document.getElementById('ptbl'); if(!tbl)return;
  if(rows)tbl.__rows=rows; else rows=tbl.__rows||[];
  var c=COLS[sortState.c];
  rows.sort(function(a,b){var x=c.get(a),y=c.get(b);if(typeof x==='string')return sortState.dir*x.localeCompare(y);return sortState.dir*(x-y);});
  var tb=tbl.querySelector('tbody'); if(tb)tb.innerHTML=rows.map(rowHtml).join('');
  tbl.querySelectorAll('th').forEach(function(th,i){th.classList.remove('sort-asc','sort-desc');if(i===sortState.c){th.classList.add(sortState.dir>0?'sort-asc':'sort-desc');th.setAttribute('aria-sort',sortState.dir>0?'ascending':'descending');}else{th.setAttribute('aria-sort','none');}});
}
function wireFilter(allRows){
  var box=document.getElementById('regfilter'); if(!box)return;
  box.addEventListener('click',function(e){var b=e.target.closest('.db-chip');if(!b)return;
    box.querySelectorAll('.db-chip').forEach(function(c){c.classList.remove('on');});b.classList.add('on');
    var r=b.getAttribute('data-r');var rows=r?allRows.filter(function(p){return p.region===r;}):allRows.slice();
    applySort(rows); // swaps the table's row set to the filtered view; subsequent column-sorts stick to it
  });
}

function fillProvinceBranches(provTh){
  var host=document.getElementById('provbranches'); if(!host)return;
  loadBranchLayers(function(){
    var rows=[]; BR2.forEach(function(d,i){if(d&&d.v===provTh)rows.push({d:d,i:i});});
    rows.sort(function(A,B){return (B.d.o||0)-(A.d.o||0);});
    if(!rows.length){host.innerHTML='<p class="db-note" style="text-align:left;padding:8px 0">No per-branch records for this province.</p>';return;}
    var h='<p class="db-sub" style="margin:2px 0 8px">All '+num(rows.length)+' branches here, highest opportunity first. Scores are estimated 0–100 lens screens; click a branch for its full readout.</p>';
    h+='<div class="db-tblwrap"><table class="db-tbl"><thead><tr><th>Branch</th><th>District</th><th>Opp</th><th>Agri-PD</th><th>Merchant</th><th>Collat</th><th>Pop ≤10km</th><th>Workers</th></tr></thead><tbody>';
    rows.forEach(function(row){var d=row.d;
      h+='<tr data-i="'+row.i+'" style="cursor:pointer"><td class="name" lang="th">'+esc(d.n)+'</td><td class="sub" lang="th">'+esc(d.d||'—')+'</td>'+
        '<td class="mono" style="color:'+scoreCol(d.o)+'">'+Math.round(d.o)+'</td>'+
        '<td class="mono" style="color:'+scoreCol(d.a)+'">'+Math.round(d.a)+'</td>'+
        '<td class="mono" style="color:'+scoreCol(d.m)+'">'+Math.round(d.m)+'</td>'+
        '<td class="mono" style="color:'+scoreCol(d.c)+'">'+Math.round(d.c)+'</td>'+
        '<td class="mono">'+num(d.pop)+'</td><td class="mono">'+num(d.dwork)+'</td></tr>';
    });
    h+='</tbody></table></div>';
    host.innerHTML=h;
    host.querySelector('tbody').addEventListener('click',function(e){var tr=e.target.closest('tr');if(tr&&tr.getAttribute('data-i'))location.href='?b='+tr.getAttribute('data-i')+THEME_QS;});
  });
}
function metricRow(label,sub,val,graphic){
  return '<div class="db-row"><div class="rl">'+esc(label)+(sub?'<small>'+esc(sub)+'</small>':'')+'</div><div class="rv">'+val+'</div><div class="rg">'+(graphic||'')+'</div></div>';
}
function occTable(inc,natOcc,provTh){
  var keys=['Agriculture','FactoryWorkers','OfficeStaff','SMEOwners','Transport'];
  var lab={Agriculture:'Agriculture',FactoryWorkers:'Factory',OfficeStaff:'Office / clerical',SMEOwners:'SME owner',Transport:'Transport'};
  // per-person individual figures (measured national / estimated province) — null-safe; keyed by Thai province name
  var pind=(OCCIND&&OCCIND.provinces&&provTh&&OCCIND.provinces[provTh])||null;
  var rows=keys.filter(function(k){return inc[k]!=null;}).map(function(k){
    var r=(natOcc[k]?inc[k]/natOcc[k]:null),v=vsNat(r);
    var ind='';
    if(k==='SMEOwners'){
      ind='<div class="db-row" style="grid-template-columns:1fr;padding:1px 0 5px"><div class="rl" style="color:var(--dim);font-size:10.5px">Individual: self-employed — no measured individual wage</div></div>';
    }else if(pind&&pind[k]&&pind[k].individual_est!=null){
      ind='<div class="db-row" style="grid-template-columns:1fr;padding:1px 0 5px"><div class="rl" style="color:var(--dim);font-size:10.5px">Individual ~'+baht(pind[k].individual_est)+'/mo <span style="color:var(--dim);font-weight:600;font-size:9px;letter-spacing:.04em">EST</span></div></div>';
    }
    return '<div class="db-row" style="grid-template-columns:1fr auto auto;gap:10px"><div class="rl">'+lab[k]+'</div><div class="rv" style="font-size:13.5px">'+baht(inc[k])+' <span style="color:var(--dim);font-weight:400;font-size:11px">household</span></div><div><span class="db-badge '+v.cls+'">'+v.txt+'</span></div></div>'+ind;
  }).join('');
  var note=pind?'<div class="db-row" style="grid-template-columns:1fr;padding-top:5px"><div class="rl" style="color:var(--dim);font-size:10px;line-height:1.5">Household = NSO SES by occupation class (measured, multi-earner). Individual per-person: national MEASURED (ILOSTAT), province ESTIMATED. SME owners are self-employed — no measured individual wage.</div></div>':'';
  return '<div class="db-rows" style="margin:0"><div class="db-row" style="grid-template-columns:1fr;padding-bottom:4px"><div class="rl" style="color:var(--dim);font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em">Household income by occupation class · ฿/mo · vs national</div></div>'+rows+note+'</div>';
}
function districtTable(d){
  var feats=(d.districts&&d.districts.features)?d.districts.features.slice():[];
  if(!feats.length)return '<div class="db-note" style="padding:20px 0">No district breakdown for this province.</div>';
  feats.sort(function(a,b){return (b.properties.competitors||0)-(a.properties.competitors||0);});
  var h='<div class="db-tblwrap"><table class="db-tbl"><thead><tr><th scope="col">District</th><th scope="col">AutoX</th><th scope="col">Rivals</th><th scope="col">Working-age</th><th scope="col">DIW workers</th></tr></thead><tbody>';
  feats.forEach(function(f){var p=f.properties||{};var contested=(p.competitors||0)>(p.branches||0);
    h+='<tr style="cursor:default"><td class="name">'+esc(p.district||p.shapeName||'—')+'</td><td>'+num(p.branches||0)+'</td><td class="'+(contested?'hot':'')+'">'+num(p.competitors||0)+'</td><td>'+num(p.workingage||0)+'</td><td>'+num(p.real_workers||0)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function footer(){
  var m=DATA.meta||{};
  return '<div class="db-foot">Measured sources: DIW factories · DLT registered vehicles · NSO labour force &amp; income · big-4 rival branch census. Region figures are true rollups (counts summed; shares as ratio-of-sums; incomes labour-weighted). "vs national" uses the computed labour-weighted national mean. Bangkok’s informal/formal split is unavailable and is skipped in that ratio only.</div>';
}

// ============================ BRANCH LEVEL ============================
// The data-book branch surface (owner IA): all 2,015 branches browsable + a per-branch drill-down
// that consolidates the index-aligned branch layers. ?branches = the full table; ?b=<index> = one
// branch's readout. Everything joins on the branches.json record index.
var BR2=null, BRPROV=null, BRLAYERS={};
function loadBranchLayers(cb){
  if(BR2){cb();return;}
  var need=['branches','provinces/index','branch_risk','branch_peers','branch_recommendations','branch_density','branch_occupations'];
  Promise.all(need.map(function(f){return fetch('data/'+f+'.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}))
   .then(function(res){
     BR2=res[0]||[];
     var idx=res[1], provs=Array.isArray(idx)?idx:((idx&&idx.provinces)||[]);
     BRPROV={}; provs.forEach(function(p){BRPROV[p.th||p.name_th||p.name]=p;});
     BRLAYERS={risk:res[2],peers:res[3],recs:res[4],density:res[5],occ:res[6]};
     cb();
   }).catch(function(){var el=document.getElementById('db-loading');if(el)el.textContent='Could not load data/branches.json.';});
}
function scoreCol(v){if(v==null)return 'var(--dim)';if(v>=67)return '#12a06e';if(v>=45)return 'var(--gold,#e6b450)';if(v>=25)return '#D97A3A';return 'var(--agri,#d1544b)';}
function riskCol(v){if(v==null)return 'var(--dim)';if(v>=60)return 'var(--agri,#d1544b)';if(v>=40)return 'var(--gold,#e6b450)';return '#12a06e';}
function estabTot(d){var k=d.k10;if(!k)return 0;var t=0;for(var key in k){t+=k[key]||0;}return t;}
var BRCOLS=[
  {t:'Branch',g:function(d){return d.n;},txt:1},
  {t:'Province',g:function(d){return d.v;},txt:1},
  {t:'District',g:function(d){return d.d||'';},txt:1},
  {t:'Opportunity',g:function(d){return d.o;},score:1},
  {t:'Agri-PD',g:function(d){return d.a;},score:1},
  {t:'Merchant',g:function(d){return d.m;},score:1},
  {t:'Collateral',g:function(d){return d.c;},score:1},
  {t:'Pop ≤10km',g:function(d){return d.pop;},n:1},
  {t:'Workers',g:function(d){return d.dwork;},n:1},
  {t:'Factories',g:function(d){return d.dfac;},n:1},
  {t:'Estab ≤10km',g:estabTot,n:1},
  {t:'Rain',g:function(d){return d.rain;},n:1}
];
var brSort={c:3,dir:-1}, brFilter='all', brQuery='';
function natHref(){return '?'+(THEME_QS?THEME_QS.replace(/^&/,''):'');}
function renderBranchBrowse(){
  loadBranchLayers(function(){
    document.getElementById('db-loading').style.display='none';
    var regions=['all']; BR2.forEach(function(d){if(d&&regions.indexOf(d.r)<0)regions.push(d.r);});
    var h=crumb([{t:'Thailand (all 77)',href:natHref()},{t:'All branches'}]);
    h+='<h1 class="db-h1">All branches — the network in numbers</h1>';
    h+='<p class="db-sub">Every one of the '+num(BR2.length)+' AutoX branches, with all measured features and the estimated lens scores. Sort any column, filter by region, search, or download. Click a branch for its full readout.</p>';
    h+='<div class="db-chiprow" id="brchips">'+regions.map(function(r){return '<button class="db-chip'+(r===brFilter?' on':'')+'" data-r="'+esc(r)+'">'+(r==='all'?'All 77':esc(r))+'</button>';}).join('')+'</div>';
    h+='<input class="search" id="brsearch" type="search" enterkeyhint="search" aria-label="Search branches by name, province, or district" placeholder="Search branch / province / district…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" style="margin-bottom:10px" value="'+esc(brQuery)+'">';
    h+='<div id="brsearchstatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>';
    h+='<button class="db-chip" id="brcsv" style="margin:0 0 12px">⬇ Download CSV</button>';
    h+='<div class="db-tblwrap"><table class="db-tbl" id="brtbl"><thead><tr>';
    BRCOLS.forEach(function(c,ci){h+='<th data-c="'+ci+'" scope="col" tabindex="0" aria-sort="none">'+esc(c.t)+'</th>';});
    h+='</tr></thead><tbody id="brbody"></tbody></table></div>';
    h+='<p class="db-note" style="padding:14px 0 0;text-align:left">Scores (opportunity / agri-PD / merchant / collateral) are ESTIMATED 0–100 screens over measured inputs — not measured default rates. Pop / workers / factories / establishments / rain are MEASURED. Click any branch for its full readout.</p>';
    document.getElementById('db-root').innerHTML=h;
    var chips=document.getElementById('brchips');
    chips.onclick=function(e){var b=e.target.closest('.db-chip');if(!b)return;brFilter=b.getAttribute('data-r');chips.querySelectorAll('.db-chip').forEach(function(c){c.classList.toggle('on',c===b);});fillBranchBody();};
    var s=document.getElementById('brsearch');
    s.oninput=function(){brQuery=s.value;fillBranchBody();};
    document.getElementById('brtbl').querySelectorAll('th').forEach(function(th){
      function so(){var c=+th.getAttribute('data-c');if(brSort.c===c)brSort.dir*=-1;else{brSort.c=c;brSort.dir=(BRCOLS[c].txt?1:-1);}fillBranchBody();}
      th.addEventListener('click',so);
      th.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();so();}});
    });
    document.getElementById('brbody').addEventListener('click',function(e){var tr=e.target.closest('tr');if(tr&&tr.getAttribute('data-i'))location.href='?b='+tr.getAttribute('data-i')+THEME_QS;});
    fillBranchBody();
  });
}
function branchRows(){
  var q=brQuery.trim().toLowerCase(), rows=[];
  BR2.forEach(function(d,i){if(!d)return;
    var en=(BRPROV[d.v]&&BRPROV[d.v].en)||'';
    if((brFilter==='all'||d.r===brFilter)&&(!q||d.n.toLowerCase().indexOf(q)>=0||d.v.toLowerCase().indexOf(q)>=0||en.toLowerCase().indexOf(q)>=0||(d.d||'').toLowerCase().indexOf(q)>=0))
      rows.push({d:d,i:i});
  });
  var col=BRCOLS[brSort.c];
  rows.sort(function(A,B){var a=col.g(A.d),b=col.g(B.d);
    if(col.txt)return brSort.dir*String(a||'').localeCompare(String(b||''));
    return brSort.dir*((a==null?-1:a)-(b==null?-1:b));});
  return rows;
}
var brLastStatus='';
// Polite, query-aware result-count announcement for #brsearch (WCAG 4.1.3 Status Messages),
// mirroring the SPA's setSearchStatus: silent on an empty query (tab-open / cleared box),
// region-qualified when a region chip is active, guarded so a re-sort doesn't re-announce.
function setBrStatus(n){
  var el=document.getElementById('brsearchstatus'); if(!el)return;
  var q=brQuery.trim(), msg='';
  if(q){var reg=(brFilter&&brFilter!=='all')?(' in '+brFilter):'';
    msg=n+' '+(n===1?'branch':'branches')+' match'+reg;}
  if(msg===brLastStatus)return; brLastStatus=msg; el.textContent=msg;
}
function fillBranchBody(){
  var rows=branchRows(), body=document.getElementById('brbody'); if(!body)return;
  setBrStatus(rows.length);
  document.querySelectorAll('#brtbl th').forEach(function(th){var c=+th.getAttribute('data-c');var on=(c===brSort.c);
    th.className=on?(brSort.dir>0?'sort-asc':'sort-desc'):'';
    th.setAttribute('aria-sort',on?(brSort.dir>0?'ascending':'descending'):'none');});
  var out='';
  rows.forEach(function(row){var d=row.d;out+='<tr data-i="'+row.i+'" style="cursor:pointer">';
    BRCOLS.forEach(function(c){var v=c.g(d);
      if(c.txt)out+='<td class="'+(c.t==='Branch'?'name':'sub')+'" lang="th">'+esc(v||'—')+'</td>';
      else if(c.score)out+='<td class="mono" style="color:'+scoreCol(v)+'">'+(v==null?'—':Math.round(v))+'</td>';
      else out+='<td class="mono">'+num(v)+'</td>';});
    out+='</tr>';});
  body.innerHTML=out||'<tr><td colspan="'+BRCOLS.length+'" class="db-note" style="padding:20px">No branches match. Clear the search or region filter.</td></tr>';
  var csv=document.getElementById('brcsv'); if(csv){csv.textContent='⬇ Download CSV ('+num(rows.length)+')';
    csv.onclick=function(){
      var hdr=['branch','province','region','district','opportunity_est','agri_pd_est','merchant_est','collateral_est','pop_10km','district_workers','district_factories','estab_10km','rain'];
      var lines=[hdr.join(',')].concat(rows.map(function(row){var d=row.d;
        return [d.n,d.v,d.r,d.d,d.o,d.a,d.m,d.c,d.pop,d.dwork,d.dfac,estabTot(d),d.rain].map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}));
      var blob=new Blob(['﻿',lines.join('\n')],{type:'text/csv;charset=utf-8;'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='autox_branches.csv';a.click();URL.revokeObjectURL(a.href);
    };}
}
function renderBranch(idxStr){
  var idx=parseInt(idxStr,10);
  loadBranchLayers(function(){
    document.getElementById('db-loading').style.display='none';
    var d=BR2[idx];
    if(!d){document.getElementById('db-root').innerHTML='<p class="db-note">Branch not found. <a href="?branches'+THEME_QS+'">Back to all branches →</a></p>';return;}
    var pv=BRPROV[d.v]||{}, slug=pv.slug;
    var L=BRLAYERS, at=function(o){return (o&&o.branches&&o.branches[idx])||null;};
    var risk=at(L.risk), peer=at(L.peers), recs=at(L.recs), dens=at(L.density);
    var h=crumb([{t:'Thailand',href:natHref()},{t:d.v,href:slug?('?p='+encodeURIComponent(slug)+THEME_QS):null},{t:'All branches',href:'?branches'+THEME_QS},{t:d.n}]);
    h+='<h1 class="db-h1" lang="th">'+esc(d.n)+' <span class="th">'+esc(d.d||'')+' · '+esc(d.v)+'</span></h1>';
    h+='<p class="db-sub">'+esc(d.r)+' region'+(risk&&risk.code?' · <span class="mono">'+esc(risk.code)+'</span>':'')+'. The full measured feature set, the estimated lens scores, and the peer-twin benchmark for this branch.</p>';
    h+='<div class="db-kpis">';
    h+=kpi('<span style="color:'+scoreCol(d.o)+'">'+Math.round(d.o)+'</span>','Opportunity (est)','coverage / under-served demand');
    h+=kpi('<span style="color:'+scoreCol(d.a)+'">'+Math.round(d.a)+'</span>','Agri-PD (est)','agri-stress exposure');
    h+=kpi('<span style="color:'+scoreCol(d.m)+'">'+Math.round(d.m)+'</span>','Merchant (est)','trade depth ≤10km');
    h+=kpi('<span style="color:'+scoreCol(d.c)+'">'+Math.round(d.c)+'</span>','Collateral (est)','vehicle / gold depth');
    if(risk)h+=kpi('<span style="color:'+riskCol(risk.composite_risk)+'">'+Math.round(risk.composite_risk)+'</span>','Composite risk (est)','household+agri+occupation+seg');
    h+='</div>';
    h+='<div id="branch-tape"></div>';   // measured loan book for this branch (async, null-safe)
    h+='<div class="db-sec2">Measured features</div><div class="db-tblwrap"><table class="db-tbl"><tbody>';
    function frow(k,v){return '<tr style="cursor:default"><td class="name">'+esc(k)+'</td><td class="mono">'+v+'</td></tr>';}
    h+=frow('Population ≤10km',num(d.pop));
    h+=frow('District factory workers (DIW)',num(d.dwork));
    h+=frow('District factories (DIW)',num(d.dfac));
    if(dens)h+=frow('Buildings ≤10km (Overture)',num(dens.buildings_10km)+' <span class="sub">'+esc((dens.bucket||'').replace(/_/g,' '))+'</span>');
    h+=frow('Recent rainfall index',d.rain==null?'—':d.rain);
    if(d.k10){[['ind','Industrial POI'],['bank','Banks'],['atm','ATMs'],['cvs','Convenience'],['hotel','Hotels']].forEach(function(o){if(d.k10[o[0]]!=null)h+=frow(o[1]+' ≤10km',num(d.k10[o[0]]));});}
    if(risk&&risk.components){var cm=risk.components;for(var ck in cm){h+=frow('Risk component — '+ck,'<span style="color:'+riskCol(cm[ck])+'">'+Math.round(cm[ck])+'</span>');}}
    h+='</tbody></table></div>';
    if(peer){
      h+='<div class="db-sec2">Peer-twin benchmark</div>';
      h+='<p class="db-sub">This branch vs its 15 statistical market-twins (same 10km fingerprint, ≥25km away). dev = robust σ above/below the twin median — "risky vs its market" is not the same as "risky market".</p>';
      h+='<div class="db-kpis">';
      h+=kpi((peer.dev>0?'+':'')+peer.dev+'σ','vs peer twins',peer.dev>=2?'RISKY vs its market twins':peer.dev<=-1?'better than its market':'in line with its market');
      if(peer.pm!=null)h+=kpi(peer.pm,'twin median risk','the local market baseline');
      h+='</div>';
    }
    if(recs&&recs.recs&&recs.recs.length){
      h+='<div class="db-sec2">Recommendations</div><div class="db-rows">';
      recs.recs.forEach(function(r){var tc=r.tone==='good'?'#12a06e':r.tone==='bad'?'var(--agri,#d1544b)':'var(--mid)';
        h+='<div class="db-row" style="grid-template-columns:28px 1fr"><div class="rl" style="font-size:16px">'+(r.i||'•')+'</div><div class="rl" style="color:'+tc+'">'+esc(r.t)+'</div></div>';});
      h+='</div>';
    }
    h+='<div class="db-3dlinks"><a href="branch-explorer.html?lat='+d.y+'&lng='+d.x+'&n=1'+THEME_QS+'">🏙 3D branch scene →</a>'+(slug?'<a href="rayong-catchment.html?city='+encodeURIComponent(slug)+THEME_QS+'">🏙 province buildings →</a>':'')+'<a href="?branches'+THEME_QS+'">← all branches</a></div>';
    h+='<p class="db-note" style="padding:14px 0 0;text-align:left">Lens scores &amp; composite risk are ESTIMATED 0–100 screens over measured inputs — not measured default rates. Population / workers / factories / buildings / POI counts are MEASURED.</p>';
    document.getElementById('db-root').innerHTML=h;
    fillBranchTape(d.n, slug);
  });
}
function normBr(s){return String(s||'').replace(/เงินไชโย|สาขา|\s+/g,'');}
var _tapeBrIdx=null;
// measured loan book for one branch (data/tape_real.json geo.branches, top-N by size). Honest
// note when the branch is below the extract's floor; joins by normalized branch name.
function fillBranchTape(brName, slug){
  var host=document.getElementById('branch-tape'); if(!host)return;
  loadTape(function(T){
    var g=(T&&T.geo&&T.geo.branches)||null; if(!g){host.innerHTML='';return;}
    if(!_tapeBrIdx){_tapeBrIdx={};for(var k in g){_tapeBrIdx[normBr(k)]=g[k];}}
    var v=_tapeBrIdx[normBr(brName)];
    var h='<div class="db-sec2">Loan book — measured tape</div>';
    if(!v){host.innerHTML=h+'<p class="db-sub" style="text-align:left;margin-top:2px">Below the tape extract\'s publication floor — the per-branch tape covers the larger branches (cells ≥30 accounts). This branch\'s province &amp; region loan-book roll-up is on its'+(slug?' <a href="?p='+encodeURIComponent(slug)+THEME_QS+'">province page</a>':' province page')+'.</p>';return;}
    h+='<div class="db-kpis">';
    h+=kpi(num(v.n)+' <small>a/c</small>','On the tape','฿'+(v.os_sum/1e9).toFixed(2)+'bn outstanding',true);
    h+=kpi('<span style="color:'+sevColor(v.dpd90p_pct)+'">'+v.dpd90p_pct+'%</span>','90+ dpd','this branch');
    h+=kpi('<span style="color:'+nplCol(v.npl_live_pct)+'">'+v.npl_live_pct+'%</span>','NPL-live','90–179dpd');
    h+=kpi(v.early_pct+'%','X-days window','late &lt;30dpd · pre-emptive');
    h+='</div>';
    h+='<p class="db-sub" style="margin-top:-6px">Measured no-PII tape for this branch. Roll (30–89dpd) '+v.roll_pct+'% · 180+ legacy '+v.late180_pct+'% · avg NPAT ฿'+num(v.npat_margin_avg)+'/account.</p>';
    host.innerHTML=h;
  });
}

// ---- boot ----
// load the per-person occupation-income layer first (best-effort, null-safe), then the data book.
fetch('data/occupation_income_individual.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}).then(function(oi){
  OCCIND=oi;
  return fetch('data/regions.json').then(function(r){if(!r.ok)throw 0;return r.json();});
}).then(function(data){
  DATA=data;
  document.getElementById('db-loading').style.display='none';
  var qs=new URLSearchParams(location.search),p=qs.get('p'),rg=qs.get('r'),b=qs.get('b');
  if(b!=null&&b!=='')renderBranch(b);
  else if(qs.has('branches'))renderBranchBrowse();
  else if(p)renderProvince(p);
  else if(rg)renderRegion(rg);
  else renderNational();
}).catch(function(){
  var el=document.getElementById('db-loading');if(el){el.textContent='Data book unavailable — could not load data/regions.json.';}
});
})();
</script>
