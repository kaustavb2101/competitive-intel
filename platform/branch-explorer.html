<!DOCTYPE html>

<script>/* set theme before paint to avoid flash; ?theme= overrides, else saved, else dark */
(function(){try{var q=new URLSearchParams(location.search).get('theme');var t=q||localStorage.getItem('autox-theme')||'dark';document.documentElement.dataset.theme=(t==='light'?'light':'dark');}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<meta charset="UTF-8"/>

<title>Branch 3D Explorer — AutoX · เงินไชโย</title>
<script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
<style>
:root{--ink:#070a11;--panel:#0e131f;--line:#1d2738;--hi:#eef1f7;--txt:#c7cedd;--mid:#8590a6;--dim:#65718c;--gold:#E0A93B;--accent:#5B7CFA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--ink);color:var(--txt)}
#map{position:fixed;inset:0;top:44px;background:var(--ink)}
#bar{position:fixed;top:0;left:0;right:0;height:44px;z-index:50;display:flex;align-items:center;gap:12px;
 padding:0 14px;background:rgba(8,11,18,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
#bar a{color:var(--mid);text-decoration:none;font:600 13px 'IBM Plex Sans Thai'}
#bar a:hover{color:var(--hi)}
#bar .nm{font:700 14px 'IBM Plex Sans Thai';color:var(--hi)}
#bar .sub{font:500 12px 'IBM Plex Sans Thai';color:var(--dim)}
#panel{position:fixed;top:56px;left:12px;width:268px;max-height:calc(100vh - 72px);overflow:auto;z-index:40;
 background:rgba(14,19,31,.94);border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(8px)}
#panel h3{font:700 12px 'IBM Plex Sans Thai';color:var(--mid);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
#panel h3:first-child{margin-top:0}
.pr{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;color:var(--txt)}
.pr span{flex:1}.pr b{font-family:'IBM Plex Mono';min-width:30px;text-align:right}
.bar{display:inline-block;width:54px;height:6px;border-radius:3px;background:#1a2336;overflow:hidden}
.bar i{display:block;height:100%}
.note{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:10px}
#status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;
 background:rgba(14,19,31,.95);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:12px;color:var(--mid)}
#status.err{color:#E0474B;border-color:#5b2330}
.ctl{position:fixed;top:56px;right:12px;z-index:40;display:flex;flex-direction:column;gap:6px}
.ctl button{background:rgba(14,19,31,.94);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:7px 11px;font:600 12px 'IBM Plex Sans Thai';cursor:pointer}
.ctl button.on{border-color:var(--accent);color:#fff}

#nav{position:fixed;top:0;left:0;right:0;z-index:2000;display:flex;align-items:center;gap:2px;
 padding:0 8px;height:44px;background:rgba(8,11,18,.97);border-bottom:1px solid #1d2738;backdrop-filter:blur(10px);
 overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav .nb{font:700 13px 'IBM Plex Sans Thai',sans-serif;color:#eef1f7;white-space:nowrap;padding:0 10px 0 4px;flex:none}
#nav .nb b{color:#E0A93B;margin:0 1px}
#nav a{flex:none;color:#8a94a8;text-decoration:none;font:500 12.5px 'IBM Plex Sans Thai',sans-serif;
 padding:6px 11px;border-radius:7px;white-space:nowrap}
#nav a.on{color:#fff;background:#1a2336}
#nav a:active{background:#161d2c}
#themeToggle{margin-left:auto;flex:none;background:none;border:1px solid #1d2738;color:#8a94a8;
 border-radius:8px;width:32px;height:30px;cursor:pointer;font-size:14px}
/* branch-info strip drops below the nav */
#bar{top:44px;height:38px}
#map{top:82px}
#panel{top:94px;max-height:calc(100vh - 110px)}
.ctl{top:94px}

.dtt{font-family:'IBM Plex Sans Thai';font-size:11.5px;max-width:220px;line-height:1.45}
.dtt b{color:#fff}
/* LIGHT / "Paper Console" — page chrome turns light; the 3D map well stays DARK */
html[data-theme="light"] #nav{background:rgba(255,255,255,.92);border-bottom:1px solid #D3DAE6}
html[data-theme="light"] #nav .nb{color:#11151F}
html[data-theme="light"] #nav a{color:#5A6477}
html[data-theme="light"] #nav a.on{color:#11151F;background:#e7edf8}
html[data-theme="light"] #nav a:active{background:#e2e8f4}
html[data-theme="light"] #themeToggle{border-color:#D3DAE6;color:#5A6477}
html[data-theme="light"] #bar{background:rgba(255,255,255,.92);border-bottom-color:#D3DAE6}
html[data-theme="light"] #bar a{color:#5A6477}
html[data-theme="light"] #bar a:hover{color:#11151F}
html[data-theme="light"] #bar .nm{color:#11151F}
html[data-theme="light"] #panel{background:rgba(255,255,255,.95);border-color:#D3DAE6}
html[data-theme="light"] #panel h3{color:#5A6477}
html[data-theme="light"] .pr{color:#2C3444}
html[data-theme="light"] .bar{background:#e3e8f1}
html[data-theme="light"] .note{color:#828CA0}
html[data-theme="light"] #status{background:#fff;border-color:#D3DAE6;color:#5A6477}
html[data-theme="light"] .ctl button{background:rgba(255,255,255,.95);border-color:#D3DAE6;color:#2C3444}
html[data-theme="light"] .ctl button.on{border-color:var(--accent);color:#11151F}
</style>
</head>
<body>
<nav id="nav"><span class="nb">AutoX<b>·</b>เงินไชโย</span><a href="index.html#overview">Overview</a><a href="index.html#map" class="on">National</a><a href="rayong-catchment.html">Rayong 3D</a><a href="index.html#acq">Acquisition</a><a href="index.html#exposure">Exposure</a><a href="index.html#provinces">Provinces</a><a href="index.html#market">Market</a><a href="index.html#branches">Branches</a><button id="themeToggle" title="Toggle light / dark" aria-pressed="false">☾</button></nav>
<script>
(function(){var b=document.getElementById('themeToggle');if(!b)return;
 function sync(){var l=document.documentElement.dataset.theme==='light';b.textContent=l?'☀':'☾';b.setAttribute('aria-pressed',String(l));}
 sync();
 b.addEventListener('click',function(){var l=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=l?'light':'dark';try{localStorage.setItem('autox-theme',l?'light':'dark');}catch(e){}sync();});})();
</script>
<div id="bar">
  <a href="index.html#map">← National</a>
  <span class="nm" id="bnm">Branch</span><span class="sub" id="bsub"></span>
</div>
<div id="map"></div>
<div class="ctl">
  <button id="t-ring" class="on">10&nbsp;km ring</button>
  <button id="t-reload">↻ buildings here</button>
</div>
<div id="panel"></div>
<div id="status">Loading…</div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const LAT = parseFloat(Q.get('lat')), LNG = parseFloat(Q.get('lng'));
const NM  = Q.get('n') ? decodeURIComponent(Q.get('n')) : 'Branch';
const TILE = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png';
const MIRRORS = ['https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
let showRing = true, branchRec = null, buildings = [];
const tileCache = {};   // bbox-keyed building cache so panning doesn't refetch

const $ = s => document.querySelector(s);
function status(t, err){ const s=$('#status'); s.textContent=t; s.className=err?'err':''; s.style.display=t?'block':'none'; }
function fmt(n){ return (n||0).toLocaleString(); }

if(isNaN(LAT)||isNaN(LNG)){ status('No branch coordinates in the link.', true); }
$('#bnm').textContent = NM;

/* ---- geometry helpers ---- */
const D2R=Math.PI/180;
function circle(lat,lng,km,steps=64){const pts=[];const dLat=km/111;const dLng=km/(111*Math.cos(lat*D2R));
  for(let i=0;i<=steps;i++){const a=2*Math.PI*i/steps;pts.push([lng+dLng*Math.cos(a),lat+dLat*Math.sin(a)]);}return pts;}
function ringAreaM2(ring){               // approx footprint area (m²) from a lon/lat ring
  let a=0; for(let i=0,j=ring.length-1;i<ring.length;j=i++){a+=(ring[j][0]-ring[i][0])*(ring[j][1]+ring[i][1]);}
  const latm=111320, lngm=111320*Math.cos((LAT||13.5)*D2R);
  return Math.abs(a/2)*latm*lngm;
}
function bldgHeight(tags,fa){            // measured tag if present, else estimate by type + footprint
  tags=tags||{};
  if(tags.height){const h=parseFloat(tags.height); if(h>0)return Math.min(h,60);}
  if(tags['building:levels']){const l=parseFloat(tags['building:levels']); if(l>0)return Math.min(l*3.2,60);}
  const b=tags.building||'yes', L=Math.log2(Math.max(fa||60,30));
  if(b==='house')return 6;
  if(/residential|apartments/.test(b))return Math.max(12,Math.min(45,14+L*2));
  if(/retail|commercial|shop/.test(b))return 8;
  if(b==='office')return 24;
  if(/industrial|warehouse/.test(b))return 11;
  if(b==='school')return 9;
  if(b==='hotel')return Math.max(14,Math.min(45,18+L*2));
  if(b==='roof')return 4;
  return fa<120?6:fa<400?9:fa<800?11:13;
}
function heightColor(h){                  // 3-stop ramp: low slate -> accent -> gold
  const t=Math.pow(Math.max(0,Math.min(1,h/40)),1.1), a=[43,58,85],b=[91,124,250],c=[224,169,59];
  const m=t<.5?a.map((v,i)=>Math.round(v+(b[i]-v)*t*2)):b.map((v,i)=>Math.round(v+(c[i]-v)*(t-.5)*2));
  return [m[0],m[1],m[2],232];
}

/* ---- deck.gl ---- */
const INITIAL={longitude:LNG||101, latitude:LAT||13.5, zoom:15.2, pitch:58, bearing:-12, maxZoom:19, minZoom:9};
let deckgl;
// directional sun + ambient + fill, with shadows on desktop (the DataProteins look)
let LIGHTING=null;
try{
  if(deck.LightingEffect && deck.AmbientLight && deck.DirectionalLight){
    const useShadow=!/Mobi|Android/i.test(navigator.userAgent) && window.innerWidth>900;
    LIGHTING=new deck.LightingEffect({
      ambient:new deck.AmbientLight({color:[255,255,255],intensity:1.0}),
      sun:new deck.DirectionalLight({color:[255,245,225],intensity:3.0,direction:[-1,-3,-1],_shadow:useShadow}),
      fill:new deck.DirectionalLight({color:[200,215,255],intensity:0.6,direction:[1,1,-0.5]})});
    LIGHTING.shadowColor=[0,0,0,0.50];
  }
}catch(e){ LIGHTING=null; }
function baseLayer(){
  return new deck.TileLayer({id:'base',data:TILE,minZoom:0,maxZoom:19,tileSize:256,
    renderSubLayers:p=>{const{west,south,east,north}=p.tile.bbox;
      return new deck.BitmapLayer(p,{data:null,image:p.data,bounds:[west,south,east,north]});}});
}
function layers(){
  const L=[baseLayer()];
  L.push(new deck.PolygonLayer({id:'bldg',data:buildings,extruded:true,wireframe:false,
    getPolygon:b=>b.p,getElevation:b=>b.h,
    getFillColor:b=>heightColor(b.h),
    stroked:true,getLineColor:[45,60,90,170],getLineWidth:1.6,lineWidthMinPixels:0.6,
    material:{ambient:0.35,diffuse:0.85,shininess:22,specularColor:[70,80,110]},
    parameters:{depthTest:true},transitions:{getElevation:600},
    _shadow:true,pickable:true}));
  if(showRing && !isNaN(LAT)){
    L.push(new deck.PolygonLayer({id:'rings',data:[[10,'#5B7CFA'],[5,'#1C8C7D'],[3,'#E6B450']].map(([km,c])=>({km,c,poly:circle(LAT,LNG,km)})),
      getPolygon:d=>d.poly,extruded:false,stroked:true,filled:false,
      getLineColor:d=>{const h=d.c;return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),180];},
      getLineWidth:18,lineWidthMinPixels:1.2}));
  }
  if(!isNaN(LAT)){
    L.push(new deck.ScatterplotLayer({id:'branch',data:[{x:LNG,y:LAT}],getPosition:d=>[d.x,d.y],
      getRadius:90,radiusMinPixels:6,radiusMaxPixels:13,getFillColor:[224,169,59,255],
      stroked:true,getLineColor:[255,255,255,230],lineWidthMinPixels:2}));
  }
  return L;
}
function render(){ if(deckgl) deckgl.setProps({layers:layers()}); }

/* ---- live OSM building fetch ---- */
function viewBounds(){
  try{ const vp=new deck.WebMercatorViewport(deckgl.viewManager._viewports[0]||INITIAL); return vp.getBounds(); }
  catch(e){ const d=0.012; return [LNG-d,LAT-d,LNG+d,LAT+d]; }
}
async function overpass(q){
  for(const ep of MIRRORS){
    try{
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),
        headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      if(r.ok) return await r.json();
    }catch(e){/* try next mirror */}
  }
  throw new Error('all Overpass mirrors failed');
}
async function loadBuildings(){
  if(isNaN(LAT)) return;
  const b=viewBounds();              // [W,S,E,N]
  const W=b[0],S=b[1],E=b[2],N=b[3];
  // guard: only fetch when the box is small enough to be sane (≈ <6km across)
  if((N-S)>0.08 || (E-W)>0.08){ status('Zoom in to load buildings (area too large)'); return; }
  const ckey=[W,S,E,N].map(v=>v.toFixed(3)).join(',');     // bbox cache so panning doesn't refetch
  if(tileCache[ckey]){ buildings=tileCache[ckey]; render(); status(`${fmt(buildings.length)} buildings in view`); return; }
  status('Loading buildings…');
  const q=`[out:json][timeout:25];(way["building"](${S},${W},${N},${E}););out body geom 7000;`;
  try{
    const d=await overpass(q);
    const out=[];
    for(const el of (d.elements||[])){
      if(el.type==='way' && el.geometry && el.geometry.length>2){
        const ring=el.geometry.map(g=>[g.lon,g.lat]);
        const fa=ringAreaM2(ring);
        let h=bldgHeight(el.tags,fa);
        const seed=Math.abs(Math.sin(ring[0][0]*12.9898+ring[0][1]*78.233))%1;   // deterministic ±8% jitter
        h=Math.min(60,h*(0.92+0.16*seed));
        out.push({p:ring,h,fa});
      }
    }
    buildings=out; tileCache[ckey]=out; render();
    status(out.length?`${fmt(out.length)} buildings · heights estimated from type + footprint`:'No OSM buildings here (rural/factory zone)');
  }catch(e){
    status('Could not load buildings (Overpass blocked?). '+e.message, true);
  }
}

/* ---- branch radar panel (from branches.json) ---- */
function barHTML(v,col,mx){return `<span class="bar"><i style="width:${Math.round(54*Math.min(v||0,mx)/mx)}px;background:${col}"></i></span>`;}
async function loadPanel(){
  try{
    const data=await fetch('data/branches.json').then(r=>r.json());
    // nearest branch to the given coords
    let best=null,bd=1e9;
    for(const d of data){const dd=(d.y-LAT)**2+(d.x-LNG)**2; if(dd<bd){bd=dd;best=d;}}
    branchRec=best;
    if(!best){ $('#panel').innerHTML='<div class="note">Branch data unavailable.</div>'; return; }
    $('#bsub').textContent = `${best.v}${best.d?' · '+best.d:''} · ${best.r}`;
    const k=best.k10||{};
    const radar=[
      ['Factories (OSM)',k.ind,60,'#E6B450'],['Vehicle/moto shops',k.veh,40,'#7A4FE0'],
      ['Gold shops',k.gold,15,'#7A4FE0'],['Banks',k.bank,40,'#5B7CFA'],['ATMs',k.atm,60,'#5B7CFA'],
      ['Convenience',k.cvs,80,'#1C8C7D'],['Fresh markets',k.fmkt,15,'#1C8C7D'],['Restaurants',k.rest,80,'#1C8C7D'],
      ['Schools',k.sch,40,'#8b90a7'],['Hospitals/gov',k.civic,30,'#8b90a7'],
    ];
    const rr=([lab,v,mx,c])=>`<div class="pr"><span>${lab}</span>${barHTML(v,c,mx)}<b style="color:${c}">${v||0}</b></div>`;
    const sc=(lab,v,c)=>`<div class="pr"><span>${lab}</span><b style="color:${c}">${v}</b></div>`;
    $('#panel').innerHTML =
      `<h3>${best.n}</h3>
       <div class="pr"><span>Province · district</span><b>${best.v}${best.d?' · '+best.d:''}</b></div>
       <div class="pr"><span>AutoX ≤10km</span><b>${best.w}</b></div>
       <h3>District workforce (DIW · measured)</h3>
       ${sc('Factories',fmt(best.dfac),'#E6B450')}${sc('Factory workers',fmt(best.dwork),'#E6B450')}
       <h3>Within 10 km (OSM · measured)</h3>${radar.map(rr).join('')}
       <div class="note">3D buildings = live OpenStreetMap footprints (measured). Building heights are estimated from type + footprint area (OSM rarely tags height in Thailand). Rings = 3 / 5 / 10 km. Within-10km counts measured (OSM); district factories/workers measured (DIW).</div>`;
  }catch(e){ $('#panel').innerHTML='<div class="note">Branch data unavailable ('+e.message+')</div>'; }
}

/* ---- init ---- */
function init(){
  deckgl=new deck.DeckGL({container:'map',mapStyle:null,initialViewState:INITIAL,
    controller:{inertia:300,dragRotate:true}, effects:LIGHTING?[LIGHTING]:[],
    layers:layers(),
    getTooltip:({object,layer})=>{
      if(!object)return null;
      if(layer&&layer.id==='bldg')return {html:`<div class="dtt"><b>${object.h.toFixed(1)}m</b><br>~${Math.round(object.fa)} m² · est. from footprint</div>`};
      return null;},
    onViewStateChange:()=>{ clearTimeout(window._t); window._t=setTimeout(loadBuildings,650); }});
  $('#t-ring').onclick=()=>{ showRing=!showRing; $('#t-ring').classList.toggle('on',showRing); render(); };
  $('#t-reload').onclick=loadBuildings;
  loadPanel(); loadBuildings();
}
init();
</script>
</body>
</html>
