<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--ink);color:var(--txt)}
#map{position:fixed;inset:0;top:44px;background:transparent;z-index:1}

/* ---- CINEMATIC DEPTH (ported from rayong-catchment) — visual chrome around the GL canvas ----
   #sky : a fixed sky/horizon gradient BEHIND the deck.gl canvas (z below #map) so the extruded OSM
          buildings read against an atmosphere instead of flat ink. Indigo-console tuned.
   #vignette : a radial darkening over the map well (above the canvas, pointer-events:none) that
          frames the branch and fades the corners — the classic cinematic "look here" vignette.
   Both are pinned to the map region (below the nav + branch bar) so they don't tint the chrome. */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(125% 95% at 50% 4%,#202a44 0%,#161d31 34%,#0e1322 62%,#080b14 100%),
            linear-gradient(180deg,#0b1020 0%,#121a2e 44%,#202b46 74%,#2c3450 100%);
 background-blend-mode:screen,normal}
#vignette{position:fixed;inset:0;top:82px;z-index:7;pointer-events:none;
 background:radial-gradient(132% 108% at 50% 47%,rgba(0,0,0,0) 50%,rgba(6,9,16,.28) 79%,rgba(4,6,12,.60) 100%)}
html[data-theme="light"] #sky{
 background:radial-gradient(125% 95% at 50% 4%,#e3edfc 0%,#d2e0f5 40%,#bed1ed 68%,#aec2e4 100%),
            linear-gradient(180deg,#e8effb 0%,#d8e4f6 60%,#c6d6ee 100%);
 background-blend-mode:multiply,normal}
html[data-theme="light"] #vignette{
 background:radial-gradient(132% 108% at 50% 47%,rgba(0,0,0,0) 56%,rgba(40,52,80,.09) 82%,rgba(30,40,66,.20) 100%)}
#bar{position:fixed;top:0;left:0;right:0;height:44px;z-index:50;display:flex;align-items:center;gap:12px;
 padding:0 14px;background:rgba(8,11,18,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
#bar a{color:var(--mid);text-decoration:none;font:600 13px 'IBM Plex Sans Thai'}

#bar .sub{font:500 12px 'IBM Plex Sans Thai';color:var(--dim)}
#panel{position:fixed;top:56px;left:12px;width:268px;max-height:calc(100vh - 72px);overflow:auto;z-index:40;
 background:rgba(14,19,31,.94);border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(8px)}
#panel h3{font:700 12px 'IBM Plex Sans Thai';color:var(--mid);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
#panel h3:first-child{margin-top:0}
.pr{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;color:var(--txt)}

 background:rgba(14,19,31,.95);border:1px solid var(--line);border-radius:20px;padding:8px 15px;font:500 12px 'IBM Plex Sans Thai';color:var(--mid);
 backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:min(92vw,520px)}
#status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mid);flex:none}
/* calm "info" state for graceful degradation (e.g. building footprints unavailable) — amber, never red/raw */

 b.addEventListener('click',function(){var l=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=l?'light':'dark';try{localStorage.setItem('autox-theme',l?'light':'dark');}catch(e){}sync();});})();

<script>
'use strict';
const Q = new URLSearchParams(location.search);
const LAT = parseFloat(Q.get('lat')), LNG = parseFloat(Q.get('lng'));
const NM  = Q.get('n') ? decodeURIComponent(Q.get('n')) : 'Branch';
// Basemap rasters: light (CARTO Positron, the DataProteins white base + DEFAULT) + voyager + dark, all CARTO.
const TILE_SRC={light:'https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png',
                voyager:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
                dark:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'};
let basemap='light';
function lightMode(){return basemap==='light';}
const MIRRORS = ['https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
let showRing = true, branchRec = null, buildings = [];
let provRec = null;     // matched province row (informal/formal), if derivable
const tileCache = {};   // bbox-keyed building cache so panning doesn't refetch
const poiTileCache = {};// bbox-keyed POI cache
let pois = [];          // live OSM POIs in view, {x,y,t} — empty when Overpass blocked

/* ---- shared palette / groupings (same source-of-truth as rayong-catchment) ---- */
const POI_COLORS={
  vehicle_commerce:[28,140,125], gold:[230,180,80], bank:[91,124,250], convenience:[224,123,47],
  fresh_market:[224,144,47], supermarket:[224,144,47], industrial:[123,138,166],
  pharmacy:[200,67,59], restaurant:[133,144,166], hotel:[214,90,160], school:[122,79,224]};
const POI_LABEL={vehicle_commerce:'Vehicle shop',gold:'Gold dealer',bank:'Bank / ATM',convenience:'Convenience',
  fresh_market:'Fresh market',supermarket:'Supermarket',industrial:'Industrial',pharmacy:'Pharmacy',
  restaurant:'Restaurant',hotel:'Hotel',school:'School'};
// k10 key -> POI palette key (for swatch colour parity with the live markers)
const K10_COL={veh:'vehicle_commerce',gold:'gold',bank:'bank',atm:'bank',fmkt:'fresh_market',
  super:'supermarket',cvs:'convenience',rest:'restaurant',ind:'industrial',hotel:'hotel',
  sch:'school',pharm:'pharmacy',civic:'school'};
// "Within 10km" — three lender-oriented groups; every count is k10 (measured OSM).
const K10_GROUPS=[
  ['Collateral & finance',[['veh','Auto / vehicle shops'],['gold','Gold dealers'],[['bank','atm'],'Banks + ATMs','bank']]],
  ['Commerce & retail',[['fmkt','Fresh markets'],['super','Supermarkets'],['cvs','Convenience'],['rest','Restaurants']]],
  ['Industry & services',[['ind','Factories'],['hotel','Hotels'],['sch','Schools'],['pharm','Pharmacies']]],
];
// establishment-mix -> occupation proxy (ESTIMATED), same mapping as rayong-catchment
const OCC=[
  ['Factory / production',['ind'],'industrial'],
  ['Market vendors & retail',['fmkt','super','cvs'],'fresh_market'],
  ['Auto trade & mechanics',['veh'],'vehicle_commerce'],
  ['Food service',['rest'],'restaurant'],
  ['Hospitality / tourism',['hotel'],'hotel'],
  ['Gold / pawn & finance',['gold','bank'],'gold'],
  ['Education',['sch'],'school'],
  ['Healthcare',['pharm'],'pharmacy'],
  ['Public sector',['civic'],'school'],
];
// MEASURED occupation mix (Overture Places) — lazy-loaded, optional. branch_occupations.json
// is INDEX-ALIGNED to branches.json; built by pipeline/build_occupations.py once
// pull_overture_places.py has been run. Absent = panel falls back to the OSM estimate below.
let OCCDATA=null, occDataTried=false;
async function loadOccupations(){
  if(occDataTried) return OCCDATA;
  occDataTried=true;
  try{ const r=await fetch('data/branch_occupations.json'); if(r.ok) OCCDATA=await r.json(); }
  catch(e){ OCCDATA=null; }
  return OCCDATA;
}
// operator-hosted Overture building tiles (platform/data/tiles_config.json). When configured, the
// per-branch scene streams REAL footprints across the whole 10km catchment instead of the live
// Overpass pull alone. Null/absent => unchanged behaviour (Overpass buildings). NO fabricated data.
let TILECFG=null, tileCfgTried=false;
async function loadTilesConfig(){
  if(tileCfgTried) return TILECFG;
  tileCfgTried=true;
  try{ const r=await fetch('data/tiles_config.json'); if(r.ok) TILECFG=await r.json(); }
  catch(e){ TILECFG=null; }
  return TILECFG;
}
// MVTLayer of streamed buildings, styled to match (lighting-capped material -> no white blow-out).
// Returns null unless an mvtUrl is configured and the bundle has MVTLayer -> graceful fallback.
function streamBuildingLayer(){
  try{
    var cfg=(TILECFG&&TILECFG.buildings)||null;
    if(!cfg||!deck.MVTLayer)return null;
    var url=cfg.mvtUrl||null;            // native {z}/{x}/{y}.pbf path (PMTiles shim is a follow-up)
    if(!url)return null;
    var LIGHT=lightMode();
    var clamp=function(v){return Math.max(0,Math.min(255,Math.round(v)));};
    var RAMP=LIGHT?[[201,186,158],[214,168,100],[226,186,92]]
                  :[[58,52,46],[150,104,52],[228,172,78]];
    var rampAt=function(t){var seg=t<.5?0:1, lt=t<.5?t*2:(t-.5)*2;var a=RAMP[seg],b2=RAMP[seg+1];
      return [a[0]+(b2[0]-a[0])*lt,a[1]+(b2[1]-a[1])*lt,a[2]+(b2[2]-a[2])*lt];};
    var hOf=function(f){var p=(f&&f.properties)||{};var h=+(p.height||p.h||p.render_height||0);
      if(!isFinite(h)||h<=0)h=p.levels?(+p.levels*3):(p.num_floors?(+p.num_floors*3):4);
      return h>0?h:4;};
    return new deck.MVTLayer({
      id:'stream-bldg', data:url,
      minZoom:cfg.minZoom||9, maxZoom:cfg.maxZoom||15,
      extruded:true, filled:true, stroked:true, wireframe:false,
      getElevation:function(f){var h=hOf(f);return h*(h<10?1.5:h<22?2.1:2.8);},
      getFillColor:function(f){var h=hOf(f);var t=(h-3)/32;t=t<0?0:t>1?1:t;
        var m=rampAt(t);return [clamp(m[0]),clamp(m[1]),clamp(m[2]),LIGHT?214:236];},
      getLineColor:LIGHT?[196,176,140,120]:[28,22,14,210], lineWidthMinPixels:0.4,
      material:{ambient:0.5,diffuse:0.34,shininess:10,specularColor:[48,42,30]},
      shadowEnabled:SHADOWS_ON, parameters:{depthTest:true}, pickable:false,
      updateTriggers:{getFillColor:[LIGHT],getLineColor:[LIGHT]}
    });
  }catch(e){ try{console.warn('[stream-bldg] disabled:',e&&e.message);}catch(_){} return null; }
}
// stable colour per occupation bucket key (parity with the platform palette where sensible)
const OCC_BUCKET_COL={factory:[122,79,224],auto:[122,79,224],retail:[28,140,125],food:[230,180,80],
  hospitality:[230,180,80],finance:[200,67,59],health:[91,124,250],education:[91,124,250],
  public:[138,148,168],professional:[91,124,250],agriculture:[200,67,59],personal:[28,140,125],
  logistics:[138,148,168],construction:[230,180,80]};
function rgb(c){return `rgb(${c[0]},${c[1]},${c[2]})`;}
function poiColumnHeight(t){ // visible 3D column heights for the live markers (metres)
  if(t==='industrial')return 90; if(t==='hotel')return 75; if(/gold|bank/.test(t))return 60;
  if(/super|fresh_market/.test(t))return 45; return 38; }

const $ = s => document.querySelector(s);
// status chip: kind = '' (calm/neutral) | 'info' (graceful degradation, amber) | 'err' (hard error, red).
// Backward-compatible: a truthy 2nd arg still maps to the red 'err' state.
function status(t, kind){ const s=$('#status'); if(!s)return;
  const k=(kind===true)?'err':(kind||'');
  s.textContent=t; s.className=k; s.style.display=t?'flex':'none'; }
function fmt(n){ return (n||0).toLocaleString(); }

if(isNaN(LAT)||isNaN(LNG)){ status('No branch coordinates in the link.', true); }
$('#bnm').textContent = NM;

/* ---- geometry helpers ---- */
const D2R=Math.PI/180;
function circle(lat,lng,km,steps=64){const pts=[];const dLat=km/111;const dLng=km/(111*Math.cos(lat*D2R));
  for(let i=0;i<=steps;i++){const a=2*Math.PI*i/steps;pts.push([lng+dLng*Math.cos(a),lat+dLat*Math.sin(a)]);}return pts;}
function ringAreaM2(ring){               // approx footprint area (m²) from a lon/lat ring
  let a=0; for(let i=0,j=ring.length-1;i<ring.length;j=i++){a+=(ring[j][0]-ring[i][0])*(ring[j][1]+ring[i][1]);}
  const latm=111320, lngm=111320*Math.cos((LAT||13.5)*D2R);
  return Math.abs(a/2)*latm*lngm;
}
function bldgHeight(tags,fa){            // measured tag if present, else estimate by type + footprint
  tags=tags||{};
  if(tags.height){const h=parseFloat(tags.height); if(h>0)return Math.min(h,60);}
  if(tags['building:levels']){const l=parseFloat(tags['building:levels']); if(l>0)return Math.min(l*3.2,60);}
  const b=tags.building||'yes', L=Math.log2(Math.max(fa||60,30));
  if(b==='house')return 6;
  if(/residential|apartments/.test(b))return Math.max(12,Math.min(45,14+L*2));
  if(/retail|commercial|shop/.test(b))return 8;
  if(b==='office')return 24;
  if(/industrial|warehouse/.test(b))return 11;
  if(b==='school')return 9;
  if(b==='hotel')return Math.max(14,Math.min(45,18+L*2));
  if(b==='roof')return 4;
  return fa<120?6:fa<400?9:fa<800?11:13;
}
function heightColor(h){                  // 3-stop ramp: low slate -> accent -> gold (dark/voyager base)
  const t=Math.pow(Math.max(0,Math.min(1,h/40)),1.1), a=[43,58,85],b=[91,124,250],c=[224,169,59];
  const m=t<.5?a.map((v,i)=>Math.round(v+(b[i]-v)*t*2)):b.map((v,i)=>Math.round(v+(c[i]-v)*(t-.5)*2));
  return [m[0],m[1],m[2],232];
}
// DataProteins light path: muted light-grey context buildings, with the tallest decile lifted toward the
// collateral-purple crown so the few tall structures still read against the white Positron base.
const PURP=[122,79,224], GREY=[206,210,218];
function heightColorLight(h){
  const t=Math.max(0,Math.min(1,h/40));
  if(t>=0.62){const lift=t*40;const cl=v=>Math.max(0,Math.min(255,Math.round(v)));
    return [cl(PURP[0]+lift*0.2),cl(PURP[1]+lift*0.3),cl(PURP[2]+lift*0.1),238];}
  // low/mid rise = muted grey, slightly translucent so the white base breathes through
  const j=Math.round((t-0.3)*10);
  const cl=v=>Math.max(0,Math.min(255,Math.round(v)));
  return [cl(GREY[0]+j),cl(GREY[1]+j),cl(GREY[2]+j),182];
}

/* ---- deck.gl ---- */
const INITIAL={longitude:LNG||101, latitude:LAT||13.5, zoom:15.2, pitch:58, bearing:-12, maxZoom:19, minZoom:9};
let deckgl;
// ---- CINEMATIC LIGHTING (ported from rayong-catchment) -----------------------------------------
// A real sun that CASTS SHADOWS so the extruded OSM skyline reads as a grounded, dimensional city.
// deck.gl 8.9.35 enables shadow maps when a DirectionalLight carries _shadow:true and the
// LightingEffect.shadowColor is set; SolidPolygon/Column layers opt in via shadowEnabled. The sun is
// angled low (long, readable shadows) and warm; a cool fill keeps shadowed faces from going black.
//
// GRACEFUL DEGRADE: every constructor is feature-detected; if the bundle lacks shadow support the
// try/catch leaves LIGHTING usable without shadows, and SHADOWS_ON gates the per-layer flags.
//
// SOFTWARE-WEBGL SAFETY: shadow maps are an extra render pass per frame — cheap on a GPU, but under
// SOFTWARE WebGL (swiftshader/llvmpipe — headless CI, old machines) so slow the scene never settles.
// So shadows are on by default but AUTO-DISABLED at runtime if onWebGLInitialized detects a software
// renderer (see init). The warm material + directional shading + sky/vignette still give depth then.
function buildLighting(withShadow){
  try{ if(!(deck.LightingEffect && deck.AmbientLight && deck.DirectionalLight))return null;
    // Intensities kept LOW on purpose: ambient + diffuse*(sun+fill) must stay below ~1.0 or light
    // building colours clamp to pure white on a real GPU (the "white blow-out"). With the building
    // material ambient 0.5 / diffuse 0.34 below: max lit ≈ 0.5*0.9 + 0.34*(0.85+0.25) ≈ 0.83 -> safe.
    const sun=new deck.DirectionalLight({color:[255,243,222],intensity:0.85,direction:[-0.7,-2.2,-1.0],_shadow:!!withShadow});
    const fill=new deck.DirectionalLight({color:[176,198,248],intensity:0.25,direction:[0.9,0.6,-0.4]});
    const amb=new deck.AmbientLight({color:[232,238,255],intensity:0.9});
    const eff=new deck.LightingEffect({ambient:amb,sun:sun,fill:fill});
    if(withShadow){ try{ eff.shadowColor=[10,16,34,0.46]; }catch(e){} }
    return eff;
  }catch(e){ return null; }
}
let SHADOWS_ON=true;
let LIGHTING=buildLighting(true);
if(!LIGHTING){ SHADOWS_ON=false; LIGHTING=buildLighting(false); }

// down on load. Building/POI re-fetches still fire on user view changes (debounced, as before).

function detectSoftwareGL(gl){
  try{ if(!gl)return false;
    let r='';
    try{ const ext=gl.getExtension&&gl.getExtension('WEBGL_debug_renderer_info');
      if(ext)r=gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||''; }catch(e){}
    if(!r){ try{ r=gl.getParameter(gl.RENDERER)||''; }catch(e){} }
    return /swiftshader|llvmpipe|software|angle \(google, vulkan|microsoft basic|mesa offscreen/i.test(String(r));
  }catch(e){ return false; }
}
function downgradeForSoftwareGL(){
  SOFT_GL=true; orbitOn=false; introDone=true; try{setOrbitUI(false);}catch(e){}
  if(SHADOWS_ON){ SHADOWS_ON=false; const ns=buildLighting(false);
    try{ deckgl.setProps({effects:ns?[ns]:[]}); }catch(e){} }
  try{ render(); }catch(e){}
  try{ console.info('[branch-explorer] software WebGL detected — shadows + auto-orbit disabled; depth via material + sky/vignette.'); }catch(e){}
}

    renderSubLayers:p=>{const{west,south,east,north}=p.tile.bbox;
      return new deck.BitmapLayer(p,{data:null,image:p.data,bounds:[west,south,east,north]});}});

      stroked:LIGHT,getLineColor:p=>{const c=POI_COLORS[p.t]||[138,148,168];return [Math.round(c[0]*.5),Math.round(c[1]*.5),Math.round(c[2]*.5),255];},lineWidthMinPixels:0.6,
      material:{ambient:0.45,diffuse:0.8,shininess:30,specularColor:[80,90,120]},
      shadowEnabled:SHADOWS_ON,

  if(showRing && !isNaN(LAT)){
    L.push(new deck.PolygonLayer({id:'rings',data:[[10,'#5B7CFA'],[5,'#1C8C7D'],[3,'#E6B450']].map(([km,c])=>({km,c,poly:circle(LAT,LNG,km)})),
      getPolygon:d=>d.poly,extruded:false,stroked:true,filled:false,

    [[1.6,LIGHT?22:16],[1.0,LIGHT?30:24],[0.5,LIGHT?40:34]].forEach(([km,a],i)=>{
      L.push(new deck.PolygonLayer({id:'branch-glow'+i,data:[{lat:LAT,lng:LNG}],

    L.push(new deck.ScatterplotLayer({id:'branch',data:[{x:LNG,y:LAT}],getPosition:d=>[d.x,d.y],
      getRadius:90,radiusMinPixels:6,radiusMaxPixels:13,getFillColor:[224,169,59,255],
      stroked:true,getLineColor:LIGHT?[40,28,8,255]:[255,255,255,230],lineWidthMinPixels:2,
      updateTriggers:{getLineColor:[LIGHT]}}));

        getText:d=>'◉ '+d.n,getSize:12.5,getColor:[40,28,8,255],getBackgroundColor:[255,255,255,250],

}

/* ---- live OSM building fetch ---- */
function viewBounds(){
  try{ const vp=new deck.WebMercatorViewport(deckgl.viewManager._viewports[0]||INITIAL); return vp.getBounds(); }
  catch(e){ const d=0.012; return [LNG-d,LAT-d,LNG+d,LAT+d]; }
}
async function overpass(q){
  for(const ep of MIRRORS){
    try{
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),
        headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      if(r.ok) return await r.json();
    }catch(e){/* try next mirror */}
  }
  throw new Error('all Overpass mirrors failed');
}
async function loadBuildings(){
  if(isNaN(LAT)) return;
  const b=viewBounds();              // [W,S,E,N]
  const W=b[0],S=b[1],E=b[2],N=b[3];
  // guard: only fetch when the box is small enough to be sane (≈ <6km across)
  if((N-S)>0.08 || (E-W)>0.08){ status('Zoom in to load buildings (area too large)'); return; }
  const ckey=[W,S,E,N].map(v=>v.toFixed(3)).join(',');     // bbox cache so panning doesn't refetch
  if(tileCache[ckey]){ buildings=tileCache[ckey]; render(); status(`${fmt(buildings.length)} buildings in view`); return; }
  status('Loading buildings…');
  const q=`[out:json][timeout:25];(way["building"](${S},${W},${N},${E}););out body geom 7000;`;
  try{
    const d=await overpass(q);
    const out=[];
    for(const el of (d.elements||[])){
      if(el.type==='way' && el.geometry && el.geometry.length>2){
        const ring=el.geometry.map(g=>[g.lon,g.lat]);
        const fa=ringAreaM2(ring);
        let h=bldgHeight(el.tags,fa);
        const seed=Math.abs(Math.sin(ring[0][0]*12.9898+ring[0][1]*78.233))%1;   // deterministic ±8% jitter
        h=Math.min(60,h*(0.92+0.16*seed));
        out.push({p:ring,h,fa});
      }
    }
    buildings=out; tileCache[ckey]=out; render();
    if(out.length){
      // success: show the count briefly, then clear so no chip lingers over the scene.
      status(`${fmt(out.length)} buildings · heights estimated from type + footprint`);
      clearTimeout(window._statusT); window._statusT=setTimeout(()=>status(''),3200);
    }else{
      status('No OSM buildings mapped here (rural / factory zone)', 'info');
    }
  }catch(e){
    // GRACEFUL: building footprints couldn't be fetched (Overpass blocked / offline). The rest of the
    // scene (10km rings, branch pin, POI columns) is still drawn — never a raw error, never a blank page.
    console.warn('buildings unavailable:', e&&e.message||e);
    render();
    status('Building footprints unavailable — showing branch + POI layer', 'info');
  }
}

/* ---- live OSM POI fetch (graceful: blocked Overpass -> pois stays []) ---- */
// classify an OSM element's tags into one of our POI_COLORS keys, else null (skip)
function poiType(t){
  if(!t)return null;
  if(t.shop==='car_repair'||t.shop==='car'||t.shop==='motorcycle'||t.shop==='tyres')return 'vehicle_commerce';
  if(t.shop==='gold'||t.shop==='jewelry'||t.craft==='goldsmith')return 'gold';
  if(t.amenity==='bank'||t.amenity==='atm'||t.office==='financial')return 'bank';
  if(t.shop==='convenience')return 'convenience';
  if(t.amenity==='marketplace'||t.shop==='greengrocer')return 'fresh_market';
  if(t.shop==='supermarket'||t.shop==='department_store'||t.shop==='mall')return 'supermarket';
  if(t.man_made==='works'||t.building==='industrial'||t.landuse==='industrial'||t.industrial)return 'industrial';
  if(t.amenity==='pharmacy'||t.shop==='chemist')return 'pharmacy';
  if(t.amenity==='restaurant'||t.amenity==='fast_food'||t.amenity==='cafe')return 'restaurant';
  if(t.tourism==='hotel'||t.tourism==='motel'||t.tourism==='guest_house')return 'hotel';
  if(t.amenity==='school'||t.amenity==='college'||t.amenity==='university')return 'school';
  return null;
}
async function loadPOIs(){
  if(isNaN(LAT)) return;
  const b=viewBounds(); const W=b[0],S=b[1],E=b[2],N=b[3];
  if((N-S)>0.08 || (E-W)>0.08){ return; }     // same area guard as buildings
  const ckey=[W,S,E,N].map(v=>v.toFixed(3)).join(',');
  if(poiTileCache[ckey]){ pois=poiTileCache[ckey]; render(); return; }
  const q=`[out:json][timeout:25];(`
    +`nwr["shop"~"car_repair|car|motorcycle|tyres|gold|jewelry|convenience|supermarket|department_store|mall|greengrocer|chemist"](${S},${W},${N},${E});`
    +`nwr["amenity"~"bank|atm|marketplace|pharmacy|restaurant|fast_food|cafe|school|college|university"](${S},${W},${N},${E});`
    +`nwr["tourism"~"hotel|motel|guest_house"](${S},${W},${N},${E});`
    +`);out center 4000;`;
  try{
    const d=await overpass(q);
    const out=[];
    for(const el of (d.elements||[])){
      const t=poiType(el.tags||{}); if(!t)continue;
      const x=el.lon!=null?el.lon:(el.center&&el.center.lon), y=el.lat!=null?el.lat:(el.center&&el.center.lat);
      if(x==null||y==null)continue;
      out.push({x,y,t});
    }
    pois=out; poiTileCache[ckey]=out; render();
  }catch(e){ /* Overpass blocked: leave pois=[]; scene still draws buildings/rings/branch */ }
}

// match the focal branch's province row in provinces/index.json for informal/formal (measured · NSO)
async function matchProvince(prov){
  if(!prov) return null;
  try{
    const idx=await fetch('data/provinces/index.json').then(r=>r.json());
    return idx.find(p=>p.th===prov || p.en===prov) || null;
  }catch(e){ return null; }
}
async function loadPanel(){
  try{
    const data=await fetch('data/branches.json').then(r=>r.json());
    // focal branch: ?n name match wins, else nearest to lat/lng (x=lng, y=lat)
    let best=null;
    if(NM && NM!=='Branch'){ best=data.find(d=>d.n===NM) || null; }
    if(!best){ let bd=1e9; for(const d of data){const dd=(d.y-LAT)**2+(d.x-LNG)**2; if(dd<bd){bd=dd;best=d;}} }
    branchRec=best;
    if(!best){ $('#panel').innerHTML='<div class="note">Branch data unavailable.</div>'; return; }
    // re-centre on the matched branch so the scene and panel agree. Use the controlled VIEW so the
    // orbit/intro machinery stays the single source of truth.
    if(deckgl && !isNaN(best.x) && !isNaN(best.y)){
      // retarget the cinematic frames so the intro fly-in / orbit centre on the matched branch.
      FRAMED.longitude=best.x; FRAMED.latitude=best.y; INTRO.longitude=best.x; INTRO.latitude=best.y;
      if(!introDone && !SOFT_GL){
        // intro still in flight — just re-aim it at the branch (the rAF intro reads FRAMED below).
        _programmatic=true;

        try{ if(deck.FlyToInterpolator){tp.viewState.transitionInterpolator=new deck.FlyToInterpolator({speed:1.2});} }catch(e){}
        VIEW=Object.assign({},FRAMED);
        deckgl.setProps(tp);
        setTimeout(()=>{ _programmatic=false; lastT=0; },1240);
      }else{
        VIEW=Object.assign({},VIEW,{longitude:best.x,latitude:best.y}); pushView();

    }

    const k=best.k10||{};
    provRec=await matchProvince(best.v);

    // (1) Within 10km — grouped, every count measured OSM (k10)

       <div class="pr"><span>Province · district</span><b>${best.v}${best.d?' · '+best.d:''}</b></div>
       <div class="pr"><span>AutoX ≤10km</span><b>${best.w}</b></div>
       <h3>District workforce (DIW · measured)</h3>
       <div class="pr"><span>Factories</span><b style="color:#E6B450">${fmt(best.dfac)}</b></div>
       <div class="pr"><span>Factory workers</span><b style="color:#E6B450">${fmt(best.dwork)}</b></div>
       <h3>Within 10 km of ${best.n} <span class="tag meas">measured · OSM</span></h3>
       ${k10html}
       <div class="note">Establishments mapped in OpenStreetMap within 10 km of this branch — measured, not estimated.</div>
       <h3>Who works nearby</h3>
       ${workhtml}
       <div class="note">${measuredOcc?'Occupation mix is a MEASURED count of establishments within 10 km by category (Overture Maps Places — a sample/lower bound, not a registry) — what kind of work surrounds the branch, not a headcount.':'Occupation mix is a proxy from the 10 km establishment mix (OSM) — who works locally, not a headcount. Run pull_overture_places.py + build_occupations.py to replace it with measured Overture counts.'} Informal/formal split is province-level (NSO, measured). 3D buildings + coloured POI columns = live OpenStreetMap (measured) when reachable; building heights estimated from type + footprint. Rings = 3 / 5 / 10 km.</div>`;
  }catch(e){ $('#panel').innerHTML='<div class="note">Branch data unavailable ('+e.message+')</div>'; }
}

/* ---- init ---- */
function init(){
  // best-effort: if operator building tiles are configured, load them then re-render to stream
  // them in. Absent/blocked => unchanged (live-Overpass buildings). Never throws.
  loadTilesConfig().then(function(){ try{ render(); }catch(e){} });
  deckgl=new deck.DeckGL({container:'map',mapStyle:null,viewState:VIEW,
    controller:{inertia:300,dragRotate:true}, effects:LIGHTING?[LIGHTING]:[],
    layers:layers(),
    onWebGLInitialized:(gl)=>{ try{ if(detectSoftwareGL(gl))downgradeForSoftwareGL(); }catch(e){} },
    getTooltip:({object,layer})=>{
      if(!object)return null;
      if(layer&&layer.id==='bldg')return {html:`<div class="dtt"><b>${object.h.toFixed(1)}m</b><br>~${Math.round(object.fa)} m² · est. from footprint</div>`};
      if(layer&&layer.id==='poi'){const lab=(POI_LABEL[object.t]||object.t);return {html:`<div class="dtt"><b>${lab}</b><br>live OSM POI · measured</div>`};}
      return null;},
    onViewStateChange:({viewState,interactionState})=>{
      VIEW=viewState;
      const inTrans=!!(interactionState&&interactionState.inTransition);
      const userMoving=!!(interactionState&&(interactionState.isDragging||interactionState.isZooming||
         interactionState.isPanning||interactionState.isRotating||(interactionState.inTransition===false&&interactionState.isMoving)));
      // any pan/zoom/rotate the USER drives pauses the orbit; our own orbit/recenter pushes don't.
      if(!_programmatic && userMoving){ userInteract(); }
      // CONTROLLED viewState: reflect genuine user moves straight back to deck (else it looks frozen),
      // guarded so the re-push isn't mistaken for fresh user input.
      if(userMoving && !inTrans && !_programmatic){
        _programmatic=true; deckgl.setProps({viewState:VIEW});
        Promise.resolve().then(()=>{_programmatic=false;});
      }
      // re-fetch buildings/POIs only for USER-driven moves (debounced) — the orbit (bearing-only) and
      // intro fly-in don't change the footprint set, so they must NOT thrash Overpass.
      if(!_programmatic && userMoving){
        clearTimeout(window._t); window._t=setTimeout(()=>{loadBuildings();loadPOIs();},650);
      }
      return viewState;
    }});
  $('#t-ring').onclick=()=>{ showRing=!showRing; $('#t-ring').classList.toggle('on',showRing); render(); };
  // Orbit toggle: master on/off; turning ON clears the user-pause so the scene resumes breathing.
  (function(){var ot=$('#t-orbit');if(!ot)return;
    ot.onclick=function(){orbitOn=!orbitOn; if(orbitOn)orbitPausedByUser=false; ot.classList.toggle('on',orbitOn); lastT=0;};})();
  $('#t-reload').onclick=()=>{ loadBuildings(); loadPOIs(); };
  // basemap toggle (light Positron default / voyager / dark) — re-styles buildings + markers for the base.
  const baseBtns={light:$('#b-light'),voyager:$('#b-voyager'),dark:$('#b-dark')};
  Object.keys(baseBtns).forEach(k=>{ if(!baseBtns[k])return;
    baseBtns[k].onclick=()=>{ basemap=k;
      Object.keys(baseBtns).forEach(j=>baseBtns[j]&&baseBtns[j].classList.toggle('on',j===k)); render(); };});
  loadPanel(); loadBuildings(); loadPOIs();
  startMotion();
}

// ---- MOTION BOOTSTRAP (ported from rayong-catchment): intro fly-in, then gentle auto-orbit -------
// Start parked at the high/wide INTRO view, then ease down to FRAMED. The orbit loop holds until the
// intro completes so the two motions don't overlap. Under software WebGL both are skipped (camera
// snaps to FRAMED) so the render loop stays cold and the headless harness settles to a clean frame.
function startMotion(){
  const INTRO_MS=2400;
  // belt-and-suspenders: a raw pointerdown / wheel on the map well also pauses the orbit.
  try{const mapEl=document.getElementById('map');
    if(mapEl){['pointerdown','wheel','touchstart'].forEach(ev=>
      mapEl.addEventListener(ev,()=>{ if(introDone)userInteract(); },{passive:true}));}
  }catch(e){}
  if(SOFT_GL){
    _programmatic=true; VIEW=Object.assign({},FRAMED);
    try{ deckgl.setProps({viewState:VIEW}); }catch(e){}
    Promise.resolve().then(()=>{_programmatic=false;});
    introDone=true; orbitOn=false; try{setOrbitUI(false);}catch(e){}
    return;
  }
  requestAnimationFrame(()=>{
    _programmatic=true;
    const tp={viewState:Object.assign({},FRAMED,{transitionDuration:INTRO_MS})};
    try{ if(deck.FlyToInterpolator){tp.viewState.transitionInterpolator=new deck.FlyToInterpolator({speed:1.2,curve:1.3});} }catch(e){}
    VIEW=Object.assign({},FRAMED);
    deckgl.setProps(tp);
    setTimeout(()=>{ _programmatic=false; introDone=true; lastT=0; }, INTRO_MS+60);
  });
  function tick(t){
    rafId=requestAnimationFrame(tick);
    if(!introDone){ lastT=t; return; }
    if(!orbitOn||orbitPausedByUser){ lastT=t; return; }
    if(!lastT){ lastT=t; return; }
    const dt=(t-lastT)/1000; lastT=t;
    if(dt<=0||dt>0.5) return;                 // skip absurd gaps (tab was backgrounded)
    VIEW=Object.assign({},VIEW,{bearing:((VIEW.bearing||0)+ORBIT_DPS*dt)%360});
    pushView();
  }
  rafId=requestAnimationFrame(tick);
}
init();
</script>
