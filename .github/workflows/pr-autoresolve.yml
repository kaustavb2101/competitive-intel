name: PR — keep open branches mergeable after master moves

# WHY THIS EXISTS
# ---------------
# Work happens here from more than one place at once — a laptop session and a phone session — and
# platform/data/ is generated but committed (Vercel serves it statically, so it must be). Every
# branch that touches data regenerates provenance.json, a single-line census of all 441 files. So
# the moment ANY data change lands on master, every other open PR conflicts on a line nobody wrote,
# and stays blocked until someone resolves a machine-generated file by hand.
#
# The determinism gate proves 132 times per run that everything in platform/data/ reproduces
# byte-exactly from committed sources. A conflict there is therefore not a disagreement to
# reconcile — it is two stale copies of a pure function. This job takes master's side and recomputes
# (pipeline/resolve_derived_conflicts.sh), which cannot conflict because it never merges.
#
# Two other files collide on every concurrent branch for the same reason and get the same treatment,
# each via a merger that does a real 3-way merge first and refuses anything contested:
# docs/PROGRESS_LOG.md (both sides insert an entry at the top) and source-data/feed_history.json
# (both sides append a day to an accumulator whose sources keep no archive, so picking a side
# DESTROYS telemetry). Everything else outside platform/data/ is left exactly as it was and reported
# in the run summary for a human.
#
# Whatever it does write is gated before it can MERGE, but not by this job: it dispatches qa.yml
# against the head it pushes, and pr-automerge.yml will not merge a PR whose qa.yml run is not green
# on that exact head. See the comment in the loop for why the gate that used to run here as well was
# removed — it was 84% of this repo's Actions bill, duplicating a check that already ran for free.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: write   # required to dispatch qa.yml (workflow_dispatch) against the branch this job pushes

concurrency:
  # One at a time: two of these racing would push conflicting merges onto the same PR branches.
  group: pr-autoresolve
  cancel-in-progress: false

jobs:
  refresh:
    # STAYS ON ubuntu-latest, deliberately. The obvious saving is to move this to the self-hosted
    # `ci` box like qa.yml, and it is the wrong move: that box is 2 cores / 4 GB with ONE serial
    # executor, and it is already the binding constraint (QA alone booked 21,989 runner-minutes in
    # 7 days — more wall time than the week contains, i.e. a standing queue). Parking a multi-PR
    # re-derive loop in front of that queue would delay every PR's gate to save a few dollars. The
    # `thai` runner is out for the reason given in qa.yml: the Thai-IP data pulls must not queue
    # behind anything. So this job is made CHEAP instead of moved — see the loop below.
    runs-on: ubuntu-latest
    timeout-minutes: 60    # merge + re-derive per PR; the gate no longer runs here
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # need real history to merge PR branches

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"           # match the determinism gate's Python

      # Node is for the gate's `node --check` JS-syntax phase. numpy is pinned for the same reason
      # qa.yml pins it: build_branch_peers.py --check only reproduces byte-for-byte under 2.4.6.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pipeline deps
        run: pip install numpy==2.4.6

      - name: Bring every stale open PR up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stash the resolver OUTSIDE the tree before touching it. The loop below checks out each PR
          # branch, which overwrites the working tree with that branch's files — and a branch cut
          # before the resolver existed does not contain it, so calling `pipeline/...` after checkout
          # gives "No such file or directory" and every such PR is skipped. Run master's copy instead:
          # it is the version we want applied regardless of what the branch carries.
          RESOLVER="$RUNNER_TEMP/resolve_derived_conflicts.sh"
          cp pipeline/resolve_derived_conflicts.sh "$RESOLVER"

          # headRepositoryOwner filters out forks — we cannot push to those.
          #
          # DRAFTS ARE SKIPPED, and that skip is a real cost lever: every master push refreshes
          # every open PR, so the work here is (open PRs x master pushes) and drafts multiply it for
          # nothing. Measured 2026-08-14 over 7 days, this workflow was 4,389 of 5,223 billed
          # minutes (84%) across 165 runs — one run per master push — at 26.6 min each. Removing the
          # duplicate gate from the loop takes roughly two thirds off that; skipping drafts takes
          # the multiplier off what remains.
          #
          # Seven of the nine open PRs at the time of writing are auto-generated draft data
          # refreshes. A draft is by definition not about to merge, so re-merging master into it and
          # double-gating it every time master moves buys nothing: it will be refreshed again the
          # moment it is marked ready, which is the only point at which its mergeability matters.
          # Nothing is lost — `gh pr ready` triggers no refresh by itself, but the next master push
          # picks it up, and a PR being merged goes through the merge queue's own checks regardless.
          PRS=$(gh pr list --state open --base master --limit 50 \
                  --json number,headRefName,headRepositoryOwner,isDraft,mergeStateStatus \
                  --jq ".[] | select(.headRepositoryOwner.login==\"${GITHUB_REPOSITORY_OWNER}\") | select(.isDraft|not) | \"\(.number) \(.headRefName) \(.mergeStateStatus)\"")
          NDRAFT=$(gh pr list --state open --base master --limit 50 --json isDraft --jq '[.[]|select(.isDraft)]|length')
          # Say what was skipped rather than silently covering less than the name implies.
          [ "${NDRAFT:-0}" -gt 0 ] && echo "skipping $NDRAFT draft PR(s) — they refresh once marked ready"
          if [ -z "$PRS" ]; then echo "No non-draft open PRs. Nothing to do."; exit 0; fi

          echo "## PR auto-resolve" >> "$GITHUB_STEP_SUMMARY"
          RESOLVED=0; SKIPPED=0; BLOCKED=0

          while read -r NUM BRANCH MSS; do
            [ -z "${NUM:-}" ] && continue
            echo "::group::PR #$NUM ($BRANCH)"
            git checkout -q --force -B "$BRANCH" "origin/$BRANCH" || { echo "cannot check out"; echo "::endgroup::"; continue; }
            git reset -q --hard "origin/$BRANCH"; git clean -qfd

            if git merge-base --is-ancestor origin/master HEAD; then
              echo "already up to date."
              SKIPPED=$((SKIPPED+1)); echo "::endgroup::"; continue
            fi

            # DO NOT REWRITE A PR THAT DOES NOT NEED IT. Refreshing a branch changes its head, which
            # discards whatever gate result it had and requires a new one — and qa.yml's per-branch
            # concurrency then CANCELS the queued run this job's own previous pass asked for. On a
            # single serial runner that is a livelock, not an inefficiency: master moves faster than
            # 4 PRs can be gated, so every gate is killed before it starts and nothing ever merges.
            # Observed 2026-08-15 — pr-automerge ran 8 times over 3 hours, correctly, and merged
            # nothing, because no PR ever held a stable head long enough to finish a gate.
            #
            # Of the four master pushes that caused it, THREE could not have affected any PR:
            # b5813e4b and dea5f698 touched docs/ + pipeline/check_site_health.py, 60685b5a touched
            # docs/ + platform/status_data.json. Only f5b63c20 touched platform/data and
            # source-data. A merge is only capable of producing stale derived output if master
            # actually moved the derived layers or their committed inputs, so that is the test.
            #
            # A conflicted PR is always refreshed regardless — that is this job's whole purpose —
            # and UNKNOWN is treated as conflicted, because it means GitHub has not finished
            # computing and guessing "clean" would skip a PR that genuinely needs resolving.
            BASE=$(git merge-base origin/master HEAD)
            DERIVED_MOVED=$(git diff --name-only "$BASE" origin/master -- platform/data source-data | head -1)
            if [ -z "$DERIVED_MOVED" ] && [ "${MSS:-UNKNOWN}" != "DIRTY" ] && [ "${MSS:-UNKNOWN}" != "UNKNOWN" ]; then
              echo "master moved, but not in platform/data or source-data, and this PR is $MSS — leaving it alone so its gate stays valid."
              SKIPPED=$((SKIPPED+1)); echo "::endgroup::"; continue
            fi

            # NEVER REWRITE A HEAD THAT IS CURRENTLY BEING GATED. The guard above is necessary but
            # NOT sufficient, and the difference is the whole bug: it only skips when master moved
            # somewhere harmless, and on a data-heavy night EVERY master push touches platform/data,
            # so it passes through and the rewrite happens anyway.
            #
            # The rewrite is then strictly destructive, because the two loops run at incompatible
            # speeds. A gate takes 19-40 min on one serial self-hosted executor; master moves about
            # every 20. So the head is invalidated before its own gate can finish, the next tick
            # dispatches a fresh one, and that dispatch CANCELS the run still executing for the old
            # head. Measured on the night of 2026-08-15: PRs #407 and #408 each had their head
            # rewritten five times between 22:43 and 02:23, and of the ten gates dispatched across
            # them, nine were cancelled mid-run and the single one that finished green belonged to a
            # SHA that had already been superseded. Nothing was mergeable at any point, and the box
            # spent the entire night computing results that were thrown away.
            #
            # A running gate is therefore the scarcest thing in the system, and being a few commits
            # behind master is not a reason to destroy one: these PRs are UNSTABLE, not BEHIND, so
            # nothing blocks their merge on being up to date. Let the gate land, let pr-automerge
            # merge it, and refresh whatever is left on the next tick. That turns the livelock into
            # a serial drain.
            #
            # DIRTY still overrides — a conflicted PR cannot merge whatever its gate says, so
            # resolving it is worth more than the run in flight, and the stale run is cancelled
            # after the push below rather than left to occupy the executor.
            #
            # Bounded at 90 min (twice qa.yml's own 45-min timeout) so a genuinely wedged run can
            # slow this down at most once, instead of freezing the PR forever.
            HEADSHA=$(git rev-parse HEAD)
            INFLIGHT=$(gh run list --workflow qa.yml --limit 60 --json headSha,status,createdAt \
                         --jq "[.[] | select(.headSha==\"$HEADSHA\")
                                    | select(.status != \"completed\")
                                    | select((now - (.createdAt|fromdateiso8601)) < 5400)] | length" \
                       2>/dev/null || echo 0)
            if [ "${INFLIGHT:-0}" -gt 0 ] && [ "${MSS:-UNKNOWN}" != "DIRTY" ] && [ "${MSS:-UNKNOWN}" != "UNKNOWN" ]; then
              echo "$INFLIGHT gate run(s) already in flight on this head ($HEADSHA) — leaving it alone so one can actually finish."
              SKIPPED=$((SKIPPED+1)); echo "::endgroup::"; continue
            fi

            # `|| rc=$?` is load-bearing: Actions runs this block as `bash -e`, and `set -uo
            # pipefail` above does NOT clear -e. Calling the resolver bare would abort the whole
            # step the first time it returned 2 — its correct "this one needs a human" signal —
            # so one PR with a real conflict would stop every later PR from being refreshed.
            # Putting it in a condition context is what keeps -e from firing.
            rc=0
            bash "$RESOLVER" origin/master || rc=$?
            if [ "$rc" -eq 0 ]; then
              # NO GATE RUN HERE — and that is a cost decision with a measured basis, not a
              # loosening. This job used to run `tests/run.sh check` before every push, then
              # dispatch qa.yml two lines below to run the SAME gate again. Measured on run
              # 31825684202, per PR: 2.5 min to merge + re-derive, then 5.6 min to gate, then a
              # dispatch that gated it a second time. Over 7 days this workflow was 4,389 of the
              # repo's 5,223 billed minutes — 84% of the bill — and roughly two thirds of that was
              # the duplicated half.
              #
              # What used to justify it: a push made with the default GITHUB_TOKEN does NOT trigger
              # further workflow runs (GitHub's loop prevention), so without an explicit check the
              # commits this job creates were unverified. That hole is now closed twice over — the
              # dispatch below asks qa.yml for a real run on the pushed head, and pr-automerge.yml
              # refuses to merge anything whose qa.yml run is not `success` on that EXACT headSha.
              # So the gate still happens on every commit this job writes; it happens once, on the
              # self-hosted box where it costs nothing, instead of twice with the first copy billed.
              #
              # What genuinely changes: a re-derive that goes red is now pushed and shows red on the
              # PR, where it used to be withheld and the PR left silently dirty. That is the better
              # failure — visible, and still unmergeable.
              if git push origin "HEAD:$BRANCH"; then
                echo "- #$NUM \`$BRANCH\` — merged master + re-derived, mergeable again (gate runs via the dispatch below)" >> "$GITHUB_STEP_SUMMARY"
                RESOLVED=$((RESOLVED+1))
                # A push made with GITHUB_TOKEN is exempt from GitHub's loop-prevention, so qa.yml's
                # own `push` trigger never fires on this new head — the PR page would keep showing
                # the OLD head's green checks while this commit sits ungated and mergeable.
                # workflow_dispatch is the documented exception, so explicitly ask qa.yml to run
                # against the branch we just pushed. Best-effort: a dispatch failure must not fail
                # this job (that would block every other PR still waiting in the loop), but it must
                # be LOUD — a silent failure here would recreate the exact bug this step exists to close.
                # The head we just replaced may still have a gate executing. It is now gating a
                # commit that is no longer anyone's head, so its result can never be used — but on
                # one serial executor it will happily run to completion and hold the box while the
                # gate for the NEW head waits behind it. Cancel it explicitly.
                #
                # This used to happen implicitly, as a side effect of qa.yml's per-ref concurrency
                # group: the dispatch below would cancel it. That is being removed in the same
                # change, because grouping per ref also let a dispatch cancel a run for a DIFFERENT
                # commit — which is how nine of ten gates died last night. Doing it here instead
                # keeps the cleanup and drops the collateral: we cancel the old SHA by name,
                # never whatever else happens to share the branch.
                for R in $(gh run list --workflow qa.yml --limit 60 \
                             --json headSha,status,databaseId \
                             --jq ".[] | select(.headSha==\"$HEADSHA\")
                                       | select(.status != \"completed\") | .databaseId" 2>/dev/null); do
                  gh run cancel "$R" >/dev/null 2>&1 \
                    && echo "  cancelled superseded gate $R (was gating the old head $HEADSHA)"
                done

                if gh workflow run qa.yml --ref "$BRANCH"; then
                  echo "  dispatched qa.yml on $BRANCH @ $(git rev-parse HEAD)"
                else
                  echo "::error::qa.yml dispatch FAILED for #$NUM ($BRANCH) — new head $(git rev-parse HEAD) has NO visible gate run. Check/dispatch manually."
                fi
              else
                echo "- #$NUM \`$BRANCH\` — resolved but the push was rejected (branch moved mid-run); next master push retries" >> "$GITHUB_STEP_SUMMARY"
                BLOCKED=$((BLOCKED+1))
              fi
            elif [ "$rc" -eq 2 ]; then
              echo "- #$NUM \`$BRANCH\` — **real conflict outside platform/data/, left untouched for you**" >> "$GITHUB_STEP_SUMMARY"
              BLOCKED=$((BLOCKED+1))
            else
              echo "- #$NUM \`$BRANCH\` — re-derive did not converge, left untouched" >> "$GITHUB_STEP_SUMMARY"
              BLOCKED=$((BLOCKED+1))
            fi
            echo "::endgroup::"
          done <<< "$PRS"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESOLVED refreshed · $SKIPPED already current · $BLOCKED need a human" >> "$GITHUB_STEP_SUMMARY"
          # Never fail the run for a blocked PR — this job is a convenience, not a gate.
          exit 0
