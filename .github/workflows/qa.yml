name: QA

# Verifies every change against the committed test suite.
#   - determinism gate (pipeline --check + JS syntax) — no network
#   - headless render of every platform/ page (deck.gl/Leaflet are committed under platform/vendor/)
#   - page-health smoke + visual regression vs tests/baseline/*.png
#
# NETWORK POLICY: the SUITE itself is now fully offline — the map libraries ship in the repo, so no
# npm install happens at test time and NO data pulls occur (Overpass/Google/HDX/data.go.th are never
# contacted). The job still downloads Python/Node/Chromium as toolchain setup. Basemap raster tiles
# are intentionally blank in renders. This mirrors what the sandbox can do.

on:
  # `push` is master-ONLY on purpose. It used to be ["**"], which meant every human push to a branch
  # with an open PR started TWO identical gate runs — one for `push`, one for `pull_request` — on the
  # same commit. Measured 2026-08-14 over 7 days: 706 QA runs booking 21,989 runner-minutes on a
  # single serial self-hosted executor, i.e. more wall time than the week physically contains. The
  # box was not slow, it was queueing, and roughly a third of the queue was this duplicate.
  #
  # Coverage is unchanged for everything that can merge: a human push to a branch with an open PR is
  # still gated by `pull_request`; a commit written by a workflow is gated by the explicit
  # workflow_dispatch that pr-autoresolve/pr-automerge issue (a GITHUB_TOKEN push triggers no event
  # at all, so `push: ["**"]` never covered those anyway); and master itself is gated below.
  # What is genuinely given up: a branch pushed with NO open PR is no longer gated until a PR
  # exists. Open the PR, or dispatch this workflow by hand.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Supersede rather than pile up. `pr-autoresolve` dispatches this workflow once per open PR every
# time master moves, so two master merges in quick succession put two gate runs on the SAME branch
# head into the queue — and until now both ran to completion even though the first was answering a
# question the second had already replaced. On GitHub's runners that was invisible waste; on a
# single self-hosted runner it is worse than waste, because the stale run occupies the only executor
# and the useful one waits behind it.
#
# Keyed on the PR number where there is one and the ref otherwise, so runs are only ever cancelled
# by a newer run of the SAME branch — never across branches.
#
# EVERY MASTER COMMIT GETS ITS OWN GROUP, which is a correctness fix rather than a tuning knob. For
# a PR branch a superseded run is genuinely worthless — a newer commit already replaced the question.
# For master it is the opposite: every master commit is a distinct state that ships to Vercel, so
# cancelling one does not supersede it, it leaves it permanently ungated. That was actively
# happening — commits 5b0edb80, f9ffcf74, 5d99648b and a76de7f0 each cancelled the one before, so
# four consecutive master states reached production with no gate result at all. pr-automerge merges
# one PR at a time, which pushes master in exactly the bursts that trigger this.
#
# `cancel-in-progress: false` is NOT enough on its own, and this was measured rather than reasoned:
# ff8b7bd9 carried exactly that setting and was cancelled anyway. The flag only protects a run that
# is already EXECUTING. GitHub additionally cancels a previously *pending* run whenever a newer one
# joins the same group — and on a queue this deep, master runs spend nearly all their life pending,
# so the flag almost never applies. Keying the group on the commit SHA is what actually fixes it:
# each master state is alone in its group and has nothing to be superseded by.
#
# THAT REASONING NOW APPLIES TO BRANCHES TOO. The rule above was written for master only, and
# branch work was left grouping per PR / per ref on the argument that a newer commit makes the older
# run pointless. It does — but the group is what decides WHICH run gets killed, and per-ref was too
# coarse to tell "newer commit on this branch" from "another gate for this branch". On the night of
# 2026-08-15 that distinction was the whole ballgame: pr-autoresolve rewrote #407 and #408 five
# times each between 22:43 and 02:23, and every rewrite dispatched a gate that joined the same
# per-ref group and cancelled the one still executing for the previous head. Nine of ten gates died
# mid-run; the one that survived was green on a SHA that had already been superseded. Two loops
# running at incompatible speeds (a 19-40 min gate, a ~20 min refresh cycle) meant nothing was ever
# mergeable, and the executor spent the night on results that were discarded.
#
# So: ONE GROUP PER (event, gated commit). A run can only ever be cancelled by another run asking
# the identical question — same event, same SHA — which is a true duplicate and the only case where
# superseding is free. A newer commit no longer reaches back and kills the older commit's gate;
# pr-autoresolve cancels the superseded SHA by name after it pushes, so the executor is still freed,
# but deliberately and without collateral.
#
# `github.event_name` stays in the key for a specific reason: a bot-pushed head creates BOTH an
# `action_required` pull_request run and (about two seconds later) the compensating
# workflow_dispatch run, on the same SHA. Keyed on SHA alone they would share a group, and the
# pull_request run — which by definition never executes — would cancel the dispatch that does.
concurrency:
  group: qa-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qa:
    # WHY THIS LEFT ubuntu-latest. Measured over 29 hours / 200 runs: QA was 3,050 of the repo's
    # 3,849 Actions job-minutes — 79% of a metered private-repo bill, against 5% for all ten data
    # feeds combined. Nearly all of those 22 minutes per run were toolchain, not testing: every run
    # downloaded a fresh Chromium. On a self-hosted box that download happens once and is cached
    # between runs (see the skip guard below).
    #
    # There is a second reason, and it matters more than the money. The determinism gate reproduces
    # byte-exact only under cpython-3.11 on Linux with LF line endings — which is why reproducing a
    # CI failure locally needs a WSL mirror. The box IS that environment natively, so the canonical
    # gate and its local reproduction stop being two machines that can disagree.
    #
    # The `ci` label, NOT `thai`. The Thai-IP feeds run on a runner labelled `thai` and must never
    # queue behind a QA backlog — a nightly data pull that misses its window because 12 PRs were
    # testing is a silent data gap. QA needs no particular IP, so it gets its own label and its own
    # runner instance on the same box.
    #
    # ONE ci runner, not several, and that is a hardware fact rather than a preference: the box is
    # 2 cores / 4 GB. The render phases drive software-WebGL Chromium over deck.gl scenes, which can
    # spike past 1.5 GB on its own; two of those concurrently would OOM rather than parallelise.
    # QA here is deliberately serial. `pr-autoresolve` was considered for this box and deliberately
    # left on ubuntu-latest for the same reason — it runs a full gate per PR under a 180-minute
    # ceiling, and on a single runner one long autoresolve would block every PR's QA behind it.
    runs-on: [self-hosted, ci]
    # A hosted runner that hangs costs one job. A self-hosted runner that hangs blocks every job
    # behind it until someone notices, so this ceiling is load-bearing here in a way it was not on
    # ubuntu-latest, where the job had no timeout at all.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pin to the SAME Python the data is generated under (the cloud build sandbox is 3.11),
          # so the determinism --check gate mirrors the build environment. 3.11 vs 3.12 can resolve
          # a float-rounding boundary differently and make a byte-identical generator "drift" in CI.
          python-version: "3.11"

      # Node is here for `node --check` (JS syntax gate) and to run the Playwright installer.
      # It is NOT used to install deck.gl/Leaflet any more — those are committed in platform/vendor/.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --- Phase 1: offline determinism + syntax gate (no chromium needed) ---
      # numpy is pinned for the same reason Python is: build_branch_peers.py --check reproduces
      # byte-for-byte only under the version the artifact was generated with. The builder avoids
      # BLAS (matmul) on purpose; elementwise numpy reductions are stable across machines.
      - name: Install pipeline deps
        run: pip install numpy==2.4.6
      - name: Determinism + syntax gate
        run: bash tests/run.sh check

      # --- Headless Chromium for the render phase ---
      # The render/health/visual phases use software-WebGL headless Chromium, which is
      # environment-sensitive (canvas init + pixel baselines differ across machines), so they
      # run NON-BLOCKING: they still execute and upload artifacts for inspection, but only the
      # deterministic check gate above can fail the build. Visual regression is a LOCAL dev tool.
      - name: Install Chromium (Playwright)
        continue-on-error: true
        run: |
          # The PACKAGE, not just the CLI. `npx --yes playwright install` fetches the installer
          # transiently and leaves nothing in node_modules, which is fine for render.sh (it drives the
          # chrome binary directly) but makes `require('playwright')` fail — so tests/run.sh overflow
          # skipped itself with "playwright npm package is not installed here" the first time it ran.
          #
          # node_modules lives INSIDE the workspace, which actions/checkout wipes every run, so this
          # install always happens. npm's cache does not live in the workspace, so on the self-hosted
          # box it is a cache hit measured in seconds rather than a download.
          npm install --no-save --no-audit --no-fund playwright@1.49.1

          # The BROWSER, by contrast, lives outside the workspace and therefore survives between
          # runs on a self-hosted box. Re-downloading ~150MB of Chromium on every one of 136 runs
          # was most of what made this a 22-minute job; provisioning it once and detecting it here
          # is the single change that pays for the migration.
          if ls -d /opt/pw-browsers/chromium-*/chrome-linux/chrome >/dev/null 2>&1; then
            echo "chromium already provisioned on this runner — skipping download:"
            ls -d /opt/pw-browsers/chromium-*/chrome-linux/chrome
            exit 0
          fi

          # First run on a fresh machine, or any hosted runner this job is ever moved back to.
          # `--with-deps` apt-installs system libraries and so needs root; on the self-hosted box
          # that is done once by the provisioning script rather than here, which is why reaching
          # this branch there means provisioning did not complete.
          npx playwright install --with-deps chromium
          PW_DIR="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          CH="$(ls -d "$PW_DIR"/chromium-*/chrome-linux/chrome 2>/dev/null | head -1)"
          if [ -z "$CH" ]; then echo "chromium not found under $PW_DIR" >&2; exit 1; fi
          VER="$(basename "$(dirname "$(dirname "$CH")")")"
          # sudo -n rather than sudo: a runner account without passwordless sudo would otherwise sit
          # waiting on a password prompt that nothing can ever answer, and burn the job timeout
          # instead of failing in one legible line.
          sudo -n mkdir -p /opt/pw-browsers \
            && sudo -n cp -r "$PW_DIR/$VER" "/opt/pw-browsers/$VER" \
            || { echo "could not write /opt/pw-browsers (no passwordless sudo?) — run the box provisioning script as root" >&2; exit 1; }
          ls -d /opt/pw-browsers/chromium-*/chrome-linux/chrome

      # --- Phase 2+3+4+5: render, health smoke, visual regression, layout audit (offline: vendored map libs) ---
      #
      # Each phase runs INDEPENDENTLY. This step's shell is `bash -e`, and tests/run.sh exits non-zero
      # whenever any case fails, so the previous one-command-per-line form aborted at the first
      # failing phase and silently never ran the rest. `render` has been failing on the heavy deck.gl
      # pages (province-rayong / province-chonburi / rayong-catchment time out on the runner), which
      # means health and visual had not actually executed in CI for some time — the step still
      # reported green because it is continue-on-error. Looping keeps every phase's output visible and
      # raises a warning annotation per failing phase, without making any of them blocking.
      - name: Render + health + visual + overflow (non-blocking)
        continue-on-error: true
        run: |
          set +e
          rc=0
          for ph in render health visual overflow; do
            echo "::group::tests/run.sh $ph"
            bash tests/run.sh "$ph"; s=$?
            echo "::endgroup::"
            if [ "$s" -ne 0 ]; then echo "::warning::tests/run.sh $ph exited $s"; rc=1; fi
          done
          exit $rc

      # Always upload fresh renders so a visual-regression failure is inspectable.
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-renders
          path: tests/.work/render/*.png
          if-no-files-found: ignore
          retention-days: 14
