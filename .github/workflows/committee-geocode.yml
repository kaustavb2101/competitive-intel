name: Committee — geocode precision backlog (weekly, key-gated)

# The quietest data-quality lever (docs/INSIGHTS.md §2): only ~18% of branches were building-precise;
# tambon-centroid errors up to 10.8 km were proven. Every proximity number (rival pressure, leads,
# contested population, density) sharpens as precision rises. committee/run_cycle.py runs the gated
# loop: geocoder proposes candidates -> validator gates (Thailand bbox, brand/name token match,
# max-shift, dedup, no-regression) -> accepted patches merge into the master -> SCORECARD updated.
#
# Needs a Google Places key. This job SKIPS cleanly when no key secret is set, so it is inert until
# you add one: repo -> Settings -> Secrets and variables -> Actions. It accepts EITHER
# GOOGLE_PLACES_KEY or GOOGLE_MAPS_API_KEY (Places API enabled, key restricted to it). ROTATE the
# previously-exposed key first.
#
# A geocode changes branch coordinates, so this rebuilds every coordinate-dependent layer and runs the
# determinism gate; it opens a DRAFT PR only when the gate is green. Never pushes to a working branch.

on:
  workflow_dispatch:
    inputs:
      max_cycles:
        description: "geocoder cycles (batch 100 each) — every cycle is up to 100 BILLED Google calls"
        default: "1"
  schedule:
    # Weekly, Monday 03:10 UTC — after the gov-census job.
    - cron: "10 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Guard — require a Google Places key (GOOGLE_MAPS_API_KEY or GOOGLE_PLACES_KEY)
        env:
          KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.GOOGLE_PLACES_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "No Google Places key found (checked GOOGLE_MAPS_API_KEY and GOOGLE_PLACES_KEY repo secrets) — geocoder is inert. Skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        if: env.SKIP != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deps
        if: env.SKIP != '1'
        # rasterio is NOT optional here, despite build_contested_pop.py treating it as such. A
        # geocode moves branch coordinates, which invalidates every fingerprint-stamped layer; if
        # build_contested_pop.py cannot run it leaves contested_pop.json stamped with the OLD
        # fingerprint and the determinism gate correctly fails the run with "stale layer". Without
        # this install the job failed at the gate every single time (6/6 since 2026-07-12) and never
        # reached the step that opens the PR.
        run: pip install --quiet shapely openlocationcode rasterio || true

      - name: Preflight — can this run actually produce a mergeable PR?
        if: env.SKIP != '1'
        # WHY THIS RUNS BEFORE THE GEOCODER, NOT AFTER.
        # Each geocoder cycle spends up to 100 BILLED Google Places calls. Those calls were being
        # spent every Monday and then thrown away, because the run could never pass the gate: it
        # rebuilds every coordinate-dependent layer, and build_occupations.py cannot run in CI at
        # all. Its input (source-data/overture_places.json, ~54MB) is gitignored, so a fresh
        # checkout never has it; the builder exits non-zero, branch_occupations.json keeps its old
        # branches_fingerprint, and the tamper-evident gate fails — correctly, because that layer
        # really would be describing the wrong branch coordinates.
        #
        # The gate is right and must not be relaxed. The honest response is to not spend the money
        # until the input is available, and to say plainly what is missing.
        run: |
          if [ ! -f source-data/overture_places.json ]; then
            echo "::warning title=geocode skipped::source-data/overture_places.json is absent, so build_occupations.py cannot rebuild branch_occupations.json after a coordinate change. The determinism gate would fail and no PR could open, so the geocoder is NOT being run — this saves up to 100 billed Google Places calls. Restore the input (pipeline/pull_overture_places.py --preset national, then publish it where CI can fetch it) to re-enable this job."
            # SKIP=1 is what the remaining steps already gate on, so the job ends GREEN with the
            # warning above rather than red — a run that correctly declines to start is not a failure.
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "overture_places.json present — every fingerprinted layer is rebuildable."
          fi

      - name: Run gated geocoder cycles (merges accepted patches into the master)
        if: env.SKIP != '1'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.GOOGLE_PLACES_KEY }}
        run: |
          cd committee
          # The `|| '1'` is the SCHEDULED path — github.event.inputs is empty on a cron run, so this
          # fallback, not the input default, is what spends money unattended every Monday. It was 5,
          # which is up to 500 billed Google calls a week that nobody asked for and nobody reads the
          # result of. One cycle (<=100 calls) still drains the backlog steadily; raise it by hand
          # via workflow_dispatch when you actually want a big catch-up run and will watch the spend.
          python3 run_cycle.py --member geocoder --batch 100 --loop --max-cycles "${{ github.event.inputs.max_cycles || '1' }}"

      - name: Rebuild every derived layer + run the determinism gate
        if: env.SKIP != '1'
        run: |
          cd pipeline && python3 derive.py
          # Exit 3 = intentional SKIP (source absent); exit 0 = success; anything else = log as warning.
          BFAILED=()
          for pass in 1 2; do
            for f in build_*.py; do
              _rc=0; python3 "$f" >/dev/null 2>&1 || _rc=$?
              [ "$_rc" -eq 0 ] || [ "$_rc" -eq 3 ] || BFAILED+=("$f(exit $_rc)")
            done
          done
          { _rc=0; python3 build_provenance.py >/dev/null 2>&1 || _rc=$?
            [ "$_rc" -eq 0 ] || [ "$_rc" -eq 3 ] || BFAILED+=("build_provenance.py(exit $_rc)"); }
          [ ${#BFAILED[@]} -eq 0 ] || echo "::warning::${#BFAILED[@]} builder(s) exited unexpectedly (not 0/SKIP-3): ${BFAILED[*]}"
          cd .. && bash tests/run.sh check

      - name: Commit + open a draft PR (only reached when the gate passed)
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          DATA_BRANCH: data/geocode-${{ github.run_id }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Geocoder accepted no new patches this run. No PR opened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$DATA_BRANCH"
          PREC="$(python3 -c "import json;s=json.load(open('committee/SCORECARD.json'));print(s.get('precise','?'),'/',s.get('total','?'))" 2>/dev/null || echo '?')"
          git commit -m "committee: geocode precision batch (run ${{ github.run_id }})" \
                     -m "run_cycle.py geocoder member; validator-gated; every coordinate-dependent layer rebuilt and the determinism gate passed before this PR opened."
          git push origin "$DATA_BRANCH"
          {
            echo "Automated weekly geocode precision run (run ${{ github.run_id }}), from \`$BASE_BRANCH\`."
            echo
            echo "**Building-precise branches:** $PREC"
            echo
            echo "Gated by the committee Validator (Thailand bbox · brand/name token match · max-shift ·"
            echo "dedup · no-regression). All coordinate-dependent layers rebuilt; \`bash tests/run.sh check\`"
            echo "passed in CI before this PR was opened. Rejected/ambiguous matches stay in the manual-review queue."
          } > /tmp/pr_body.md
          gh pr create --draft --base "$BASE_BRANCH" --head "$DATA_BRANCH" \
            --title "committee: geocode precision batch (run ${{ github.run_id }})" \
            --body-file /tmp/pr_body.md
