name: Data — crude-oil baseline (monthly)

# Pulls the World Bank Pink Sheet crude-oil series (CMO-Historical-Data-Monthly.xlsx, "Crude oil,
# average") → source-data/energy_prices.json (pipeline/pull_energy_prices.py). This is the fuel
# BASELINE the income engine uses: fuel headwind = crude YoY, measured off the SAME source and
# comparison period as the crop drivers (owner directive 2026-07-25 — one consistent methodology,
# not a mix of retail-diesel level and crop YoY). The Pink Sheet updates monthly; thedocs.worldbank.org
# is cloud-reachable, no key.
#
# energy_prices.json feeds build_income_impact -> build_scenarios -> build_product_segments, so a
# refresh rebuilds that whole chain + the provenance manifest in lockstep (all deterministic +
# network-free) and runs the FULL determinism gate before a direct merge. Same auto-merge-on-green
# pattern as data-fuel-prices.yml; a RED gate falls back to a draft PR.

on:
  workflow_dispatch:
  schedule:
    - cron: "50 20 4 * *"   # 4th of the month, 20:50 UTC — Pink Sheet posts early each month

permissions:
  contents: write
  pull-requests: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install xlsx reader + numpy
        # numpy: WITHOUT it, build_branch_peers.py --check SKIPs in BOTH the re-derive step and the
        # pre-merge gate below, so a stale branch_peers.json auto-merges as "green" and only qa.yml
        # (which pins numpy==2.4.6) then catches the drift, turning master red. Pinned to match qa.yml.
        run: pip install --quiet openpyxl numpy==2.4.6
      - name: Pull crude baseline
        run: python pipeline/pull_energy_prices.py
      - name: Rebuild the income/scenario chain + provenance when crude changed
        run: |
          # The hand-named chain that used to live here (income_impact -> scenarios ->
          # product_segments -> live_board -> provenance) is the same shape of list that went stale
          # three times on the NABC job. rederive_drift.py iterates the determinism gate's OWN
          # --check set to a fixed point instead, so the gate below sees a consistent tree and this
          # job auto-merges rather than falling back to a draft PR a human has to finish.
          python pipeline/rederive_drift.py --report-md /tmp/rederived.md
          cat /tmp/rederived.md
      - name: Gate, then auto-merge to the base branch (draft PR only on gate failure)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          DATA_BRANCH: data/energy-${{ github.run_id }}
        run: |
          # -u stages TRACKED modifications only, so it follows the re-derive wherever it reached
          # without a second hand-kept list to go stale, and never adds an untracked generated layer.
          git add -u source-data platform/data
          if git diff --cached --quiet; then echo "No change vs committed crude. Nothing to merge."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          H="$(python -c "import json;c=json.load(open('source-data/energy_prices.json'))['crude_avg'];print('crude avg \$%s/bbl (%s), YoY %+.1f%%, YTD %+.1f%%'%(c['latest'],c['date'],c['yoy'],c['ytd']))")"
          git commit -m "data: crude-oil baseline ($(date -u +%F), run ${{ github.run_id }})" \
                     -m "World Bank Pink Sheet — $H. Full 'bash tests/run.sh check' passed 0-failed before this auto-merge."
          # Sync to the base BEFORE gating — gating a tree and then changing it makes the gate
          # result a lie. This was `git pull --rebase`, which conflicts on provenance.json every
          # time the base moved (a phone session, another data job) and killed the job outright.
          git fetch -q origin "$BASE_BRANCH"
          SYNCED=1
          bash pipeline/resolve_derived_conflicts.sh "origin/$BASE_BRANCH" || SYNCED=0
          if [ "$SYNCED" -eq 1 ] && bash tests/run.sh check; then
            echo "Gate green — auto-merging to $BASE_BRANCH."
            for attempt in 1 2 3; do
              git push origin "HEAD:$BASE_BRANCH" && { echo "Crude baseline landed on $BASE_BRANCH ($H)."; exit 0; }
              echo "push rejected (base moved) — re-syncing, attempt $attempt"
              git fetch -q origin "$BASE_BRANCH"
              bash pipeline/resolve_derived_conflicts.sh "origin/$BASE_BRANCH" || break
            done
            echo "Could not land after 3 attempts — falling back to a draft PR."
            git checkout -b "$DATA_BRANCH"; git push origin "$DATA_BRANCH"
            printf 'Automated monthly crude-baseline pull (run %s) — could not auto-land (base kept moving).\n\n**%s**\n' \
              "${{ github.run_id }}" "$H" > /tmp/pr_body.md
            gh pr create --draft --base "$BASE_BRANCH" --head "$DATA_BRANCH" \
              --title "data: crude-oil baseline ($(date -u +%F)) [could not auto-land]" --body-file /tmp/pr_body.md
          else
            echo "Gate RED — falling back to a draft PR for review."
            git checkout -b "$DATA_BRANCH"
            git push origin "$DATA_BRANCH"
            printf 'Automated monthly crude-baseline pull (run %s) from `%s` — GATE FAILED, needs review.\n\n**%s**\n\nMEASURED — World Bank Pink Sheet crude-oil average (fuel baseline for the income engine).\n' \
              "${{ github.run_id }}" "$BASE_BRANCH" "$H" > /tmp/pr_body.md
            gh pr create --draft --base "$BASE_BRANCH" --head "$DATA_BRANCH" \
              --title "data: crude-oil baseline ($(date -u +%F)) [gate failed]" --body-file /tmp/pr_body.md
          fi
