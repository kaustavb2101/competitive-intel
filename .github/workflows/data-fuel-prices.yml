name: Data — live fuel prices (daily)

# Pulls LIVE Thai retail fuel prices (diesel/gasohol, ฿/litre) from Bangchak's official API
# (www.bangchak.co.th/api/oilprice) — free, no key, REACHABLE from GitHub runners (verified 200),
# unlike EPPO / PTT / data.go.th which geoblock datacenter IPs. Fuel cost is a macro pressure on
# AutoX's pickup-owning and motorcycle-owning borrowers.
#
# Output: source-data/fuel_prices.json (pipeline/pull_fuel_prices.py). Committed to a fresh
# data/fuel-<run_id> branch as a DRAFT PR back to the branch this ran on. Never pushes to a working
# branch; no-ops when prices are unchanged. Also snapshots history over time (the API has no history).

on:
  workflow_dispatch:
  schedule:
    # Daily 22:40 UTC (= 05:40 Bangkok) — off-minute; retailers announce next-day prices the evening before.
    - cron: "40 22 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy (so branch_peers rebuilds + gates authoritatively)
        # WITHOUT numpy, build_branch_peers.py --check SKIPs in BOTH the re-derive step and the
        # pre-merge gate below, so a stale branch_peers.json auto-merges as "green" and only qa.yml
        # (which pins numpy==2.4.6) then catches the drift, turning master red. Pinned to match qa.yml.
        run: pip install numpy==2.4.6
      - name: Offline selftest
        run: python pipeline/pull_fuel_prices.py --selftest
      - name: Pull live fuel prices
        run: python pipeline/pull_fuel_prices.py --stamp "$(date -u +%F)"
      - name: Reproject to platform/data when prices changed
        run: |
          if git status --porcelain -- source-data/fuel_prices.json | grep -q .; then
            # Append today's pump price to the accumulated series FIRST. The Bangchak API publishes
            # only today's number, so this row is the only record of it that will ever exist — miss
            # the append and that day is gone from the diesel line for good. Keyed on the file's own
            # meta.pulled, so a re-run the same day is a no-op. It is an APPEND, not a
            # re-derivation, which is why the fixed-point driver below deliberately never runs it.
            python pipeline/append_history.py
          else
            echo "prices unchanged — nothing to append."
          fi
          # Everything else a fuel refresh touches is a pure re-derivation, and the hand-named list
          # that used to live here (fuel_prices, commodities, feed_history, live_board, provenance)
          # is the same shape of list that went stale three times on the NABC job.
          # rederive_drift.py iterates the determinism gate's OWN --check set to a fixed point, so
          # the gate below sees a tree that is already consistent.
          python pipeline/rederive_drift.py --report-md /tmp/rederived.md
          cat /tmp/rederived.md
      - name: Gate, then auto-merge to the base branch (draft PR only on gate failure)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          DATA_BRANCH: data/fuel-${{ github.run_id }}
        run: |
          # AUTO-MERGE (owner directive 2026-07-25): the daily draft PR never auto-integrated and
          # went provenance-stale every day. Same pattern as committee-cycle.yml — run the FULL
          # determinism gate first; 0-failed earns a direct rebase+push to the base branch. Only a
          # RED gate falls back to a draft PR for human eyes.
          # -u stages TRACKED modifications only, so it follows the re-derive wherever it reached
          # without a second hand-kept list to go stale, and never adds an untracked generated layer.
          git add -u source-data platform/data
          if git diff --cached --quiet; then
            echo "No change vs committed prices. Nothing to merge."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          H="$(python -c "import json;h=json.load(open('source-data/fuel_prices.json'))['headline'];print('diesel B%s/L, gasohol95 B%s/L'%(h['diesel'],h['gasohol95']))")"
          git commit -m "data: live fuel prices ($(date -u +%F), run ${{ github.run_id }})" \
                     -m "Pulled by .github/workflows/data-fuel-prices.yml — Bangchak retail ($H). Full 'bash tests/run.sh check' passed 0-failed before this auto-merge."
          # The base may have advanced since checkout — another data job, or a phone session. This
          # used to be `git pull --rebase`, which conflicts on provenance.json EVERY time that
          # happens (a single-line census of 441 files that both sides regenerate) and killed the
          # job outright. resolve_derived_conflicts.sh takes the base's side of the generated layers
          # and recomputes them, which cannot conflict because it never merges. It runs BEFORE the
          # gate on purpose: gating a tree and then changing it would make the gate result a lie.
          git fetch -q origin "$BASE_BRANCH"
          SYNCED=1
          bash pipeline/resolve_derived_conflicts.sh "origin/$BASE_BRANCH" || SYNCED=0
          if [ "$SYNCED" -eq 1 ] && bash tests/run.sh check; then
            echo "Gate green — auto-merging to $BASE_BRANCH."
            # Re-sync and retry: the base can move again between the gate and the push.
            for attempt in 1 2 3; do
              git push origin "HEAD:$BASE_BRANCH" && { echo "Fuel prices landed on $BASE_BRANCH ($H)."; exit 0; }
              echo "push rejected (base moved) — re-syncing, attempt $attempt"
              git fetch -q origin "$BASE_BRANCH"
              bash pipeline/resolve_derived_conflicts.sh "origin/$BASE_BRANCH" || break
            done
            echo "Could not land after 3 attempts — falling back to a draft PR."
            git checkout -b "$DATA_BRANCH"
            git push origin "$DATA_BRANCH"
            printf 'Automated daily fuel-price pull (run %s) from `%s` — could not auto-land (base kept moving).\n\n**Headline:** %s\n' \
              "${{ github.run_id }}" "$BASE_BRANCH" "$H" > /tmp/pr_body.md
            gh pr create --draft --base "$BASE_BRANCH" --head "$DATA_BRANCH" \
              --title "data: live fuel prices ($(date -u +%F)) [could not auto-land]" --body-file /tmp/pr_body.md
          else
            echo "Gate RED — falling back to a draft PR for review."
            git checkout -b "$DATA_BRANCH"
            git push origin "$DATA_BRANCH"
            printf 'Automated daily fuel-price pull (run %s) from `%s` — GATE FAILED, needs review.\n\n**Headline:** %s\n\nMEASURED — Bangchak retail (Bangkok reference, THB/litre). Cloud-reachable; no key.\n' \
              "${{ github.run_id }}" "$BASE_BRANCH" "$H" > /tmp/pr_body.md
            gh pr create --draft --base "$BASE_BRANCH" --head "$DATA_BRANCH" \
              --title "data: live fuel prices ($(date -u +%F)) [gate failed]" --body-file /tmp/pr_body.md
          fi
