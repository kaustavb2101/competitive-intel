name: Data — live fuel prices (daily)

# Pulls LIVE Thai retail fuel prices (diesel/gasohol, ฿/litre) from Bangchak's official API
# (www.bangchak.co.th/api/oilprice) — free, no key, REACHABLE from GitHub runners (verified 200),
# unlike EPPO / PTT / data.go.th which geoblock datacenter IPs. Fuel cost is a macro pressure on
# AutoX's pickup-owning and motorcycle-owning borrowers.
#
# Output: source-data/fuel_prices.json (pipeline/pull_fuel_prices.py). Committed to a fresh
# data/fuel-<run_id> branch as a DRAFT PR back to the branch this ran on. Never pushes to a working
# branch; no-ops when prices are unchanged. Also snapshots history over time (the API has no history).

on:
  workflow_dispatch:
  schedule:
    # Daily 22:40 UTC (= 05:40 Bangkok) — off-minute; retailers announce next-day prices the evening before.
    - cron: "40 22 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline selftest
        run: python pipeline/pull_fuel_prices.py --selftest
      - name: Pull live fuel prices
        run: python pipeline/pull_fuel_prices.py --stamp "$(date -u +%F)"
      - name: Reproject to platform/data when prices changed
        run: |
          # pull_fuel_prices writes only the source; the committed derived layer
          # (platform/data/fuel_prices.json) + the provenance manifest must be rebuilt in
          # lockstep or the determinism gate goes red on merge. Both builders are
          # deterministic + network-free re-projections.
          if git status --porcelain -- source-data/fuel_prices.json | grep -q .; then
            echo "prices changed — rebuilding platform/data/fuel_prices.json + commodities.json + provenance.json"
            python pipeline/build_fuel_prices.py
            # The unified commodities board (commodities.json) embeds the retail diesel price straight
            # from fuel_prices.json (build_commodities.py reads it as the cost line). Refreshing fuel
            # WITHOUT rebuilding commodities left commodities.json drifted and build_commodities.py
            # --check RED — the recurring qa-commodities-gate-drift. Rebuild it before provenance
            # (which censuses commodities.json's bytes/meta).
            python pipeline/build_commodities.py
            python pipeline/build_provenance.py
          else
            echo "prices unchanged — nothing to rebuild."
          fi
      - name: Gate, then auto-merge to the base branch (draft PR only on gate failure)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          DATA_BRANCH: data/fuel-${{ github.run_id }}
        run: |
          # AUTO-MERGE (owner directive 2026-07-25): the daily draft PR never auto-integrated and
          # went provenance-stale every day. Same pattern as committee-cycle.yml — run the FULL
          # determinism gate first; 0-failed earns a direct rebase+push to the base branch. Only a
          # RED gate falls back to a draft PR for human eyes.
          git add source-data/fuel_prices.json platform/data/fuel_prices.json platform/data/commodities.json platform/data/provenance.json
          if git diff --cached --quiet; then
            echo "No change vs committed prices. Nothing to merge."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          H="$(python -c "import json;h=json.load(open('source-data/fuel_prices.json'))['headline'];print('diesel B%s/L, gasohol95 B%s/L'%(h['diesel'],h['gasohol95']))")"
          git commit -m "data: live fuel prices ($(date -u +%F), run ${{ github.run_id }})" \
                     -m "Pulled by .github/workflows/data-fuel-prices.yml — Bangchak retail ($H). Full 'bash tests/run.sh check' passed 0-failed before this auto-merge."
          if bash tests/run.sh check; then
            echo "Gate green — auto-merging to $BASE_BRANCH."
            # master may have advanced since checkout — rebase before pushing.
            git pull --rebase origin "$BASE_BRANCH"
            git push origin "HEAD:$BASE_BRANCH"
            echo "Fuel prices landed on $BASE_BRANCH ($H)."
          else
            echo "Gate RED — falling back to a draft PR for review."
            git checkout -b "$DATA_BRANCH"
            git push origin "$DATA_BRANCH"
            printf 'Automated daily fuel-price pull (run %s) from `%s` — GATE FAILED, needs review.\n\n**Headline:** %s\n\nMEASURED — Bangchak retail (Bangkok reference, THB/litre). Cloud-reachable; no key.\n' \
              "${{ github.run_id }}" "$BASE_BRANCH" "$H" > /tmp/pr_body.md
            gh pr create --draft --base "$BASE_BRANCH" --head "$DATA_BRANCH" \
              --title "data: live fuel prices ($(date -u +%F)) [gate failed]" --body-file /tmp/pr_body.md
          fi
