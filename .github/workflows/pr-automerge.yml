name: PR — auto-merge generated PRs once the gate is green

# WHY THIS EXISTS
# ---------------
# Nineteen workflows in this repo open PRs (data refreshes, census pulls, deck rebuilds), and the
# autonomous loop opens more. None of them could merge themselves, so every one waited on a human
# to click merge — and because master moves constantly, whatever was not merged promptly rotted
# into a conflict that the same human then had to resolve by hand. `pr-autoresolve.yml` already
# removes the *conflict* half of that chore. This removes the *clicking* half.
#
# WHAT MAKES THAT SAFE — and what it does not
# -------------------------------------------
# The determinism gate proves every committed platform/data layer reproduces byte-exactly from
# committed sources, plus `node --check` over every page's JS. For a data refresh that is a
# complete verification: there is nothing left for a human to judge. For a generated change to
# pipeline/ or app.js it is NOT complete — the gate proves the code parses and the data reproduces,
# not that the change is a good idea. Merging those unreviewed is a deliberate choice made by the
# owner (2026-08-15), traded for never hand-merging again. Master auto-deploys to Vercel, so
# anything this job merges is live within minutes.
#
# THE STALE-GREEN TRAP, which is the failure mode that actually bites
# ------------------------------------------------------------------
# A PR page showing a green check proves nothing on its own: qa.yml sets
# `concurrency: cancel-in-progress`, pushes made with GITHUB_TOKEN do not trigger workflows at all,
# and `pull_request`-triggered runs on bot commits sit at `action_required` and never execute. So a
# branch can easily carry a green tick that belongs to an OLDER commit, or no real run at all.
# This job therefore never reads "is the PR green" — it requires a qa.yml run whose headSha equals
# the PR's CURRENT head, whose status is completed and whose conclusion is success. Anything else
# gets a fresh gate dispatched and is left for the next tick.
#
# WHY ONE PR PER RUN
# ------------------
# Merging with GITHUB_TOKEN pushes master WITHOUT triggering any workflow. So merging two PRs in
# one pass would land the second having gated it against a master that no longer exists, and would
# leave every other open PR dirty with nothing scheduled to refresh them. Instead: merge exactly
# one, then explicitly dispatch pr-autoresolve so the rest are re-merged and re-gated against the
# new master. The QA-completion trigger below then brings us straight back here. The queue drains
# serially, and every PR is verified against the tree it actually lands on.
#
# One per run is NOT one CONSIDERED per run, and the difference matters. The queue is drained
# oldest-first, so if the scan stopped at the first PR it could not merge, a single red bot PR would
# block every PR behind it for as long as it stayed open — and a red one stays red until a human
# looks at it. So the scan skips past anything red, ungated or still running (reporting each) and
# merges the first PR that is genuinely green.

on:
  # Fires the moment any gate finishes, so a PR merges as soon as it goes green rather than
  # waiting for the next cron tick.
  workflow_run:
    workflows: ["QA"]
    types: [completed]
  # Safety net, and it had to get much tighter. The trigger above does NOT fire for the gates that
  # matter most: GitHub suppresses `workflow_run` for any run that was itself triggered by
  # GITHUB_TOKEN, and every bot PR's gate is a token-made dispatch. qa.yml now wakes this workflow
  # explicitly on success to close that hole, but a gate that is CANCELLED or never dispatched still
  # sends nothing at all, and this cron is the only thing that recovers it.
  #
  # It was every 6h, justified by each tick costing a billed minute. That justification expired when
  # this job moved to the self-hosted `thai` runner (#412) — ticks are now free, and the box is idle
  # between data pulls. Six hours of latency on a free check is a bad trade: on 2026-08-15 the gap
  # between #407 going green (03:29) and its next scheduled tick was long enough for the head to be
  # rewritten and the result discarded.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write         # merge the PR
  pull-requests: write    # mark ready + merge
  actions: write          # dispatch qa.yml / pr-autoresolve.yml

concurrency:
  # Two of these racing would each pick a candidate against a different master and double-merge.
  group: pr-automerge
  cancel-in-progress: false

jobs:
  automerge:
    # SELF-HOSTED ON PURPOSE — this is a private repo, so every GitHub-hosted minute is billed, and
    # the workflow_run trigger fires this once per QA completion (~66x/day). Billing rounds UP to
    # the minute per job, so even a 15-second run costs a full minute: ~2,000 billed minutes a month
    # for a job that usually decides there is nothing to do. It only calls the gh API — no checkout,
    # no pipeline, no network pulls — so unlike the data workflows, moving it off ubuntu cannot
    # change any source's reachability or provenance.
    #
    # THE `thai` BOX, NOT `ci`, for two measured reasons.
    #
    # Latency. `ci` is ONE serial executor and it carries the whole QA queue — 7 runs deep at the
    # time of writing, with the job at the head having waited two hours just to START. A merge
    # driver parked behind that fires hours after the gate it is reacting to, which reads as
    # "the automation is broken" long before it reads as "the automation is slow". `thai` runs one
    # scheduled workflow a day and is idle essentially always.
    #
    # Proven dependencies. This job needs `gh` and `python3` and nothing else, and `gh` had never
    # been exercised on `ci` — no workflow that runs there uses it, so pinning this there made a
    # never-executed job depend on an unverified binary. On `thai`, data-thai-swarm.yml calls
    # `gh pr create` on every run and opened #409 an hour ago, so both are known good.
    #
    # This does not breach qa.yml's "Thai feeds must never queue behind other work" rule, which is
    # about a 45-minute QA render blocking a nightly pull. This is a ~30-second sequence of gh API
    # calls with no checkout, no pipeline and no network pulls of its own; worst case a scheduled
    # pull starts half a minute late.
    runs-on: [self-hosted, thai]
    timeout-minutes: 15
    steps:
      # A self-hosted runner carries whatever its box happens to have, and this job's whole
      # behaviour is gh plus python3. If either is missing the steps below fail one at a time in
      # ways that read like logic bugs, on a job whose entire point is to run unattended. Fail once,
      # loudly, naming the runner instead.
      - name: Check this runner actually has gh and python3
        run: |
          set -uo pipefail
          MISSING=""
          command -v gh      >/dev/null 2>&1 || MISSING="$MISSING gh"
          command -v python3 >/dev/null 2>&1 || MISSING="$MISSING python3"
          if [ -n "$MISSING" ]; then
            echo "::error::runner '$RUNNER_NAME' is missing:$MISSING — pr-automerge cannot run here. Install it on the box, or move runs-on to a runner that has it."
            exit 1
          fi
          echo "runner '$RUNNER_NAME': gh $(gh --version | head -1 | awk '{print $3}'), $(python3 --version)"

      - name: List every eligible generated PR, oldest first
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          gh pr list --state open --base master --limit 50 \
            --json number,author,isDraft,headRefName,headRefOid,headRepositoryOwner,body,createdAt,mergeable,mergeStateStatus \
            > /tmp/prs.json

          # Python rather than a --jq one-liner: the eligibility rule spans two authorship classes
          # and three mergeability states, and shell-quoting that into jq is how it silently starts
          # matching the wrong PRs.
          # Step outputs are written to $GITHUB_OUTPUT explicitly rather than by redirecting this
          # whole block into it. Redirecting sends the ::notice:: annotations there too, and the
          # runner rejects the file with "Invalid format" — which fails the step for a reason that
          # has nothing to do with the decision it just made.
          python3 - <<'PY'
          import json, os, re

          owner = os.environ["OWNER"]
          prs = json.load(open("/tmp/prs.json"))
          out = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")

          # The two classes of generated PR, which do NOT share an author:
          #   * data refreshes / census pulls / deck rebuilds -> app/github-actions
          #   * the autonomous loop's own PRs                 -> run under the OWNER's account, so
          #     they are indistinguishable from hand-written ones by author. They carry a
          #     "Generated by/with [Claude Code]" line in the body; that marker is the only
          #     reliable discriminator, so a hand-written PR stays untouched.
          MARKER = re.compile(r"Generated (?:by|with) \[Claude Code\]", re.I)

          # BOT LOGINS ARE NOT WHAT THEY LOOK LIKE. `gh pr list --json author` reports a GitHub App
          # as login "app/github-actions" — not "github-actions", and not "github-actions[bot]"
          # either, which is the form that appears in the web UI and in most documentation. Matching
          # only the un-prefixed spellings made this job classify every single bot PR as
          # hand-written and merge nothing at all, silently, while looking like it was working.
          # `is_bot` is the field that actually means what it says; the login set is kept as a
          # belt-and-braces fallback and is compared on the last path segment.
          def generated(pr):
              a = pr.get("author") or {}
              if a.get("is_bot"):
                  return True
              if (a.get("login") or "").split("/")[-1] in ("github-actions", "github-actions[bot]"):
                  return True
              return bool(MARKER.search(pr.get("body") or ""))

          # EVERY eligible PR, not just the first. The gate verdict is not known yet at this point,
          # and a PR whose gate is red is still "eligible" here — so returning only the oldest would
          # hand the next step a single candidate that it might have to reject, with nothing else to
          # fall back to. One stuck red PR would then block every PR behind it for as long as it
          # stayed open. The next step walks this list and skips past the ones it cannot merge.
          skipped = []
          promote = []
          cands = []
          for pr in sorted(prs, key=lambda p: p["createdAt"]):        # oldest first, drain in order
              n = pr["number"]
              if (pr.get("headRepositoryOwner") or {}).get("login") != owner:
                  continue                                            # fork: cannot push or trust
              if not generated(pr):
                  skipped.append("#%d hand-written, left for a human" % n)
                  continue
              # DEADLOCK GUARD. pr-autoresolve skips drafts (a cost decision) and this job skips
              # DIRTY ones (they are autoresolve's job) — so a generated PR that is BOTH would be
              # touched by neither and wedge forever. Every generated PR is meant to merge, so
              # promote them all out of draft on sight; that hands drafts to autoresolve and is
              # what makes them merge-eligible here.
              if pr["isDraft"]:
                  promote.append(n)
              st = pr.get("mergeStateStatus")
              if st == "DIRTY":
                  skipped.append("#%d conflicts — pr-autoresolve's job" % n)
                  continue
              if st == "UNKNOWN" or pr.get("mergeable") == "UNKNOWN":
                  # Routine rather than exceptional: GitHub recomputes mergeability lazily, so every
                  # open PR reads UNKNOWN for a while after master moves — which is exactly when this
                  # job runs. Waiting a tick is correct; the next gate completion brings us back.
                  skipped.append("#%d mergeability still computing" % n)
                  continue
              cands.append({"number": n, "branch": pr["headRefName"],
                            "sha": pr["headRefOid"], "draft": bool(pr["isDraft"])})

          for s in skipped:
              print("::notice::%s" % s)                      # stdout -> log annotation

          out.write("promote=%s\n" % " ".join(str(n) for n in promote))
          out.write("found=%s\n" % ("yes" if cands else "none"))
          out.write("candidates=%s\n" % json.dumps(cands, separators=(",", ":")))
          out.close()
          PY

      # Runs even when nothing is mergeable this tick: a wedged draft must be promoted so that
      # pr-autoresolve starts refreshing it, which is what eventually makes it mergeable at all.
      - name: Promote generated drafts so autoresolve stops skipping them
        if: steps.pick.outputs.promote != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE: ${{ steps.pick.outputs.promote }}
        run: |
          set -uo pipefail
          for n in $PROMOTE; do
            gh pr ready "$n" && echo "marked #$n ready (was a generated draft)" \
              || echo "::warning::could not mark #$n ready"
          done

      - name: Require a gate run on THIS EXACT head, then merge
        if: steps.pick.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDS: ${{ steps.pick.outputs.candidates }}
        run: |
          set -uo pipefail

          # Only runs whose headSha IS this PR's current head count. See the stale-green note above.
          gh run list --workflow qa.yml --limit 100 \
            --json headSha,status,conclusion,databaseId > /tmp/runs.json

          # Walks the candidates oldest-first and returns ONE action. Kept in Python, and kept as a
          # decision rather than an action, so tests/test_pr_automerge_logic.py can extract and
          # exercise it against fixtures — a workflow cannot otherwise be tested without merging
          # something for real.
          DECIDE=$(python3 -c "
          import json,os
          cands=json.loads(os.environ['CANDS'])
          runs=json.load(open('/tmp/runs.json'))
          bad={'failure','timed_out','startup_failure'}
          def verdict(sha):
              rs=[r for r in runs if r['headSha']==sha]
              done=[r for r in rs if r['status']=='completed']
              concl={str(r['conclusion']) for r in done}
              # 'cancelled' and 'action_required' are NOT verdicts — they mean the gate never ran.
              # Treating them as red is the bug that silently wedges a PR forever, and qa.yml
              # cancels runs routinely while bot PRs land on action_required by default. Only a
              # real failure/timed_out counts as red; everything inconclusive falls to 'absent'.
              if 'success' in concl:    return 'green'
              if len(done)<len(rs):     return 'running'
              if concl & bad:           return 'red:'+','.join(sorted(concl & bad))
              return 'absent'
          decision='none|||'
          first_absent=None
          notes=[]
          for c in cands:
              v=verdict(c['sha'])
              if v=='green':
                  decision='merge|%d|%s|%s|%s'%(c['number'],c['branch'],c['sha'],
                                                str(c['draft']).lower())
                  break
              if v.startswith('red'):
                  # NOT fatal to the run. A red PR is skipped and the queue behind it keeps moving;
                  # stopping here is what would let one stuck PR block every other one.
                  notes.append('::error::#%d — gate on the current head concluded %s. Skipping it; '
                               'this one needs you.'%(c['number'],v[4:]))
              elif v=='running':
                  notes.append('::notice::#%d — gate still running on its current head.'%c['number'])
              else:
                  notes.append('::notice::#%d — no gate run exists for its current head.'%c['number'])
                  if first_absent is None: first_absent=c
          if decision=='none|||' and first_absent is not None:
              # At most ONE dispatch per tick. Asking for a gate on every ungated PR at once would
              # queue several 40-minute runs onto a single serial self-hosted executor, and the
              # workflow_run trigger brings us straight back here when the first one lands anyway.
              decision='dispatch|%d|%s||'%(first_absent['number'],first_absent['branch'])
          for n in notes: print(n)
          print(decision)
          ")
          echo "$DECIDE"
          ACTION=$(printf '%s' "$DECIDE" | tail -1)
          IFS='|' read -r VERB NUM BRANCH SHA DRAFT <<< "$ACTION"

          if [ "$VERB" = "none" ]; then
            echo "Nothing mergeable this tick." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$VERB" = "dispatch" ]; then
            # Expected for a freshly-opened bot PR: its push was made with GITHUB_TOKEN (no workflow
            # trigger) and its pull_request run sits at action_required. Ask for a real one; the
            # workflow_run trigger brings us back when it finishes.
            gh workflow run qa.yml --ref "$BRANCH" \
              && echo "dispatched qa.yml on $BRANCH (for #$NUM)" \
              || echo "::error::qa.yml dispatch FAILED for #$NUM — merge it by hand or re-dispatch."
            exit 0
          fi

          echo "PR #$NUM ($BRANCH @ ${SHA:0:8}) is green on its current head — merging."

          # A draft cannot be merged, and pr-autoresolve deliberately skips drafts — so a generated
          # PR left as a draft would never be refreshed OR merged. Promote it now that it is green.
          if [ "$DRAFT" = "true" ]; then
            gh pr ready "$NUM" && echo "marked #$NUM ready (was a draft)"
          fi

          if gh pr merge "$NUM" --squash --delete-branch; then
            echo "merged #$NUM" >> "$GITHUB_STEP_SUMMARY"

            # The branch is gone but its gate is not. Deleting a branch does NOT cancel the qa.yml
            # runs already queued against it, and on a single serial self-hosted runner those keep
            # their place in line and execute in full for a PR that no longer exists. Observed
            # 2026-08-15: a 40-minute gate for an already-merged branch was holding the executor
            # while three live PRs waited behind it. Free the box.
            for R in $(gh run list --workflow qa.yml --branch "$BRANCH" --limit 20 \
                         --json databaseId,status \
                         --jq '.[]|select(.status!="completed")|.databaseId'); do
              gh run cancel "$R" >/dev/null 2>&1 \
                && echo "cancelled qa run $R (branch $BRANCH is merged and deleted)"
            done
          else
            echo "::error::#$NUM — merge call failed (branch moved, or a check turned required mid-run)."
            exit 0
          fi

          # This merge pushed master with GITHUB_TOKEN, which triggers NOTHING — not pr-autoresolve,
          # not qa. Every other open PR is now stale with nothing scheduled to fix it, so ask
          # explicitly. This is the step that keeps the queue draining without a human.
          gh workflow run pr-autoresolve.yml \
            && echo "dispatched pr-autoresolve to refresh the remaining PRs" \
            || echo "::error::pr-autoresolve dispatch FAILED — remaining PRs may sit stale until the next master push."

      - name: Nothing to do
        if: steps.pick.outputs.found == 'none'
        run: echo "No eligible generated PR is ready to merge." >> "$GITHUB_STEP_SUMMARY"
