name: Data — OAE farm-gate prices (weekly)

# Pulls fresh MEASURED Thai farm-gate prices (ราคาที่เกษตรกรขายได้) from the OAE
# CKAN catalog (catalog.oae.go.th) — plan item P3 in docs/DATA_ACQUISITION_PLAN.md.
#
# WHY THIS WORKS HERE: GitHub-hosted runners have unrestricted internet, and
# catalog.oae.go.th is nginx (not Cloudflare-geoblocked), so a foreign runner IP
# reaches it — unlike the cloud sandbox (session-policy 403) and unlike the
# data.go.th / DLT family (Thai-IP-only; NOT touched by this workflow).
#
# WHAT IT PRODUCES: source-data/oae_farmgate_prices.json — real farm-gate prices
# with YoY computed from the series itself (pipeline/pull_oae_prices.py, full
# provenance meta, MEASURED label, nothing fabricated). When that file changed,
# platform/data/crop_stress.json is rebuilt so the price leg flips from the
# World Bank GLOBAL proxy to MEASURED-OAE for matched crops.
#
# Results are committed to a fresh data/oae-<run_id> branch and opened as a
# DRAFT PR back to the branch this ran on (cron runs use the default branch) —
# this workflow NEVER pushes to your working branch, so it can't race a
# concurrent session. Review the PR (check the vintage + YoY numbers look sane),
# then merge. No-ops cleanly when the upstream data hasn't changed.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Search the catalog + list resources only (no write, no PR)"
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly, Monday 02:00 UTC (= 09:00 Bangkok Monday morning)
    - cron: "0 2 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Same pin as qa.yml: match the Python the committed data is generated under.
          python-version: "3.11"

      - name: Install deps (openpyxl — only needed if the OAE resource is XLSX)
        run: pip install openpyxl

      - name: Offline selftest (prove the parse path before touching the network)
        run: python pipeline/pull_oae_prices.py --selftest

      - name: Pull OAE farm-gate prices
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python pipeline/pull_oae_prices.py --dry-run
            exit 0
          fi
          # --stamp = the pull date (provenance); the script itself never embeds
          # a wall clock, so re-runs with unchanged upstream data are byte-stable.
          python pipeline/pull_oae_prices.py --stamp "$(date -u +%F)"

      - name: Rebuild crop_stress when the landing file changed
        if: ${{ inputs.dry_run != true }}
        run: |
          if git status --porcelain -- source-data/oae_farmgate_prices.json | grep -q .; then
            echo "landing file changed — rebuilding platform/data/crop_stress.json"
            python pipeline/build_crop_stress.py
          else
            echo "landing file unchanged — nothing to rebuild."
          fi

      - name: Commit to a data branch + open a draft PR
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          DATA_BRANCH: data/oae-${{ github.run_id }}
        run: |
          # Only the two data files this workflow owns — never anything else.
          git add source-data/oae_farmgate_prices.json platform/data/crop_stress.json
          if git diff --cached --quiet; then
            echo "No change vs the committed data (same upstream vintage)."
            echo "Nothing to commit — no PR opened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$DATA_BRANCH"
          VINTAGE="$(python -c "import json;print(json.load(open('source-data/oae_farmgate_prices.json'))['meta']['vintage'])")"
          CROPS="$(python -c "import json;print(', '.join(json.load(open('source-data/oae_farmgate_prices.json'))['meta']['crops_covered']))")"
          git commit -m "data: OAE farm-gate prices, vintage $VINTAGE (run ${{ github.run_id }})" \
                     -m "Pulled by .github/workflows/data-oae-prices.yml via pipeline/pull_oae_prices.py — MEASURED Thai farm-gate (ราคาที่เกษตรกรขายได้). crop_stress.json rebuilt to prefer it over the World Bank GLOBAL proxy."
          git push origin "$DATA_BRANCH"
          {
            echo "Automated weekly OAE farm-gate price pull (run ${{ github.run_id }}), dispatched from \`$BASE_BRANCH\`."
            echo
            echo "**Vintage:** $VINTAGE — **crops with a measured YoY:** $CROPS"
            echo
            echo "**Files:**"
            echo '```'
            git diff --name-only HEAD~1
            echo '```'
            echo
            echo "Provenance: MEASURED — OAE ราคาที่เกษตรกรขายได้ (prices farmers actually"
            echo "received), YoY computed from the series itself. Full dataset/resource ids in"
            echo "the landing file's meta. Nothing fabricated. crop_stress.json's price leg now"
            echo "reads MEASURED-OAE for the matched crops (meta.price_sources says which crop"
            echo "uses which source); unmatched crops keep the labelled World Bank GLOBAL proxy."
            echo
            echo "**Before merging** (crop_stress.json feeds downstream layers — rebuild them so"
            echo "the QA determinism gate stays green after merge):"
            echo '```'
            echo "cd pipeline"
            echo "python3 build_amphoe.py && python3 build_occupation_risk.py"
            echo "python3 build_branch_risk.py && python3 build_province_risk.py"
            echo "python3 build_opportunity_score.py && python3 build_exit_whitespace.py"
            echo "python3 build_branch_labor.py && python3 timeseries.py   # record the vintage"
            echo "bash ../tests/run.sh check"
            echo '```'
          } > /tmp/pr_body.md
          gh pr create --draft \
            --base "$BASE_BRANCH" \
            --head "$DATA_BRANCH" \
            --title "data: OAE farm-gate prices, vintage $VINTAGE (run ${{ github.run_id }})" \
            --body-file /tmp/pr_body.md
